<style>
/* ============ 基礎與配色（溫暖手帳風，已通過色彩驗證） ============ */
:root{
  --paper:#F6F1E7; --card:#FCF9F2; --card2:#F9F4E9; --field:#FFFDF8;
  --ink:#453B2F; --ink2:#6F6455; --ink3:#817563;
  --line:rgba(93,72,48,.16); --line-soft:rgba(93,72,48,.09);
  --acc:#B85C43; --acc-deep:#9E4C36; --acc-soft:#F2E2DA; --acc-tint:rgba(184,92,67,.12);
  --sage:#5B7A3D; --sage-deep:#47632F; --sage-soft:#E9EDDA; --sage-track:#E7EBD8;
  --gold:#C9A24B; --gold-soft:#F3EAD3;
  --h0:#EFE7D5; --h1:#A6B478; --h2:#7F9854; --h3:#5B7A3D; --h4:#3F5B2A;
  --m1:#B4432B; --m2:#D28A6F; --m3:#B3A896; --m4:#93A877; --m5:#567A40;
  /* 生活領域調色盤（已通過 CVD / 對比驗證，顏色恆常搭配文字標籤，從不單獨承擔辨識） */
  --ap-blue:#2B5FA5; --ap-orange:#E07A3C; --ap-green:#3C7A38; --ap-purple:#A96FC4;
  --ap-red:#B4432B; --ap-teal:#2A7570; --ap-gold:#8A6D1F; --ap-slate:#5A6B7B;
  --r:16px;
  --serif:"New York", ui-serif, "Songti TC", "Noto Serif TC", "PingFang TC", Georgia, serif;
  --sans:-apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Helvetica Neue", Arial, sans-serif;
  --shadow:0 1px 2px rgba(90,70,45,.05), 0 5px 16px rgba(90,70,45,.07);
  --tabbar-h:60px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  font-family:var(--sans); color:var(--ink); background:var(--paper);
  background-image:radial-gradient(rgba(90,70,45,.05) 1px, transparent 1.2px);
  background-size:22px 22px;
  min-height:100%; line-height:1.5;
  -webkit-font-smoothing:antialiased; text-size-adjust:100%; -webkit-text-size-adjust:100%;
  overscroll-behavior-y:none;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--ink3)}
[hidden]{display:none !important}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[role="button"]:focus-visible{
  outline:3px solid rgba(184,92,67,.38);outline-offset:2px;
}

/* ============ 版面骨架 ============ */
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 28px)}
#storageBanner{
  max-width:560px;margin:0 auto 12px;padding:10px 14px;border-radius:12px;
  background:var(--gold-soft);border:1px solid rgba(160,120,40,.25);color:#6B5620;font-size:13px;line-height:1.7;
}
#storageBanner.danger{background:var(--acc-soft);border-color:var(--acc);color:var(--acc-deep)}
#storageBanner button{color:inherit}
/* 底部分頁列 */
#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:flex;justify-content:center;
  background:rgba(252,249,242,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-top:1px solid var(--line-soft);
  padding-bottom:env(safe-area-inset-bottom);
}
#tabbar .inner{display:flex;width:100%;max-width:560px}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 0 6px;color:var(--ink3);font-size:10.5px;letter-spacing:.02em;
  transition:color .15s;
}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--acc)}
.tab:active{opacity:.7}

/* ============ 通用元件 ============ */
.card{
  position:relative;background:var(--card);border:1px solid var(--line-soft);
  border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;
}
.card.pad-s{padding:13px 14px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin:2px 2px 14px}
.page-head h1{font-family:var(--serif);font-size:25px;font-weight:700;letter-spacing:.02em}
.page-head .sub{font-size:12.5px;color:var(--ink2);margin-top:2px}
.icon-btn{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);
  background:var(--card);border:1px solid var(--line-soft);box-shadow:var(--shadow);flex:none;
}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:19px;height:19px}
.sec-title{
  display:flex;align-items:center;gap:8px;
  font-family:var(--serif);font-size:14.5px;font-weight:700;color:var(--ink2);
  letter-spacing:.08em;margin:0 0 10px;
}
.sec-title::before{content:"";width:8px;height:8px;border-radius:2.5px;background:var(--acc);opacity:.75;transform:rotate(45deg);flex:none}
.sec-title .right{margin-left:auto;font-family:var(--sans);font-weight:500;letter-spacing:0;font-size:12.5px;color:var(--ink3)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--acc);color:#fff;font-size:15px;font-weight:600;
  border-radius:13px;padding:12px 18px;transition:transform .1s;
}
.btn svg{width:18px;height:18px;flex:none}
.btn:active{transform:scale(.97);background:var(--acc-deep)}
.btn.full{width:100%}
.btn.ghost{background:transparent;color:var(--acc);border:1.5px solid var(--acc-tint);background:var(--acc-soft)}
.btn.ghost:active{background:var(--acc-tint)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.plain{background:var(--card2);color:var(--ink2);border:1px solid var(--line)}
.btn.plain:active{background:var(--line-soft)}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:999px;
  background:var(--card2);border:1px solid var(--line-soft);font-size:13.5px;color:var(--ink2);
}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.hint{font-size:12.5px;color:var(--ink3)}
.link{color:var(--acc);font-weight:650;text-decoration:underline;text-underline-offset:2.5px;text-decoration-thickness:1.5px}
.link:active{opacity:.65}
.divider{border:none;border-top:1px dashed var(--line);margin:12px 0}
.empty{
  text-align:center;padding:26px 12px;color:var(--ink3);font-size:14px;
}
.empty .big{font-size:34px;margin-bottom:8px;opacity:.9}
.empty .art{display:block;width:112px;height:auto;margin:0 auto 12px}
.field{
  width:100%;background:var(--field);border:1px solid var(--line);border-radius:12px;
  padding:11px 13px;font-size:16px;outline:none;
}
.field:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-tint)}
textarea.field{resize:none;min-height:120px;line-height:1.7}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.toolbar{display:flex;gap:7px;overflow-x:auto;padding:1px 1px 5px;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.toolbar .chip{flex:none}
.select-field{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:7px 30px 7px 10px;font-size:13px;outline:none}
.filter-count{font-size:10px;opacity:.75;margin-left:2px}
.drop-zone.drag-over{outline:2px dashed var(--acc);outline-offset:3px;background:var(--acc-soft)}
.t-item[draggable="true"]{cursor:grab}
.t-item.dragging{opacity:.45}
.drag-handle{width:28px;min-height:34px;display:grid;place-items:center;color:var(--ink3);font-size:18px;cursor:grab;touch-action:none;flex:none}
.touch-dragging{opacity:.55;transform:scale(.985);box-shadow:0 6px 18px rgba(70,50,30,.16);z-index:3}
.drag-target{outline:2px dashed var(--acc);outline-offset:2px;border-radius:10px}
.today-drop-zone{transition:background .15s,outline .15s}
.today-drop-zone.drag-over{background:var(--acc-soft);outline:2px dashed var(--acc);outline-offset:3px}
.move-btn{padding:6px 7px;color:var(--ink3);flex:none;border-radius:8px}
.move-btn:active{background:var(--card2)}
.repeat-badge{color:var(--acc-deep);background:var(--acc-soft);border-color:transparent}
.rep-ic{font-size:19px;width:22px;text-align:center;flex:none;color:var(--acc)}
.rep-ic.off{color:var(--ink3);font-weight:700;letter-spacing:-1px}
.pause-tag{display:inline-block;margin-left:8px;vertical-align:middle;font-family:var(--sans);font-size:11.5px;font-weight:600;
  color:var(--ink2);background:var(--card2);border:1px solid var(--line-soft);border-radius:7px;padding:2px 8px}
.due-badge{color:#6B5620;background:var(--gold-soft);border-color:transparent}
@media (prefers-color-scheme:dark){.due-badge{color:#E4CE94}}
.morning-note{font-size:13px;color:var(--ink2);margin:-3px 0 12px;line-height:1.7}
.nudge{padding:10px 11px;margin-top:10px;border-radius:11px;background:var(--card2);font-size:13px;color:var(--ink2);line-height:1.65}
.nudge button{color:var(--acc);font-weight:650;margin-left:4px}
.rest-badge{font-size:11px;color:#6B5620;background:var(--gold-soft);border-radius:7px;padding:2px 7px}
.repeat-row{padding:10px 1px;border-bottom:1px dashed var(--line-soft)}
.repeat-row:last-child{border-bottom:none}
.search-wrap{position:relative}
.search-wrap .field{padding-left:38px}
.search-wrap::before{content:"⌕";position:absolute;left:13px;top:7px;font-size:21px;color:var(--ink3);z-index:1}
.review-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:9px 0}
.review-stat{background:var(--card2);border:1px solid var(--line-soft);border-radius:11px;padding:9px}
.review-stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums;line-height:1.25;white-space:nowrap}
.review-stat span{display:block;font-size:11px;color:var(--ink2);line-height:1.4;margin-top:1px}
.due-chip{flex:none;font-size:11.5px;color:#6B5620;background:var(--gold-soft);border-radius:7px;padding:3px 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (prefers-color-scheme:dark){.due-chip{color:#E4CE94}}
mark.hl{background:var(--gold-soft);color:inherit;border-radius:4px;padding:0 2px;font-weight:650;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.record-card{border-left:3px solid var(--gold)}
.record-date{font-size:12px;color:var(--ink3);margin-top:3px}
.global-results{max-height:55dvh;overflow-y:auto;margin-top:9px}
.result-group{font-family:var(--serif);font-size:13px;font-weight:700;color:var(--ink2);margin:12px 2px 5px}
.result-item{width:100%;display:flex;gap:9px;align-items:flex-start;text-align:left;padding:9px 3px;border-bottom:1px dashed var(--line-soft)}
.result-item:last-child{border-bottom:none}
.onboard-steps{display:grid;gap:9px;margin-top:10px}
.onboard-step{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:11px;background:var(--card2)}
.onboard-step b{width:23px;height:23px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;flex:none;font-size:12px}
.onboard-step.done{opacity:.6}.onboard-step.done b{background:var(--sage);color:white}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
@media (prefers-contrast:more){
  :root{--line:rgba(60,42,24,.34);--line-soft:rgba(60,42,24,.22);--ink3:#655A4C}
  .card{border-color:var(--line)}
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#1F1C18;--card:#29251F;--card2:#312C25;--field:#25211C;
    --ink:#F1E8DB;--ink2:#CFC1AF;--ink3:#AA9C89;--line:rgba(242,226,204,.19);--line-soft:rgba(242,226,204,.11);
    --acc:#D77B60;--acc-deep:#E48A70;--acc-soft:#472D25;--acc-tint:rgba(215,123,96,.18);
    --sage:#87A966;--sage-deep:#A8C88A;--sage-soft:#2F3827;--sage-track:#3B4134;--gold:#D9B45F;--gold-soft:#443922;--h0:#3A342A;
    --h1:#4E6136;--h2:#657F44;--h3:#7C9C53;--h4:#95B968;
    --m1:#E0745A;--m2:#D9A188;--m3:#A79A88;--m4:#9DBA7C;--m5:#7FA85F;
    /* 深色底下把領域色提亮，維持同樣的辨識度與對比 */
    --ap-blue:#7BAEEC;--ap-orange:#F0A268;--ap-green:#78C271;--ap-purple:#C89FE3;
    --ap-red:#E0745A;--ap-teal:#6FC3BC;--ap-gold:#D9B45F;--ap-slate:#A3B4C4;
    --shadow:0 1px 2px rgba(0,0,0,.18),0 7px 20px rgba(0,0,0,.16);
  }
  body{background-image:radial-gradient(rgba(245,230,205,.045) 1px,transparent 1.2px)}
  #tabbar{background:rgba(41,37,31,.92)}#toast{background:#EDE3D5;color:#29231D}
}
/* ============ 可選配色 ============
   只覆蓋色票，版面與間距完全不動；深色模式各有一套對應值。
   每組都維持原本的對比關係：紙、卡、墨、強調、量表五層。 */
body[data-theme="sea"]{
  --paper:#EEF2F5;--card:#F9FBFC;--card2:#F1F5F8;--field:#FCFDFE;
  --ink:#2C3A44;--ink2:#54666F;--ink3:#6D7F89;
  --line:rgba(40,70,88,.16);--line-soft:rgba(40,70,88,.09);
  --acc:#2E6E8E;--acc-deep:#245A76;--acc-soft:#DCE9F0;--acc-tint:rgba(46,110,142,.12);
  --sage:#3E7F76;--sage-deep:#2F675F;--sage-soft:#DDEDE9;--sage-track:#DAEAE6;
  --gold:#B08A3E;--gold-soft:#F0E7D3;
  --h0:#E3EBEF;--h1:#A9C9CD;--h2:#7FAFB4;--h3:#3E7F76;--h4:#2B5F58;
}
body[data-theme="forest"]{
  --paper:#F0F3EC;--card:#FAFBF7;--card2:#F2F6ED;--field:#FCFDFA;
  --ink:#333B2E;--ink2:#5A6552;--ink3:#727D69;
  --line:rgba(60,75,45,.16);--line-soft:rgba(60,75,45,.09);
  --acc:#A2622F;--acc-deep:#8A5228;--acc-soft:#F1E4D7;--acc-tint:rgba(162,98,47,.12);
  --sage:#4F7A3C;--sage-deep:#3C612C;--sage-soft:#E4EDDA;--sage-track:#E2EBD8;
  --gold:#AE8F33;--gold-soft:#F1EACF;
  --h0:#E6EBE0;--h1:#AAC094;--h2:#7FA167;--h3:#4F7A3C;--h4:#3A5E2B;
}
body[data-theme="rose"]{
  --paper:#F7F0F1;--card:#FDF9FA;--card2:#F8F1F3;--field:#FFFCFD;
  --ink:#43333A;--ink2:#6B5A61;--ink3:#82717A;
  --line:rgba(90,55,70,.16);--line-soft:rgba(90,55,70,.09);
  --acc:#A84A62;--acc-deep:#8E3C52;--acc-soft:#F3DFE5;--acc-tint:rgba(168,74,98,.12);
  --sage:#6B7A52;--sage-deep:#57663F;--sage-soft:#EAEEDF;--sage-track:#E8ECDD;
  --gold:#B8933F;--gold-soft:#F3EAD4;
  --h0:#EFE6E9;--h1:#C1BE99;--h2:#98A272;--h3:#6B7A52;--h4:#51603C;
}
@media (prefers-color-scheme:dark){
  body[data-theme="sea"]{
    --paper:#151B21;--card:#1F272E;--card2:#273139;--field:#1A2229;
    --ink:#E3ECF2;--ink2:#B7C7D1;--ink3:#92A4AF;
    --line:rgba(210,232,245,.19);--line-soft:rgba(210,232,245,.11);
    --acc:#6BAAC9;--acc-deep:#84BCD8;--acc-soft:#1F3B4A;--acc-tint:rgba(107,170,201,.18);
    --sage:#63AFA3;--sage-deep:#7FC5B9;--sage-soft:#1D3733;--sage-track:#27403C;
    --gold:#CFAA61;--gold-soft:#3B3520;
    --h0:#26313A;--h1:#2F5A58;--h2:#3C766F;--h3:#4E9187;--h4:#63AFA3;
  }
  body[data-theme="forest"]{
    --paper:#181C15;--card:#22271D;--card2:#2A3125;--field:#1D2218;
    --ink:#E9EFE0;--ink2:#C2CCB4;--ink3:#9CA890;
    --line:rgba(225,240,210,.19);--line-soft:rgba(225,240,210,.11);
    --acc:#D08A55;--acc-deep:#E09B66;--acc-soft:#3D2A1B;--acc-tint:rgba(208,138,85,.18);
    --sage:#87A966;--sage-deep:#A8C88A;--sage-soft:#2A331F;--sage-track:#333C28;
    --gold:#CBAA55;--gold-soft:#38321C;
    --h0:#2A3123;--h1:#3E5230;--h2:#54703F;--h3:#6C8F52;--h4:#87A966;
  }
  body[data-theme="rose"]{
    --paper:#1E181A;--card:#292124;--card2:#31282C;--field:#241D20;
    --ink:#F2E6EA;--ink2:#CFBCC3;--ink3:#AC98A0;
    --line:rgba(245,225,235,.19);--line-soft:rgba(245,225,235,.11);
    --acc:#DD8098;--acc-deep:#E894AA;--acc-soft:#452630;--acc-tint:rgba(221,128,152,.18);
    --sage:#9BA877;--sage-deep:#B4C08F;--sage-soft:#2F3626;--sage-track:#383F2E;
    --gold:#D3AF62;--gold-soft:#3E3620;
    --h0:#332A2E;--h1:#4C5138;--h2:#666E48;--h3:#818C5C;--h4:#9BA877;
  }
}

@media (min-width:760px){#app{max-width:680px}.card{padding:18px}.page-head h1{font-size:28px}}
body.text-large .tt,body.text-large .h-name,body.text-large .g-title,body.text-large .f-item .tt{font-size:18px}
body.text-large .hint,body.text-large .sub,body.text-large .h-sub{font-size:14px}
body.text-large .field,body.text-large input,body.text-large textarea,body.text-large select{font-size:18px}
body.text-large .btn,body.text-large .chip{font-size:15px}

/* 勾選圓圈 */
.ck{
  width:25px;height:25px;border-radius:50%;border:1.8px solid var(--ink3);
  display:grid;place-items:center;flex:none;transition:all .18s;background:transparent;
}
.ck svg{width:13px;height:13px;color:#fff;opacity:0;transform:scale(.4);transition:all .18s}
.ck.on{background:var(--h3);border-color:var(--h3)}
.ck.on svg{opacity:1;transform:scale(1)}

/* 統計小卡 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line-soft);border-radius:14px;box-shadow:var(--shadow);padding:11px 12px}
.stat .lb{font-size:11px;color:var(--ink2);letter-spacing:.03em}
.stat .v{font-size:19px;font-weight:650;margin-top:2px}
.stat .v small{font-size:12px;font-weight:500;color:var(--ink3);margin-left:1px}

/* 進度條（量表：填色=鼠尾草綠，軌道=同色系淺階） */
.meter{height:8px;border-radius:99px;background:var(--sage-track);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--sage);transition:width .3s}

/* ============ 今日頁 ============ */
.greet-card{padding:20px 18px 17px;margin-top:10px;overflow:visible}
.tape{
  position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(-2.5deg);
  width:92px;height:22px;border-radius:3px;
  background:linear-gradient(90deg, rgba(184,92,67,.30), rgba(201,162,75,.30));
  box-shadow:0 1px 2px rgba(90,70,45,.10);
}
.greet-date{font-family:var(--serif);font-size:23px;font-weight:700;letter-spacing:.03em}
.greet-hello{font-size:13.5px;color:var(--ink2);margin-top:3px}
.greet-quote{
  margin-top:12px;padding-top:11px;border-top:1px dashed var(--line);
  font-family:var(--serif);font-size:14.5px;color:var(--ink2);line-height:1.75;
}
.greet-quote{display:flex;align-items:flex-start;gap:6px}
.qt-tap{flex:1;min-width:0;text-align:left;font:inherit;color:inherit}
.qt-tap:active{opacity:.6}
.qt-next{
  flex:none;width:30px;height:30px;margin-top:-2px;border-radius:50%;
  display:grid;place-items:center;font-size:15px;color:var(--ink3);
  background:var(--card2);border:1px solid var(--line-soft);
}
.qt-next:active{transform:rotate(-90deg) scale(.92);color:var(--acc)}
.greet-quote .qt::before{content:"「";color:var(--acc);font-weight:700}
.greet-quote .qt::after{content:"」";color:var(--acc);font-weight:700}
.quote-by{display:block;margin-top:6px;font-family:var(--sans);font-size:12px;color:var(--ink3);letter-spacing:.03em}

/* 待辦項目 */
.t-item{display:flex;align-items:center;gap:11px;padding:10px 2px;border-bottom:1px dashed var(--line-soft)}
.t-item:last-child{border-bottom:none}
.t-item .tt{font-size:15.5px;word-break:break-word}
.t-item.done .tt{color:var(--ink3);text-decoration:line-through;text-decoration-color:rgba(154,140,119,.7)}
.t-item .meta{display:flex;gap:5px;margin-top:2px;flex-wrap:wrap}
.t-tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--ink2);background:var(--card2);border:1px solid var(--line-soft);border-radius:6px;padding:1.5px 7px}
.t-tag.goal{color:var(--sage-deep);background:var(--sage-soft);border-color:transparent}
.open-edit{padding:6px;color:var(--ink3);flex:none}
.open-edit svg{width:17px;height:17px}
.hm-nav svg{width:19px;height:19px}
.quickadd{display:flex;gap:8px;margin-top:10px}
.quickadd .field{flex:1}
.quickadd .btn{padding:0 16px;border-radius:12px;flex:none}

/* 習慣列 */
.h-item{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px dashed var(--line-soft)}
.h-item:last-child{border-bottom:none}
.h-emoji{width:40px;height:40px;border-radius:12px;background:var(--card2);border:1px solid var(--line-soft);display:grid;place-items:center;font-size:20px;flex:none}
.h-name{font-size:15.5px;font-weight:550}
.h-sub{font-size:12px;color:var(--ink3);margin-top:1px}
.h-sub .streak{color:var(--acc);font-weight:600}
.h-check{
  width:42px;height:42px;border-radius:50%;border:2px solid var(--line);
  display:grid;place-items:center;flex:none;transition:all .2s;font-size:0;
}
.h-check svg{width:19px;height:19px;color:#fff;opacity:0;transform:scale(.4);transition:all .2s}
.h-check.on{background:var(--h3);border-color:var(--h3)}
.h-check.on svg{opacity:1;transform:scale(1)}
.h-check:active{transform:scale(.92)}

/* 7天小圓點 */
.dots7{display:flex;gap:7px;margin-top:8px}
.dot7{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}
.dot7 b,.dot7 button{
  width:100%;max-width:30px;aspect-ratio:1;border-radius:50%;background:var(--h0);
  display:grid;place-items:center;transition:all .15s;
}
.dot7 b.on,.dot7 button.on{background:var(--h3)}
.dot7 b.rest,.dot7 button.rest{background:var(--gold-soft);border:1px solid rgba(160,120,40,.24)}
.dot7 b.today,.dot7 button.today{outline:2px solid var(--acc);outline-offset:1.5px}
.dot7 span{font-size:10px;color:var(--ink3)}
.dot7 b:active,.dot7 button:active{transform:scale(.9)}

/* ============ 月曆熱度圖 ============ */
.hm-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.hm-head .m{font-family:var(--serif);font-size:16.5px;font-weight:700}
.hm-nav{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink2);background:var(--card2);border:1px solid var(--line-soft)}
.hm-nav:disabled{opacity:.35}
.hm-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.hm-wd{font-size:10.5px;color:var(--ink3);text-align:center;padding-bottom:3px}
.hm-cell{
  aspect-ratio:1;border-radius:7px;background:var(--h0);position:relative;
  display:grid;place-items:center;font-size:11px;color:var(--ink2);
  transition:transform .1s;
}
.hm-cell:active{transform:scale(.92)}
.hm-cell.lv1{background:var(--h1)}
.hm-cell.lv2{background:var(--h2);color:#fff}
.hm-cell.lv3{background:var(--h3);color:#fff}
.hm-cell.lv4{background:var(--h4);color:#fff}
.hm-cell.future{background:transparent;border:1px dashed var(--line-soft);color:var(--ink3)}
.hm-cell.blank{background:transparent}
.hm-cell.today::after{content:"";position:absolute;inset:-2.5px;border:2px solid var(--acc);border-radius:9px}
.hm-cell.sel::after{content:"";position:absolute;inset:-2.5px;border:2px solid var(--ink2);border-radius:9px}
.hm-legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:9px;font-size:10.5px;color:var(--ink3)}
.hm-legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

/* ============ 心情 ============ */
.moods{display:flex;gap:6px}
.mood-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 2px;border-radius:13px;border:1.5px solid transparent;font-size:24px;
  filter:grayscale(.55);opacity:.75;transition:all .15s;
}
.mood-btn span{font-size:10.5px;color:var(--ink2)}
.mood-btn.on{filter:none;opacity:1;border-color:var(--line);background:var(--card2);transform:scale(1.04)}
.mood-btn:active{transform:scale(.95)}
.mood-strip{display:flex;gap:3px;align-items:flex-end}
.mood-strip b,.mood-strip button{flex:1;height:16px;border-radius:4px;background:var(--h0)}
.mood-strip-lb{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink3);margin-top:5px}
.r-hist{display:flex;gap:11px;padding:11px 2px;border-bottom:1px dashed var(--line-soft);align-items:flex-start}
.r-hist:last-child{border-bottom:none}
.r-hist .mo{font-size:21px;flex:none;line-height:1.3}
.r-hist .dt{font-size:12px;color:var(--ink3)}
.r-hist .tx{font-size:14px;color:var(--ink2);margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.save-ind{font-size:12px;color:var(--sage);opacity:0;transition:opacity .3s}
.save-ind.show{opacity:1}
/* 常駐的存檔狀態。日記最怕的是「我剛剛寫的有沒有存到」，
   所以不是閃一下就消失，而是永遠看得到現在的狀態。 */
.save-state{font-size:12px;color:var(--ink3);margin-top:6px;transition:color .25s}
.save-state.saving{color:var(--ink2)}
.save-state.saved{color:var(--sage);font-weight:600}
.lead-block{margin:12px 0 4px;padding:11px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line-soft)}
.lead-head{font-size:11.5px;color:var(--ink3);letter-spacing:.06em;margin-bottom:5px}
.lead-row{
  width:100%;display:flex;align-items:flex-start;gap:8px;text-align:left;
  padding:8px 2px;font-size:13.5px;color:var(--ink2);line-height:1.65;
  border-bottom:1px dashed var(--line-soft);
}
.lead-row:last-child{border-bottom:none}
.lead-row:active{opacity:.6}
.lead-arrow{flex:none;color:var(--ink3)}
.lead-swap{margin-top:6px;font-size:12px;color:var(--ink3);padding:3px 2px}
.lead-swap:active{color:var(--acc)}
.prompt-chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin:9px 0 2px;scrollbar-width:none}
.prompt-chips::-webkit-scrollbar{display:none}
.prompt-chips .chip{flex:none;font-size:12.5px;padding:6px 11px}

/* ============ 目標 ============ */
.g-title{font-family:var(--serif);font-size:17.5px;font-weight:700}
.g-why{font-size:13px;color:var(--ink2);margin-top:2px}
.g-prog{display:flex;align-items:center;gap:10px;margin:11px 0 4px}
.g-prog .meter{flex:1}
.g-prog span{font-size:12px;color:var(--ink2);flex:none}
.s-item{display:flex;align-items:center;gap:10px;padding:8.5px 0;border-bottom:1px dashed var(--line-soft)}
.s-item:last-child{border-bottom:none}
.s-item .ck{width:22px;height:22px}
.s-item .st{font-size:14.5px;word-break:break-word}
.s-item.done .st{color:var(--ink3);text-decoration:line-through}
.s-today{
  flex:none;font-size:11.5px;color:var(--acc);font-weight:600;background:var(--acc-soft);
  border-radius:8px;padding:4.5px 9px;
}
.s-today.q{color:var(--ink3);background:var(--card2);font-weight:500}
.goal-drag{padding:6px 4px;color:var(--ink3);font-size:15px;cursor:grab;touch-action:none;flex:none}
.goal-card-dragging{opacity:.5}
.goal-card-over{outline:2.5px dashed var(--acc)!important;outline-offset:3px}
.step-more{width:100%;text-align:center;font-size:12.5px;color:var(--ink3);padding:9px 0 2px}
.step-more:active{color:var(--acc)}
.g-done-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--sage-deep);background:var(--sage-soft);border-radius:8px;padding:3px 9px;font-weight:600}
/* 今日頁的目標區塊 */
.tg-item{padding:10px 0;border-bottom:1px dashed var(--line-soft)}
.tg-item:first-of-type{padding-top:2px}
.tg-item:last-child{border-bottom:none;padding-bottom:2px}
.tg-title{font-family:var(--serif);font-size:15.5px;font-weight:700}

/* ============ 今日三件重點 ============ */
.ring{position:relative;width:46px;height:46px;flex:none}
.ring svg{width:46px;height:46px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4;stroke-linecap:round}
.ring .rb{stroke:var(--sage-track)}
.ring .rf{stroke:var(--sage);transition:stroke-dashoffset .45s cubic-bezier(.3,.8,.4,1)}
/* 這裡原本用 grid，但「文字 + <i>」是兩個 grid 項目，會被排成上下兩列。
   改成 flex 讓分子分母回到同一行，分母略小並往下對齊。 */
.ring b{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
}
.ring b i{font-style:normal;font-size:10px;font-weight:500;color:var(--ink3);transform:translateY(2.5px);margin-left:.5px}
.ring b svg{width:17px;height:17px;color:var(--sage)}
.f-item{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px dashed var(--line-soft)}
.f-item:last-of-type{border-bottom:none}
.f-num{
  width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;
  border:1.8px solid var(--ink3);color:var(--ink2);font-size:13.5px;font-weight:650;
  font-variant-numeric:tabular-nums;transition:all .18s;
}
.f-num svg{width:14px;height:14px;color:#fff}
.f-num.on{background:var(--h3);border-color:var(--h3);color:#fff}
.f-num:active{transform:scale(.92)}
.f-item .tt{font-size:16px;font-weight:550;word-break:break-word;line-height:1.4}
.f-item.done .tt{color:var(--ink3);text-decoration:line-through;text-decoration-color:rgba(154,140,119,.7)}
.f-star{flex:none;color:var(--acc);font-size:13px;padding:7px 6px;opacity:.85}
.f-star.off{color:var(--ink3);opacity:.5}
.f-slot{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px dashed var(--line-soft)}
.f-slot:last-of-type{border-bottom:none}
.f-slot span.n{
  width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;
  border:1.8px dashed var(--line);color:var(--ink3);font-size:13.5px;font-variant-numeric:tabular-nums;
}
.f-slot em{font-style:normal;font-size:14.5px;color:var(--ink3)}

/* 領域標籤 */
.adot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.t-tag .adot{margin-right:1px}

/* 快速新增的領域選擇（聚焦後才出現，平時不干擾） */
.qa-areas{display:none;gap:6px;margin-top:9px;flex-wrap:wrap}
.qa-open .qa-areas,.qa-always .qa-areas{display:flex}
.qa-areas .chip{font-size:12.5px;padding:5.5px 10px}
.qa-areas .chip .adot{margin-right:4px}

/* ============ 本週平衡 ============ */
.bal-row{display:flex;align-items:center;gap:10px;padding:5.5px 0}
.bal-lb{font-size:13.5px;color:var(--ink2);width:34px;flex:none}
.bal-bar{flex:1;height:8px;display:flex;align-items:center}
.bal-bar i{display:block;height:8px;border-radius:0 4px 4px 0;transition:width .35s}
.bal-bar i.z{display:none}   /* 0 就是沒有，不畫一小截假的長度 */
.bal-v{font-size:12.5px;color:var(--ink2);width:20px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.bal-note{font-size:12px;color:var(--ink3);margin-top:9px}

/* 習慣的長期趨勢 */
.trend{display:flex;gap:3px;align-items:flex-end;height:34px;margin-top:11px;padding-top:2px}
.trend i{flex:1;background:var(--sage);border-radius:3px 3px 0 0;min-height:3px;opacity:.85}
.trend i.now{background:transparent;border:1.5px dashed var(--acc);border-bottom:none;border-radius:4px 4px 0 0;opacity:1}
.trend-lb{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;color:var(--ink3);margin-top:5px}
.trend-lb span:nth-child(2){color:var(--ink2)}

/* 習慣週目標 */
.h-week{display:flex;align-items:center;gap:8px;margin-top:5px}
.h-week .meter{flex:1;height:6px}
.h-week span{font-size:11.5px;color:var(--ink2);flex:none;font-variant-numeric:tabular-nums}

/* ============ 底部彈窗 ============ */
#sheetRoot .overlay{
  position:fixed;inset:0;background:rgba(58,45,28,.38);z-index:90;
  animation:fadeIn .2s;
}
#sheetRoot .sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:91;margin:0 auto;max-width:560px;
  background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(60,45,25,.18);
  padding:10px 18px calc(20px + env(safe-area-inset-bottom));
  max-height:86dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  animation:slideUp .3s cubic-bezier(.32,.72,.28,1);
}
.sheet .grab{width:38px;height:4.5px;border-radius:99px;background:var(--line);margin:2px auto 13px}
.sheet-x{
  position:absolute;top:16px;right:14px;width:30px;height:30px;border-radius:50%;
  background:var(--card2);border:1px solid var(--line-soft);color:var(--ink2);
  font-size:13px;display:grid;place-items:center;
}
.sheet h2{font-family:var(--serif);font-size:19px;font-weight:700;margin-bottom:13px}
.sheet .lbl{font-size:12.5px;color:var(--ink2);margin:13px 0 6px;font-weight:600}
@keyframes slideUp{from{transform:translateY(60%);opacity:.6}to{transform:translateY(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.emoji-grid button{
  aspect-ratio:1;font-size:22px;border-radius:12px;background:var(--card2);
  border:1.5px solid transparent;display:grid;place-items:center;
}
.emoji-grid button.on{border-color:var(--acc);background:var(--acc-soft)}
.emoji-panel{max-height:190px;overflow-y:auto;padding:2px}
.seg{display:flex;gap:7px;flex-wrap:wrap}
.sheet-actions{display:flex;gap:9px;margin-top:18px}
.sheet-actions .btn{flex:1}
.danger-link{width:100%;text-align:center;color:var(--m1);font-size:14px;padding:13px 0 2px}
.kbd{flex:none;min-width:64px;text-align:center;font-family:var(--sans);font-size:12.5px;font-weight:650;color:var(--ink2);
  background:var(--card2);border:1px solid var(--line);border-bottom-width:2px;border-radius:7px;padding:4px 8px}

/* ============ 待辦備註 ============ */
.t-note{
  font-size:12.5px;color:var(--ink2);line-height:1.6;margin-top:5px;
  border-left:2px solid var(--line);padding-left:8px;white-space:pre-wrap;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}

/* ============ 生活領域管理 ============ */
.area-row{display:flex;align-items:center;gap:9px;padding:9px 0 4px}
.swatch{width:30px;height:30px;border-radius:10px;border:1px solid var(--line-soft);flex:none}
.swatch:active{transform:scale(.93)}
.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin:2px 0 4px}
.pal button{aspect-ratio:1;border-radius:9px;border:2.5px solid transparent}
.pal button.on{border-color:var(--ink2)}
.area-use{font-size:11.5px;color:var(--ink3);margin:0 0 8px 2px;border-bottom:1px dashed var(--line-soft);padding-bottom:9px}

/* ============ 人生時光軸 ============ */
.tl-head{position:sticky;top:0;z-index:2;background:var(--card);font-family:var(--serif);
  font-size:15px;font-weight:700;color:var(--ink2);padding:9px 0 5px;letter-spacing:.04em}
.tl-item{display:flex;gap:11px}
.tl-rail{width:28px;flex:none;display:flex;flex-direction:column;align-items:center}
.tl-dot{width:28px;height:28px;border-radius:50%;background:var(--card2);border:1px solid var(--line-soft);
  display:grid;place-items:center;font-size:14px;flex:none}
.tl-line{flex:1;width:2px;background:var(--line-soft);margin:3px 0 0}
.tl-body{flex:1;min-width:0;padding:2px 0 15px}
.tl-date{font-size:11.5px;color:var(--ink3)}
.tl-title{font-size:14.5px;font-weight:600;margin-top:2px;word-break:break-word;line-height:1.45}
.tl-note{font-size:13px;color:var(--ink2);margin-top:4px;line-height:1.7;word-break:break-word}

/* ============ 手帳鎖 ============ */
#lockScreen{
  position:fixed;inset:0;z-index:200;background:var(--paper);
  background-image:radial-gradient(rgba(90,70,45,.05) 1px, transparent 1.2px);background-size:22px 22px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;
  padding:calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px);
}
#lockScreen .lk-title{font-family:var(--serif);font-size:21px;font-weight:700}
#lockScreen .lk-hint{font-size:13px;color:var(--ink2);text-align:center;line-height:1.7;max-width:290px}
.pin-dots{display:flex;gap:13px;margin:2px 0 4px}
.pin-dots i{width:13px;height:13px;border-radius:50%;background:transparent;border:1.8px solid var(--ink3);transition:all .15s}
.pin-dots i.on{background:var(--acc);border-color:var(--acc);transform:scale(1.1)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;width:100%;max-width:270px}
.pin-pad button{
  aspect-ratio:1.6;border-radius:15px;background:var(--card);border:1px solid var(--line-soft);
  box-shadow:var(--shadow);font-size:22px;font-family:var(--serif);color:var(--ink);
}
.pin-pad button:active{transform:scale(.95);background:var(--card2)}
.pin-pad button.fn{font-size:13.5px;font-family:var(--sans);color:var(--ink2);background:transparent;box-shadow:none;border-color:transparent}
.shake{animation:shake .34s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
body.locked #app,body.locked #tabbar,body.locked #storageBanner{pointer-events:none;filter:blur(15px)}
/* 切到背景時先糊掉，避免留在 App 切換畫面的縮圖裡 */
body.privacy-blur #app{filter:blur(18px)}

/* ============ 今日版面編輯 ============ */
.lay-bar{display:flex;align-items:center;gap:4px;margin-bottom:9px;padding:5px 6px;border-radius:10px;background:var(--card2)}
.lay-bar .nm{font-size:12.5px;font-weight:650;color:var(--ink2);flex:1;min-width:0;letter-spacing:.02em}
.lay-bar button{padding:5px 7px;border-radius:8px;color:var(--ink2);font-size:13px;flex:none}
.lay-bar button:active{background:var(--card)}
.lay-bar button:disabled{opacity:.3}
.lay-bar .lay-drag{cursor:grab;touch-action:none;color:var(--ink3);font-size:15px}
.lay-card > .card{outline:1.5px dashed var(--line);outline-offset:3px}
.lay-card.off .card{opacity:.45}
.lay-dragging{opacity:.5}
.lay-over{outline:2.5px dashed var(--acc)!important;outline-offset:3px}
.lay-tip{background:var(--acc-soft);border:1px solid var(--acc-tint)}

/* 設定的分類選單 */
.set-row{
  width:100%;display:flex;align-items:center;gap:11px;text-align:left;
  padding:12px 4px;border-bottom:1px dashed var(--line-soft);
}
.set-row:last-of-type{border-bottom:none}
.set-row:active{background:var(--card2)}
.set-row strong{font-size:15px;font-weight:600;display:block}
.set-ic{
  width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;
  font-size:18px;background:var(--card2);border:1px solid var(--line-soft);
}
.set-arrow{flex:none;color:var(--ink3);font-size:17px}
.set-back{color:var(--acc);font-size:14px;font-weight:600;padding:2px 0}
.set-back:active{opacity:.6}

/* 有新版時的提示。放在最上面、不擋操作，點一下才更新 */
#updateBanner{
  position:fixed;left:0;right:0;top:0;z-index:140;
  padding:calc(env(safe-area-inset-top) + 11px) 16px 11px;
  background:var(--sage-soft);border-bottom:1px solid var(--sage);color:var(--sage-deep);
  font-size:13.5px;line-height:1.6;display:flex;align-items:center;gap:10px;
}
#updateBanner .grow{flex:1;min-width:0}
#updateBanner button{
  flex:none;background:var(--sage);color:#fff;font-weight:650;font-size:13px;
  padding:6px 13px;border-radius:10px;
}
#updateBanner button.later{background:transparent;color:var(--sage-deep);padding:6px 4px;font-weight:500}

/* 出事時的最後一道防線 */
#errorBanner{
  position:fixed;left:0;right:0;top:0;z-index:150;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
  background:var(--acc-soft);border-bottom:1px solid var(--acc);color:var(--acc-deep);
  font-size:13.5px;line-height:1.7;
}
#errorBanner button{color:inherit;text-decoration:underline;font-weight:700;margin-left:4px}
#errorBanner .det{display:block;margin-top:4px;font-size:11.5px;opacity:.75;word-break:break-all}

/* Toast */
#toast{
  position:fixed;left:50%;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 18px);
  transform:translateX(-50%) translateY(8px);z-index:120;
  background:#4A4036;color:#F6F1E7;font-size:13.5px;border-radius:99px;
  padding:9px 17px;opacity:0;pointer-events:none;transition:all .25s;max-width:82vw;text-align:center;
  box-shadow:0 4px 14px rgba(60,45,25,.25);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 慶祝動畫 */
@keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out}
.fade-item{animation:fadeIn .25s}
.confetti{position:fixed;inset:0;z-index:130;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:8px;height:12px;border-radius:2px;opacity:.9;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}
</style>

(function installManifest(){
  try{
    /* manifest 走 blob: URL，裡面的網址必須是絕對路徑，否則瀏覽器會整條忽略 */
    const START_URL = location.origin + location.pathname;
    const SCOPE = START_URL.replace(/[^/]*$/, '');
    const mf = {
      name:'人生手帳', short_name:'手帳',
      description:'待辦、習慣、反思與目標，全部存在你的手機裡。',
      start_url:START_URL, scope:SCOPE, id:START_URL,
      display:'standalone', orientation:'portrait-primary',

      categories:['productivity','lifestyle'],

      shortcuts:[
        {name:'今天最重要的三件事', short_name:'今日', url:START_URL+'?tab=today'},
        {name:'快速記下一件待辦', short_name:'待辦', url:START_URL+'?tab=todo&add=1'},
        {name:'寫今晚的反思', short_name:'反思', url:START_URL+'?tab=reflect'}
      ],
      icons:[
        {src:APP_ICON, sizes:'512x512', type:'image/png', purpose:'any'},
        {src:APP_ICON_MASKABLE, sizes:'512x512', type:'image/png', purpose:'maskable'}
      ]
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(mf)], {type:'application/manifest+json'}));
    const l = document.createElement('link'); l.rel='manifest'; l.href=url;
    document.head.appendChild(l);
  }catch(e){}
})();

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* 搜尋命中的字highlight。先轉義再包 <mark>，順序反過來就會開一個 XSS 的門。
   大小寫轉換若讓長度變了（某些語系會），寧可不標色也不要切錯位置。 */
function hi(text, q){
  const s = String(text ?? '');
  const term = String(q ?? '').trim();
  if (!term) return esc(s);
  const ls = s.toLocaleLowerCase('zh-Hant'), lt = term.toLocaleLowerCase('zh-Hant');
  if (!lt || ls.length !== s.length) return esc(s);
  let out = '', i = 0;
  for (;;){
    const j = ls.indexOf(lt, i);
    if (j < 0){ out += esc(s.slice(i)); break; }
    out += esc(s.slice(i, j)) + '<mark class="hl">' + esc(s.slice(j, j + lt.length)) + '</mark>';
    i = j + lt.length;
  }
  return out;
}

/* 搜尋結果單獨算，打字時只換結果區，輸入框不重建，游標與注音組字都不會被打斷 */
function searchResultsHTML(q){
  const term=(q||'').trim().toLocaleLowerCase('zh-Hant');
  if(!term) return '<div class="empty" style="padding:20px">輸入文字，找回曾經寫下的事</div>';
  const hit=s=>String(s||'').toLocaleLowerCase('zh-Hant').includes(term);
  const tasks=state.tasks.filter(t=>hit(`${t.title} ${t.note||''}`)).slice(0,12);
  const goals=state.goals.filter(g=>hit(`${g.title} ${g.why||''}`)).slice(0,8);
  const records=state.goalRecords.filter(g=>hit(`${g.title} ${g.why||''}`)).slice(0,8);
  const refs=Object.keys(state.reflections).filter(k=>hit(`${state.reflections[k].text||''} ${k} ${fmtMD(k)}`)).sort().reverse().slice(0,10);
  const habits=state.habits.filter(h=>hit(`${h.name} ${h.minVersion||''}`)).slice(0,8);
  const total=tasks.length+goals.length+records.length+refs.length+habits.length;
  if(!total) return '<div class="empty" style="padding:20px">沒有找到相符內容</div>';
  const row=(ic,title,sub,tab,extra)=>`<button class="result-item" data-act="search-go" data-tab="${tab}" ${extra||''}><span>${ic}</span><span class="grow"><strong style="font-size:14px">${hi(title,q)}</strong>${sub?`<span class="hint" style="display:block">${hi(sub,q)}</span>`:''}</span><span>›</span></button>`;
  return `<div class="hint" style="margin:4px 2px 0">找到 ${total} 筆</div>`
    +(tasks.length?'<div class="result-group">待辦</div>'+tasks.map(t=>row(t.done?'✓':'○',t.title,(t.done?'已完成 · ':'')+({today:'今天',week:'本週',later:'之後'}[t.bucket]||''),'todo')).join(''):'')
    +(habits.length?'<div class="result-group">習慣</div>'+habits.map(h=>row(h.emoji,h.name,h.minVersion||'','habit')).join(''):'')
    +(goals.length?'<div class="result-group">目標</div>'+goals.map(g=>row('⚑',g.title,g.why||'','goal')).join(''):'')
    +(records.length?'<div class="result-group">完成紀錄</div>'+records.map(g=>row('🏆',g.title,fmtMD(dkey(new Date(g.completedAt))),'goal')).join(''):'')
    +(refs.length?'<div class="result-group">反思</div>'+refs.map(k=>row('🌙',(state.reflections[k].text||'心情紀錄').split('\n')[0],fmtFull(k),'reflect',`data-k="${k}"`)).join(''):'');
}

const KEY = 'life_journal_v1';
const AUTO_BACKUP_KEY=KEY+'_auto_backups';
const hashText=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(16);};
const store = (() => {
  let ok = true;
  try { localStorage.setItem('__lj_t', '1'); localStorage.removeItem('__lj_t'); }
  catch (e) { ok = false; }
  return {
    ok, loadError:false, saveError:false, bytes:0,
    load(){
      if (!ok) return null;
      try{
        const raw=localStorage.getItem(KEY);if(!raw)return null;
        const sig=localStorage.getItem(KEY+'_checksum');
        if(sig&&sig!==hashText(raw)){this.loadError=true;return null;}
        this.bytes=raw.length;
        return JSON.parse(raw);
      }catch(e){this.loadError=true;return null;}
    },
    /* 空間寫滿時不再靜默失敗：先丟掉舊的自動復原點再試一次，仍失敗就明確告訴使用者 */
    save(data){
      if (!ok) return;
      let raw;
      try{ raw = JSON.stringify(data); }catch(e){ return; }
      const write = () => { localStorage.setItem(KEY,raw); localStorage.setItem(KEY+'_checksum',hashText(raw)); };
      try{
        write(); this.bytes=raw.length;
        if(this.saveError){ this.saveError=false; updateStorageBanner(); }
      }catch(e){
        try{
          const arr=JSON.parse(localStorage.getItem(AUTO_BACKUP_KEY)||'[]');
          localStorage.setItem(AUTO_BACKUP_KEY,JSON.stringify(arr.slice(0,1)));
          localStorage.removeItem(PRE_IMPORT_KEY);
          write(); this.bytes=raw.length;
          if(this.saveError){ this.saveError=false; updateStorageBanner(); }
        }catch(e2){
          if(!this.saveError){ this.saveError=true; updateStorageBanner(); }
        }
      }
      idbMirror.save(raw);
    },
    autoBackup(data){
      if(!ok)return;
      try{const arr=JSON.parse(localStorage.getItem(AUTO_BACKUP_KEY)||'[]');arr.unshift({at:new Date().toISOString(),data});localStorage.setItem(AUTO_BACKUP_KEY,JSON.stringify(arr.slice(0,5)));}catch(e){}
    },
    backups(){try{return JSON.parse(localStorage.getItem(AUTO_BACKUP_KEY)||'[]');}catch(e){return[];}}
  };
})();
/* 兩種需要一直看得見的狀態：完全不能存（預覽模式）、以及存不進去（空間滿了） */
/* localStorage 對單一網站大約 5 MB。等到寫不進去才說就太晚了 ——
   那時已經有東西沒存到。過七成就先提醒，還來得及備份與清理。 */
const STORAGE_WARN_BYTES = 3.6e6;
function updateStorageBanner(){
  const el = document.getElementById('storageBanner');
  if (!el) return;
  if (store.saveError){
    el.hidden = false; el.classList.add('danger');
    el.innerHTML = '⚠️ <b>這台裝置的儲存空間已滿，剛才的變動沒有存進去。</b>請先到設定下載備份檔，再清理瀏覽器空間。 <button data-act="settings" style="text-decoration:underline;font-weight:700">去備份</button>';
  } else if (!store.ok){
    el.hidden = false; el.classList.remove('danger');
    el.innerHTML = '📱 目前是<b>預覽模式</b>，資料不會被保存。放到 Safari 或正式網址使用時，所有紀錄都會存在你的手機裡。';
  } else if (store.bytes > STORAGE_WARN_BYTES){
    el.hidden = false; el.classList.remove('danger');
    el.innerHTML = `📦 手帳已經用掉約 ${Math.round(store.bytes / 1048576 * 10) / 10} MB，接近瀏覽器對單一網站的上限。<b>建議先下載備份</b>，再清掉很久以前的已完成待辦。 <button data-act="settings" style="text-decoration:underline;font-weight:700">去備份</button>`;
  } else {
    el.hidden = true;
  }
}
/* 長期保存：瀏覽器預設把網站資料當「暫存」，空間不足或長期沒開啟時可能清掉。
   取得 persist 授權後才算真正安全；iOS 上「加入主畫面」會大幅提高通過機率。 */
const persistState = {supported:false, granted:false};
async function checkPersist(ask){
  try{
    if (!navigator.storage || !navigator.storage.persisted) return false;
    persistState.supported = true;
    let ok = await navigator.storage.persisted();
    if (!ok && ask && navigator.storage.persist) ok = await navigator.storage.persist();
    persistState.granted = !!ok;
    return persistState.granted;
  }catch(e){ return false; }
}
const idbMirror={
  db:null,
  /* v2 多了 handles（桌面自動備份的檔案授權）。Service Worker 那邊改成不指定版本開啟，
     否則舊版號會撞上 VersionError。 */
  open(){if(this.db)return Promise.resolve(this.db);if(typeof indexedDB==='undefined')return Promise.reject();return new Promise((resolve,reject)=>{const q=indexedDB.open('life_journal_rescue',2);q.onupgradeneeded=()=>{const db=q.result;if(!db.objectStoreNames.contains('snapshots'))db.createObjectStore('snapshots',{keyPath:'at'});if(!db.objectStoreNames.contains('handles'))db.createObjectStore('handles',{keyPath:'id'});};q.onsuccess=()=>{this.db=q.result;resolve(this.db);};q.onerror=()=>reject(q.error);});},
  async setHandle(h){const db=await this.open();return new Promise((res,rej)=>{const r=db.transaction('handles','readwrite').objectStore('handles').put({id:'backup',h});r.onsuccess=()=>res(true);r.onerror=()=>rej(r.error);});},
  async getHandle(){try{const db=await this.open();return await new Promise((res,rej)=>{const r=db.transaction('handles').objectStore('handles').get('backup');r.onsuccess=()=>res(r.result?r.result.h:null);r.onerror=()=>rej(r.error);});}catch(e){return null;}},
  async clearHandle(){try{const db=await this.open();db.transaction('handles','readwrite').objectStore('handles').delete('backup');}catch(e){}},
  async save(raw){try{const db=await this.open();const tx=db.transaction('snapshots','readwrite');tx.objectStore('snapshots').put({at:Date.now(),raw});const all=await new Promise((res,rej)=>{const q=tx.objectStore('snapshots').getAllKeys();q.onsuccess=()=>res(q.result);q.onerror=()=>rej();});all.sort((a,b)=>b-a).slice(10).forEach(k=>tx.objectStore('snapshots').delete(k));}catch(e){}},
  async latest(){try{const db=await this.open();return await new Promise((res,rej)=>{const q=db.transaction('snapshots').objectStore('snapshots').openCursor(null,'prev');q.onsuccess=()=>res(q.result?q.result.value.raw:null);q.onerror=()=>rej();});}catch(e){return null;}},
  async clear(){try{const db=await this.open();db.transaction('snapshots','readwrite').objectStore('snapshots').clear();}catch(e){}}
};

/* 舊版資料升級：保留既有紀錄，補上排序、日期、週期與溫和習慣欄位 */
function migrate(s){
  if (!s || !Array.isArray(s.tasks)) return null;
  const tk = todayKey();
  s.tasks = s.tasks.map((t, i) => Object.assign({area:null, focus:false, note:'', order:i, scheduledDate:t.bucket === 'today' ? tk : null, recurrenceId:null, occurrenceDate:null}, t));
  s.habits = (s.habits || []).map(h => Object.assign({area:null, weeklyTarget:5, minVersion:''}, h));
  Object.keys(s.habitLog || {}).forEach(k => Object.keys(s.habitLog[k] || {}).forEach(id => {
    if (s.habitLog[k][id] === true) s.habitLog[k][id] = 'done';
  }));
  s.goals = (s.goals||[]).map((g,i)=>Object.assign({area:null,paused:false,lastProgressAt:g.createdAt||Date.now(),recordId:null,horizon:'near',order:i},g));
  /* v9：期程只收 near / far；order 沒有就照現有順序補 */
  s.goals.forEach((g,i)=>{ if(g.horizon!=='far') g.horizon='near'; if(!Number.isFinite(g.order)) g.order=i; });
  s.goalRecords=s.goalRecords||[];
  s.goals.filter(g=>g.done).forEach(g=>{
    let rec=s.goalRecords.find(r=>r.sourceGoalId===g.id);
    if(!rec){rec={id:uid(),sourceGoalId:g.id,title:g.title,why:g.why||'',area:g.area||null,completedAt:g.doneAt||Date.now(),steps:(g.steps||[]).map(x=>({title:x.title}))};s.goalRecords.push(rec);}
    g.recordId=rec.id;
  });
  s.weeklyReviews=s.weeklyReviews||{};
  s.habitLog = s.habitLog || {}; s.reflections = s.reflections || {};
  s.recurrences = s.recurrences || [];
  s.settings = Object.assign(SETTINGS_DEFAULTS(), s.settings || {});
  /* v7:習慣補上建立日（影響熱度圖分母），待辦補上未來排程日 */
  s.habits.forEach(h => { if (!h.createdAt) h.createdAt = 0; });
  s.tasks.forEach(t => { if (t.dueDate === undefined) t.dueDate = null; if (t.note === undefined) t.note = ''; });
  /* v8:自訂生活領域。舊資料沒有這個欄位就給預設四個；有的話逐欄清洗，
     顏色只收調色盤裡的代號，名稱長度設上限 —— 壞掉的備份檔進不來。 */
  s.areas = (Array.isArray(s.areas) && s.areas.length ? s.areas : DEFAULT_AREAS)

/* 連續天數：休息日跳過不中斷，但一旦走到有紀錄以前的日子就停，不會空轉 */
function earliestLogKey(){
  const ks = Object.keys(state.habitLog);
  return ks.length ? ks.sort()[0] : todayKey();
}
function habitStreak(hid){
  let d = new Date(); let c = 0, guard = 0;
  const floor = earliestLogKey();
  if (!isChecked(hid, dkey(d))) d = addDays(d, -1);
  while (guard++ < 3660) {
    const k = dkey(d);
    if (k < floor) break;
    if (isRest(hid, k)) { d = addDays(d, -1); continue; }
    if (!isChecked(hid, k)) break;
    c++; d = addDays(d, -1);
  }
  return c;
}
/* 本週（週一起算）的打卡次數 —— 比嚴格連續更溫和，也更容易長期維持 */
function weekStart(from){ const x = new Date(from || new Date()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); x.setHours(0,0,0,0); return x; }
function habitWeekCount(hid){
  const s = weekStart(); let c = 0;
  for (let i = 0; i < 7; i++){ const d = addDays(s, i); if (d > new Date()) break; if (isChecked(hid, dkey(d))) c++; }
  return c;
}
function habitEverLogged(hid){ return Object.keys(state.habitLog).some(k => state.habitLog[k][hid]); }
/* 近 N 週的每週次數，用來看長期趨勢 —— 單週好壞不重要，線的走向才重要 */
function habitWeekSeries(hid, weeks){
  const s = weekStart(), out = [], now = new Date();
  for (let w = weeks - 1; w >= 0; w--){
    const ws = addDays(s, -7 * w); let c = 0;
    for (let i = 0; i < 7; i++){ const d = addDays(ws, i); if (d > now) break; if (isChecked(hid, dkey(d))) c++; }
    out.push(c);
  }
  return out;
}
function habitTrendHTML(h){
  /* 只畫「這個習慣已經存在」的那些週，還沒開始的日子不畫成 0 —— 那不是沒做到，是還沒開始 */
  const bornWeek = dkey(weekStart(new Date(h.createdAt || 0)));
  const thisWeek = dkey(weekStart());
  let weeks = 12;
  for (let w = 0; w < 12; w++){ if (dkey(addDays(weekStart(), -7*w)) < bornWeek){ weeks = w; break; } }
  if (weeks < 4) return '';
  const series = habitWeekSeries(h.id, weeks);
  const done = series.slice(0, -1);                 /* 已經過完的週 */
  const current = series[series.length - 1];
  if (done.filter(n => n > 0).length < 3) return '';
  const target = h.weeklyTarget || 5;
  const top = Math.max(target, ...series);
  const half = Math.max(2, Math.floor(done.length / 2));
  const recent = done.slice(-half).reduce((a,b)=>a+b,0) / half;
  const before = done.slice(0, half).reduce((a,b)=>a+b,0) / half;
  const dir = recent > before + .5 ? '慢慢變多了' : recent < before - .5 ? '最近少了一些，沒關係' : '維持著差不多的節奏';
  const bar = (n, cls) => `<i class="${cls||''}" style="height:${Math.max(5, n/top*100)}%"></i>`;
  return `<div class="trend" role="img" aria-label="過去 ${done.length} 週每週次數依序為 ${done.join('、')},本週目前 ${current} 次">
      ${done.map(n=>bar(n)).join('')}${bar(current,'now')}
    </div>
    <div class="trend-lb"><span>${done.length} 週前</span><span>${dir}</span><span>本週進行中</span></div>`;
}

/* 本週平衡：一律由真實紀錄計算（近 7 天完成的事 + 習慣打卡），不預設任何數字 */
function areaBalance(){

  const since = addDays(new Date(), -6); since.setHours(0, 0, 0, 0);
  const sinceT = since.getTime();
  state.tasks.forEach(t => { if (t.done && t.area && t.doneAt >= sinceT && counts[t.area] !== undefined) counts[t.area]++; });
  state.habits.forEach(h => {
    if (!h.area || counts[h.area] === undefined) return;
    for (let i = 0; i < 7; i++) if (isChecked(h.id, dkey(addDays(new Date(), -i)))) counts[h.area]++;
  });
  const vals = areaList().map(a => counts[a.id]);

function dayDiff(a, b){ return Math.round((fromKey(b) - fromKey(a)) / 864e5); }

const _nextOccCache = new Map();

/* 完成任務 ⇄ 目標步驟連動 */

    if(g&&g.done&&g.recordId)return; /* 完成紀錄已封存，後續待辦變動不回寫歷史 */

function setStepDone(g, s, done){

}
function checkGoalComplete(g){

/* =================== 人生時光軸 =================== */
/* 不新增任何欄位，只是把已經存在的紀錄重新串成一條線：
   立下與完成的目標、開始的習慣與累積的里程碑、寫作的連續紀錄、每週最想肯定自己的事。 */
const HABIT_MILESTONES = [10, 30, 50, 100, 200, 365, 500, 1000];
const WRITE_MILESTONES = [7, 30, 100, 365, 500, 1000];
function timelineEvents(){
  const ev = [];
  const push = (t, ic, title, note) => { if (Number.isFinite(t) && t > 0) ev.push({t, ic, title, note:note || ''}); };

  state.goalRecords.forEach(r => push(r.completedAt, '🏆', `完成目標：${r.title}`, r.why));
  state.goals.forEach(g => push(g.createdAt, '⛰️', `立下目標：${g.title}`, g.why));
  state.habits.forEach(h => push(h.createdAt, h.emoji || '🌱', `開始培養習慣：${h.name}`, h.minVersion ? `最低版本：${h.minVersion}` : ''));

  /* 習慣累計次數的里程碑：照打卡日期先後數過去 */
  const logDays = Object.keys(state.habitLog).sort();
  state.habits.forEach(h => {
    let n = 0;
    logDays.forEach(k => {
      if (!isChecked(h.id, k)) return;
      n++;
      if (HABIT_MILESTONES.includes(n)) push(fromKey(k).getTime(), '🎯', `「${h.name}」累計第 ${n} 次`, '');
    });
  });

  /* 反思：第一篇，以及連續寫作的里程碑 */
  const wrote = Object.keys(state.reflections)
    .filter(k => { const r = state.reflections[k]; return r && (r.mood || (r.text || '').trim()); })
    .sort();
  if (wrote.length){
    const first = state.reflections[wrote[0]];
    push(fromKey(wrote[0]).getTime(), '✍️', '寫下第一篇反思', (first.text || '').split('\n')[0].slice(0, 60));
  }
  let run = 0, prev = null;
  wrote.forEach(k => {
    run = (prev && dayDiff(prev, k) === 1) ? run + 1 : 1;
    prev = k;
    if (WRITE_MILESTONES.includes(run)) push(fromKey(k).getTime(), '🌙', `連續寫下 ${run} 天`, '');
  });

  Object.keys(state.weeklyReviews).forEach(k => {
    const r = state.weeklyReviews[k];
    if (r && (r.proud || '').trim()) push(fromKey(k).getTime(), '💛', '那一週最想肯定自己的', r.proud);
  });

  return ev.sort((a, b) => b.t - a.t);
}

/* =================== 年度回顧 =================== */
/* 一年的樣子：不評分、不比較，只是把你走過的攤開來看一遍。 */
function dataYears(){
  const ys = new Set();
  const addT = t => { if (Number.isFinite(t) && t > 0) ys.add(new Date(t).getFullYear()); };
  const addK = k => { const y = Number(String(k).slice(0, 4)); if (Number.isFinite(y)) ys.add(y); };
  state.tasks.forEach(t => { addT(t.createdAt); addT(t.doneAt); });
  state.goals.forEach(g => addT(g.createdAt));
  state.goalRecords.forEach(r => addT(r.completedAt));
  state.habits.forEach(h => addT(h.createdAt));
  Object.keys(state.habitLog).forEach(addK);
  Object.keys(state.reflections).forEach(addK);
  Object.keys(state.weeklyReviews).forEach(addK);
  ys.add(new Date().getFullYear());
  return [...ys].sort((a, b) => b - a);
}
function yearSummary(y){
  const from = `${y}-01-01`, to = `${y + 1}-01-01`;
  const base = rangeSummary(from, to);
  const fromT = fromKey(from).getTime(), toT = fromKey(to).getTime();
  const months = Array.from({length:12}, () => ({done:0, moods:[], habit:0, wrote:0}));

  state.tasks.forEach(t => {
    if (t.done && t.doneAt >= fromT && t.doneAt < toT) months[new Date(t.doneAt).getMonth()].done++;
  });
  const inYear = k => k >= from && k < to;
  const habitCounts = {};
  Object.keys(state.habitLog).filter(inYear).forEach(k => {
    const m = fromKey(k).getMonth();
    state.habits.forEach(h => {
      if (!isChecked(h.id, k)) return;
      habitCounts[h.id] = (habitCounts[h.id] || 0) + 1;
      months[m].habit++;
    });
  });
  const wroteKeys = [];
  Object.keys(state.reflections).filter(inYear).forEach(k => {
    const r = state.reflections[k];
    if (!r || !(r.mood || (r.text || '').trim())) return;
    const m = fromKey(k).getMonth();
    months[m].wrote++;
    if (r.mood) months[m].moods.push(r.mood);
    wroteKeys.push(k);
  });

  /* 領域分佈：完成的事 + 習慣打卡，和「本週平衡」用同一套口徑 */
  const areaCounts = {}; areaList().forEach(a => areaCounts[a.id] = 0);
  state.tasks.forEach(t => {
    if (t.done && t.area && t.doneAt >= fromT && t.doneAt < toT && areaCounts[t.area] !== undefined) areaCounts[t.area]++;
  });
  Object.keys(state.habitLog).filter(inYear).forEach(k => {
    state.habits.forEach(h => { if (h.area && areaCounts[h.area] !== undefined && isChecked(h.id, k)) areaCounts[h.area]++; });
  });

  let best = 0, run = 0, prev = null;
  wroteKeys.sort().forEach(k => { run = (prev && dayDiff(prev, k) === 1) ? run + 1 : 1; prev = k; if (run > best) best = run; });

  return Object.assign(base, {
    months, areaCounts,
    goals: state.goalRecords.filter(r => r.completedAt >= fromT && r.completedAt < toT).sort((a, b) => a.completedAt - b.completedAt),
    prouds: Object.keys(state.weeklyReviews).filter(inYear).sort()
      .map(k => ({k, t:(state.weeklyReviews[k].proud || '').trim()})).filter(x => x.t),
    topHabits: Object.keys(habitCounts).map(id => ({h:state.habits.find(x => x.id === id), n:habitCounts[id]}))
      .filter(x => x.h).sort((a, b) => b.n - a.n).slice(0, 3),
    longestWrite: best,
    habitTotal: Object.values(habitCounts).reduce((a, b) => a + b, 0)
  });
}
function yearReviewSheet(y){
  const year = Number(y) || new Date().getFullYear();
  const years = dataYears();
  const s = yearSummary(year);
  const maxDone = Math.max(1, ...s.months.map(m => m.done));
  const empty = !s.completed && !s.habitDone && !s.reflectDays && !s.goals.length;
  const balMax = Math.max(1, ...areaList().map(a => s.areaCounts[a.id] || 0));
  const balTotal = areaList().reduce((n, a) => n + (s.areaCounts[a.id] || 0), 0);
  const idx = years.indexOf(year);
  const older = idx >= 0 && idx < years.length - 1 ? years[idx + 1] : null;
  const newer = idx > 0 ? years[idx - 1] : null;

  openSheet(`

      <div class="review-stat"><b>${s.moodAvg ? (MOODS.find(m => m.v === Math.round(Number(s.moodAvg))) || {e:''}).e + ' ' + s.moodAvg : '—'}</b><span>平均心情</span></div>
    </div>

    <div class="lbl">每個月完成的事</div>
    <div class="trend" role="img" aria-label="一到十二月完成數依序為 ${s.months.map(m => m.done).join('、')}">
      ${s.months.map((m, i) => `<i style="height:${Math.max(4, m.done / maxDone * 100)}%" title="${i + 1}月 ${m.done} 件"></i>`).join('')}
    </div>
    <div class="trend-lb"><span>1月</span><span>最多 ${maxDone} 件</span><span>12月</span></div>

    ${s.months.some(m => m.moods.length) ? `<div class="lbl">心情的一年</div>
      <div class="mood-strip">${s.months.map((m, i) => {
        if (!m.moods.length) return `<b style="background:var(--h0);height:5px"></b>`;
        const avg = m.moods.reduce((a, b) => a + b, 0) / m.moods.length;
        const mo = MOODS.find(x => x.v === Math.round(avg)) || MOODS[2];
        return `<b style="background:${mo.c};height:${(6 + avg * 2.6).toFixed(1)}px" title="${i + 1}月 平均 ${avg.toFixed(1)}"></b>`;
      }).join('')}</div>
      <div class="mood-strip-lb"><span>1月</span><span>12月</span></div>` : ''}

    ${s.topHabits.length ? `<div class="lbl">陪你最久的習慣</div>
      ${s.topHabits.map(x => `<div class="row" style="padding:7px 0;border-bottom:1px dashed var(--line-soft)">
        <span style="font-size:19px">${x.h.emoji}</span>
        <span class="grow" style="font-size:14.5px">${esc(x.h.name)}</span>
        <span class="hint" style="font-variant-numeric:tabular-nums">${x.n} 次</span>
      </div>`).join('')}` : ''}

    ${balTotal >= 5 ? `<div class="lbl">時間放在哪裡</div>
      ${areaList().map(a => `<div class="bal-row">
        <span class="bal-lb">${esc(a.lb)}</span>
        <span class="bal-bar"><i class="${s.areaCounts[a.id] ? '' : 'z'}" style="width:${(s.areaCounts[a.id] || 0) / balMax * 100}%;background:${areaColor(a)}"></i></span>
        <span class="bal-v">${s.areaCounts[a.id] || 0}</span>
      </div>`).join('')}` : ''}

    ${s.goals.length ? `<div class="lbl">這一年完成的目標</div>
      ${s.goals.map(g => `<div class="row" style="padding:7px 0;border-bottom:1px dashed var(--line-soft)">
        <span style="font-size:17px">🏆</span>
        <span class="grow" style="font-size:14.5px">${esc(g.title)}</span>
        <span class="hint">${fmtMD(dkey(new Date(g.completedAt)))}</span>
      </div>`).join('')}` : ''}

    ${s.prouds.length ? `<div class="lbl">那些你肯定過自己的時刻</div>
      ${s.prouds.slice(-6).reverse().map(p => `<div class="tl-item">
        <div class="tl-rail"><div class="tl-dot">💛</div></div>
        <div class="tl-body"><div class="tl-date">${fmtMD(p.k)} 那一週</div><div class="tl-note">${esc(p.t)}</div></div>
      </div>`).join('')}` : ''}

    <div class="hint" style="margin-top:14px;line-height:1.8">數字只是痕跡，不是評分。少的那幾個月，你也在過日子。</div>
    <div class="sheet-actions">
      <button class="btn plain" data-act="timeline">看時光軸</button>
      <button class="btn" data-act="export-md">帶走這一年</button>
    </div>`}`);
}

/* =================== 今日頁的版面 =================== */
/* 今日頁的每個區塊都可以自己排順序、也可以收起來。
   沒有自訂過的話，順序仍然跟著一天的節奏走（見 todayOrder）。 */
const TODAY_BLOCKS = [
  {id:'goals', lb:'我的目標'},
  {id:'focus', lb:'今天最重要的三件事'},
  {id:'others', lb:'其他待辦'},
  {id:'upcoming', lb:'接下來的日子'},
  {id:'habits', lb:'今天的習慣'},
  {id:'balance', lb:'本週平衡'},
  {id:'review', lb:'人生回顧'},
  {id:'reflection', lb:'今晚的反思'}
];
const DEFAULT_TODAY_ORDER = TODAY_BLOCKS.map(b => b.id);
const todayHidden = () => state.settings.todayHidden || [];
function todayOrder(){
  const saved = state.settings.todayLayout;
  const custom = Array.isArray(saved) && saved.length > 0;
  let order = [...new Set((custom ? saved : []).filter(id => DEFAULT_TODAY_ORDER.includes(id)))];
  /* 之後版本新增的區塊會自動補在後面，不會因為舊版面設定就消失 */
  DEFAULT_TODAY_ORDER.forEach(id => { if (!order.includes(id)) order.push(id); });
  if (!custom && state.settings.todayAuto !== false && !ui.layoutEdit){
    const h = new Date().getHours();
    if (h >= 11) order = ['focus', ...order.filter(x => x !== 'focus')];
    if (h >= 18){ order = order.filter(x => x !== 'reflection'); order.splice(order.indexOf('focus') + 1, 0, 'reflection'); }
  }
  return order;
}
function commitLayout(order){
  state.settings.todayLayout = order;
  state.settings.todayAuto = false;
  save(); render();
}
function layoutTipHTML(){
  if (!ui.layoutEdit) return '';
  return `<div class="card pad-s lay-tip">
    <div style="font-size:13.5px;color:var(--ink2);line-height:1.7">拖曳 ⠿ 或用 ▲▼ 排出屬於你的今天。隱藏只是把區塊收起來，裡面的紀錄都還在。</div>
    <div class="sheet-actions" style="margin-top:11px">
      <button class="btn plain" data-act="layout-reset">回到預設</button>
      <button class="btn" data-act="layout-done">完成</button>
    </div>
  </div>`;
}
function layoutWrap(id, html){
  const hidden = todayHidden().includes(id);
  if (!ui.layoutEdit) return hidden ? '' : (html || '');
  const b = TODAY_BLOCKS.find(x => x.id === id) || {lb:id};
  const order = todayOrder(), i = order.indexOf(id);
  return `<div class="lay-card ${hidden ? 'off' : ''}" data-lay="${id}">
    <div class="lay-bar">
      <button class="lay-drag" data-lay-drag="${id}" aria-label="拖移「${b.lb}」">⠿</button>
      <span class="nm">${b.lb}</span>
      <button data-act="lay-move" data-id="${id}" data-d="-1" ${i <= 0 ? 'disabled' : ''} aria-label="「${b.lb}」上移">▲</button>
      <button data-act="lay-move" data-id="${id}" data-d="1" ${i >= order.length - 1 ? 'disabled' : ''} aria-label="「${b.lb}」下移">▼</button>
      <button data-act="lay-toggle" data-id="${id}">${hidden ? '顯示' : '隱藏'}</button>
    </div>
    ${html || '<div class="card pad-s"><div class="hint">目前沒有內容，平常不會出現在畫面上。</div></div>'}
  </div>`;
}

/* =================== 今日頁 =================== */
function vToday(){
  const tk = todayKey();
  const focus = focusTasks();
  const fDone = focus.filter(t => t.done).length;
  const others = state.tasks.filter(t => t.bucket === 'today' && !t.focus && (!t.scheduledDate || t.scheduledDate===tk));
  const otherOpen = others.filter(t => !t.done);
  const otherDone = others.filter(t => t.done);
  const habits = activeHabits();
  const ref = state.reflections[tk];
  const hasRef = ref && (ref.mood || (ref.text || '').trim());
  const rStreak = reflectStreak();
  const d = new Date();
  const hour=d.getHours();
  const phase=hour<11?'早晨':hour<18?'白天':'夜晚';
  const phaseNote=hour<11?'先選定今天最重要的方向，其餘的慢慢來。':hour<18?'回到三件重點，把注意力留給此刻。':'收好未完成的事，也替今天留下一句話。';
  const CIRC = 119.38;   /* 2πr,r=19 */
  const bal = areaBalance();
  const starter=!state.tasks.length&&!state.habits.length&&!state.goals.length&&!Object.keys(state.reflections).length;
  const meaningful=state.tasks.length+state.habits.length+state.goals.length+Object.keys(state.reflections).length;
  const lastBackup=state.settings.lastBackupAt?new Date(state.settings.lastBackupAt):null;
  const needsBackup=meaningful>=10&&(!lastBackup||Date.now()-lastBackup.getTime()>14*864e5);
  const lowArea=bal.total>=3?[...areaList()].sort((a,b)=>bal.counts[a.id]-bal.counts[b.id])[0]:null;
  const upcoming=upcomingTasks();

  /* 我的目標：每個進行中目標的名稱+進度+下一步 */
  const actGoals = state.goals.filter(g => !g.done && !g.paused);
  const goalsCard = `<div class="card" id="goalsCard">
    <div class="sec-title">我的目標<button class="right" data-act="tab" data-tab="goal">全部 ›</button></div>
    ${actGoals.length ? actGoals.slice(0,2).map(g => {
      const p = goalProgress(g);
      const next = g.steps.find(s => !s.done);
      const queued = next && state.tasks.some(t => t.stepId === next.id && !t.done);
      return `<div class="tg-item">
        <div class="row" style="align-items:baseline">
          <div class="grow tg-title">${esc(g.title)}</div>
          <span style="font-size:12px;color:var(--ink2);flex:none">${p.d}/${p.t} 步</span>
        </div>
        <div class="meter" style="margin:7px 0 8px"><i style="width:${p.pct}%"></i></div>
        ${next ? `<div class="row">
            <span class="grow" style="font-size:13.5px;color:var(--ink2)">下一步：${esc(next.title)}</span>
            ${queued ? `<button class="s-today q" data-act="step-unqueue" data-sid="${next.id}" aria-label="取消排入今天">已排入 ↺</button>` : `<button class="s-today" data-act="step-queue" data-gid="${g.id}" data-sid="${next.id}">→ 排入今天</button>`}
          </div>`
        : `<button class="row" style="width:100%;text-align:left" data-act="tab" data-tab="goal">
            <span class="grow" style="font-size:13px;color:var(--ink3)">還沒拆步驟，點我去加第一步 ›</span>
          </button>`}
      </div>`;
    }).join('')
    : `<button class="row" style="width:100%;text-align:left" data-act="tab" data-tab="goal">
        <span style="font-size:22px">⛰️</span>
        <span class="grow" style="font-size:14px;color:var(--ink2)">寫下一個在意的方向，拆成小步慢慢走</span>
        <span style="color:var(--acc);font-size:13px;font-weight:600">開始 ›</span>
      </button>`}
  </div>`;

  const B = {};
  const head = `
  <div class="card greet-card">
    <div class="tape"></div>
    <div class="greet-date">${d.getMonth()+1}月${d.getDate()}日 <span style="font-size:16px">週${WD[d.getDay()]}</span></div>
    <div class="greet-hello">${greeting()}</div>
    <div class="morning-note">${phase}小提示：${phaseNote}</div>
    <div class="row" style="position:absolute;top:16px;right:14px">
      <button class="icon-btn" data-act="global-search" aria-label="搜尋人生手帳">⌕</button>
      <button class="icon-btn" data-act="settings" aria-label="設定與備份">${ICONS.gear}</button>
    </div>
    <div class="greet-quote"><button class="qt-tap" data-act="quote-menu" aria-label="今天這句：換一句或收起來">${quoteHTML(dayQuote())}</button><button class="qt-next" data-act="quote-bump" aria-label="換下一句">↻</button></div>
  </div>

  ${!state.settings.onboardingDismissed&&(starter||meaningful<4)?`<div class="card">
    <div class="sec-title">用三個小步開始<button class="right" data-act="onboard-dismiss">先收起</button></div>
    <div class="hint" style="line-height:1.8">不用一次設定完整系統。讓方向、今天與反思慢慢連起來。</div>
    <div class="onboard-steps">
      <button class="onboard-step ${state.goals.length?'done':''}" data-act="tab" data-tab="goal"><b>${state.goals.length?'✓':'1'}</b><span class="grow" style="text-align:left"><strong>寫下一個在意的方向</strong><span class="hint" style="display:block">它不需要宏大，只要真正在意。</span></span></button>
      <button class="onboard-step ${focus.length?'done':''}" data-act="focus-first"><b>${focus.length?'✓':'2'}</b><span class="grow" style="text-align:left"><strong>選定今天的一件事</strong><span class="hint" style="display:block">把方向落在今天走得到的一步。</span></span></button>
      <button class="onboard-step ${hasRef?'done':''}" data-act="tab" data-tab="reflect"><b>${hasRef?'✓':'3'}</b><span class="grow" style="text-align:left"><strong>晚上留下一句話</strong><span class="hint" style="display:block">不是評分，只是看見今天。</span></span></button>
    </div>
  </div>`:''}`;

  B.goals = goalsCard;

  B.focus = `<div class="card today-drop-zone" id="focusCard" data-today-group="focus">
    <div class="sec-title">今天最重要的三件事
      <span class="right"><div class="ring" aria-label="今日重點完成 ${fDone} / ${FOCUS_MAX}">
        <svg viewBox="0 0 46 46" aria-hidden="true">
          <circle class="rb" cx="23" cy="23" r="19"></circle>
          <circle class="rf" cx="23" cy="23" r="19" stroke-dasharray="${CIRC}" stroke-dashoffset="${(CIRC * (1 - fDone / FOCUS_MAX)).toFixed(1)}"></circle>
        </svg>
        <b>${focus.length && fDone === focus.length ? ICONS.check : `${fDone}<i>/${FOCUS_MAX}</i>`}</b>
      </div></span>
    </div>
    ${focus.map((t, i) => `<div class="f-item ${t.done ? 'done' : ''} fade-item" ${!t.done?`draggable="true" data-task-id="${t.id}" data-today-item="1"`:''}>
        ${!t.done?`<button class="drag-handle" data-touch-drag="${t.id}" aria-label="拖移 ${esc(t.title)}">⠿</button>`:''}
        <button class="f-num ${t.done ? 'on' : ''}" data-act="task-toggle" data-id="${t.id}" aria-label="完成：${esc(t.title)}">${t.done ? ICONS.check : (i + 1)}</button>
        <div class="grow">
          <div class="tt">${esc(t.title)}</div>
          ${tagsHTML(t)}
        </div>
        <button class="f-star" data-act="task-focus" data-id="${t.id}" aria-label="移出今日重點">◆</button>
      </div>`).join('')}
    ${[...Array(FOCUS_MAX - focus.length)].map((_, i) => `<div class="f-slot"><span class="n">${focus.length + i + 1}</span><em>${focus.length + i === 0 ? '今天最想完成的是什麼？' : ''}</em></div>`).join('')}
    ${canAddFocus() ? `<div class="quickadd quickadd-wrap" style="display:block">
      <div class="row" style="gap:8px">
        <input class="field grow" id="qaFocus" placeholder="寫下一件重要的事…" enterkeyhint="done" data-enter="qa-focus">
        <button class="btn" style="padding:0 16px;border-radius:12px;flex:none" data-act="qa-focus" aria-label="加入重點">${ICONS.plus}</button>
      </div>
      ${areaChipsHTML()}
    </div>` : '<div class="hint" style="margin-top:10px">三件都排好了，專心完成它們就好。</div>'}
  </div>`;

  B.others = `<div class="card today-drop-zone" data-today-group="other">
    <div class="sec-title">其他待辦<button class="right" data-act="tab" data-tab="todo">全部 ›</button></div>
    ${otherOpen.length || otherDone.length
      ? otherOpen.sort((a,b)=>(a.order??0)-(b.order??0)).map(t => `<div data-today-wrap="1">${taskItemHTML(t, {focusBtn:true,draggable:true,touchDrag:true})}</div>`).join('') + (otherDone.length?`<button class="hint" data-act="tab" data-tab="todo" style="width:100%;text-align:left;padding:9px 2px 2px">今天另有 ${otherDone.length} 件已完成，已替你收好 ›</button>`:'')
      : '<div class="hint" style="padding:2px 2px 6px">其他想到的事，先寫在這裡就好。</div>'}
    <div class="quickadd quickadd-wrap" style="display:block">
      <div class="row" style="gap:8px">
        <input class="field grow" id="qaToday" placeholder="其他要做的事…" enterkeyhint="done" data-enter="qa-today">
        <button class="btn" style="padding:0 16px;border-radius:12px;flex:none" data-act="qa-today" aria-label="新增">${ICONS.plus}</button>
      </div>
      ${areaChipsHTML()}
    </div>
  </div>`;

  B.upcoming = upcoming.length ? `<div class="card pad-s">
    <div class="sec-title">接下來的日子<span class="right">${upcoming.length} 件已排定</span></div>
    ${upcoming.slice(0,4).map(t=>`<button class="result-item" data-act="task-edit" data-id="${t.id}">
      <span class="due-chip">${dueLabel(t.dueDate)}</span>
      <span class="grow"><strong style="font-size:14px;font-weight:550">${esc(t.title)}</strong></span><span>›</span>
    </button>`).join('')}
    ${upcoming.length>4?`<button class="hint" data-act="tab" data-tab="todo" style="width:100%;text-align:left;padding:8px 2px 0">另有 ${upcoming.length-4} 件排在更遠的日子 ›</button>`:''}
  </div>` : '';

  B.habits = `<div class="card">
    <div class="sec-title">今天的習慣<button class="right" data-act="tab" data-tab="habit">詳細 ›</button></div>
    ${habits.length ? habits.map(h => {
      const wc = habitWeekCount(h.id), wt = h.weeklyTarget || 5;
      return `<div class="h-item">
        <div class="h-emoji">${h.emoji}</div>
        <div class="grow">
          <div class="h-name">${esc(h.name)}</div>
          <div class="h-week"><div class="meter"><i style="width:${Math.min(100, wc / wt * 100)}%"></i></div><span>本週 ${wc}/${wt}</span></div>
        </div>
        <button class="h-check ${isChecked(h.id, tk) ? 'on' : ''}" data-act="habit-today" data-id="${h.id}" aria-label="打卡 ${esc(h.name)}">${ICONS.check}</button>
      </div>`;
    }).join('')
      : `<div class="hint" style="margin-bottom:9px">想養成什麼習慣？點一下加入：</div>
         <div class="seg">${SUGGEST_HABITS.map(s => `<button class="chip" data-act="habit-suggest" data-e="${s.e}" data-n="${s.n}" data-a="${s.a}">${s.e} ${s.n}</button>`).join('')}</div>`}
  </div>`;

  B.balance = meaningful>=3?`<div class="card">
    <div class="sec-title">本週平衡</div>
    ${bal.total >= 3
      ? areaList().map(a => `<div class="bal-row">
          <span class="bal-lb">${esc(a.lb)}</span>
          <span class="bal-bar"><i class="${bal.counts[a.id] ? '' : 'z'}" style="width:${bal.counts[a.id] / bal.max * 100}%;background:${areaColor(a)}"></i></span>
          <span class="bal-v">${bal.counts[a.id]}</span>
        </div>`).join('') + `<div class="bal-note">近 7 天完成的事與習慣打卡。平衡不是平均，而是符合你此刻的選擇。</div>
        ${lowArea?`<div class="nudge">「${lowArea.lb}」最近比較安靜。若你也在意，可以替它留一件很小的事。<button data-act="balance-open" data-a="${lowArea.id}">看看 ›</button></div>`:''}`
      : '<div class="hint" style="padding:2px 2px 4px">完成幾件標了領域的事之後，這裡會看見你這週把時間放在哪。</div>'}
  </div>`:'';

  B.review = meaningful>=3?weeklyReviewHTML():'';

  /* 年末與年初：輕輕邀請你回頭看一整年。可以收起，收起了那一年就不再問。 */
  const yrNow = d.getFullYear();
  const reviewYear = d.getMonth() === 11 ? yrNow : (d.getMonth() === 0 && d.getDate() <= 15 ? yrNow - 1 : null);
  const yearCard = (reviewYear && state.settings.yearReviewDismissed !== reviewYear && meaningful >= 5) ? `<div class="card">
    <div class="sec-title">${reviewYear} 年，快走完了<button class="right" data-act="year-review-dismiss" data-y="${reviewYear}">先收起</button></div>
    <button class="row" style="width:100%;text-align:left" data-act="year-review" data-y="${reviewYear}">
      <span style="font-size:24px">📅</span>
      <span class="grow" style="font-size:14px;color:var(--ink2)">花三分鐘，看看這一年你走過哪些地方</span>
      <span style="color:var(--acc);font-size:13px;font-weight:600">回顧 ›</span>
    </button>
  </div>` : '';

  const backupNudge = needsBackup?`<div class="card pad-s"><div class="row"><span style="font-size:22px">☁️</span><span class="grow" style="font-size:13.5px;color:var(--ink2)">紀錄已累積一段時間。花一分鐘備份，會更安心。</span><button class="s-today" data-act="settings">去備份</button></div></div>`:'';

  B.reflection = `<div class="card pad-s" id="reflectionCard">

           <span style="color:var(--ink3);font-size:13px">繼續 ›</span>
         </button>`
      : `<button class="row" style="width:100%;text-align:left" data-act="tab" data-tab="reflect">

/* 熱度只以「那天真的存在的習慣」為分母，之後新增習慣不會回頭改寫歷史的顏色；
   標為休息的不列入分母，休息日因此不會被算成失敗。 */
function habitsLiveOn(k){ return activeHabits().filter(h => dkey(new Date(h.createdAt || 0)) <= k); }
function heatLevel(k){
  const due = habitsLiveOn(k).filter(h => !isRest(h.id, k));
  if (!due.length) return 0;
  const c = due.filter(h => isChecked(h.id, k)).length;
  if (!c) return 0;
  const f = c / due.length;
  return f <= .25 ? 1 : f <= .5 ? 2 : f <= .75 ? 3 : 4;
}
function heatmapHTML(){
  const base = new Date();

  for (let i = 0; i < lead; i++) cells.push('<span class="hm-cell blank" aria-hidden="true"></span>');
  for (let d = 1; d <= days; d++){
    const k = `${y}-${pad(m+1)}-${pad(d)}`;
    const future = k > tk;
    const lv = future ? 0 : heatLevel(k);
    const live = future ? [] : habitsLiveOn(k);
    const doneN = live.filter(h => isChecked(h.id, k)).length;
    const restN = live.filter(h => isRest(h.id, k)).length;
    const lab = future ? `${fmtMD(k)} 尚未到來`
      : `${fmtMD(k)} 週${WD[fromKey(k).getDay()]}${live.length ? ` · 完成 ${doneN}/${live.length}${restN?` · 休息 ${restN}`:''}` : ''}`;
    cells.push(`<button class="hm-cell ${future ? 'future' : 'lv' + lv} ${k === tk ? 'today' : ''} ${k === ui.hmSel && !future ? 'sel' : ''}"
      ${future ? 'disabled' : `data-act="hm-pick" data-k="${k}"`} aria-label="${lab}" title="${lab}"${k === ui.hmSel && !future ? ' aria-current="date"' : ''}>${d}</button>`);
  }
  const wd = ['一','二','三','四','五','六','日'].map(w => `<div class="hm-wd">${w}</div>`).join('');
  return `<div class="hm-head">
      <button class="hm-nav" data-act="hm-nav" data-d="-1" aria-label="上個月">${ICONS.left}</button>
      <div class="m">${y} 年 ${m + 1} 月</div>

    </div>
    <div class="hm-grid">${wd}${cells.join('')}</div>
    <div class="hm-legend">少 <i style="background:var(--h0)"></i><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i> 多</div>`;
}
