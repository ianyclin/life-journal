/* 往年的今天：同月同日的舊紀錄。沒有的話，就從過去隨機翻一頁出來。 */
function onThisDay(){
  const now = new Date(), out = [];
  for (let y = 1; y <= 20; y++){
    const d = new Date(now.getFullYear()-y, now.getMonth(), now.getDate());
    if (d.getMonth() !== now.getMonth()) continue;      /* 2/29 之類的日子不硬湊 */
    const k = dkey(d), r = state.reflections[k];
    if (r && (r.mood || (r.text||'').trim())) out.push({k, lb:`${y} 年前的今天`, r});
  }
  return out;
}
function randomPastReflection(seed){
  const tk = todayKey();
  const ks = Object.keys(state.reflections).filter(k => k < tk && state.reflections[k] && (state.reflections[k].text||'').trim());
  if (ks.length < 5) return null;                        /* 紀錄太少時不做「回顧」，免得每天都翻到同一篇 */
  const k = ks[Math.abs(hashInt(tk + '|' + (seed||0))) % ks.length];
  return {k, lb:'從前的某一天', r:state.reflections[k]};
}
const hashInt = s => { let h = 2166136261; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h,16777619); } return h|0; };

/* ===== 從今天的紀錄長出來的書寫提示 =====
   Apple Journal 的智慧建議看的是照片與運動；這裡看的是你自己的待辦、習慣、目標與心情 ——
   三種資料剛好都在同一本手帳裡，這是別的 App 給不了的。全部在本機算，不連任何服務。

   三個原則：
   一、用真正的名字說話。「今天完成了『陪媽媽回診』」比「今天完成了 3 項任務」有溫度。
   二、用問句，不用評語。沒做到的時候不責備。
   三、狀態越差，越不要要求使用者解釋自己 —— 低潮時少問「為什麼」，多問「今天發生了什麼、
       現在還留著什麼」。「為什麼」很容易從反思變成自我審問。

   排序原則：越「只有今天才問得出來」的問題，優先級越高。
   一次只顯示一條 —— 三條同時出現，日記入口就變成三個未回答的問題。 */
function todayPrompts(){
  const tk = todayKey();
  const now = new Date(), hour = now.getHours();
  const ref = state.reflections[tk] || {};
  const written = (ref.text || '').trim();
  const lowMood = ref.mood && ref.mood <= 2;          /* 今天標了糟糕或低落 */
  const doneToday = state.tasks.filter(t => t.done && t.doneAt && dkey(new Date(t.doneAt)) === tk);
  const focus = focusTasks();
  const focusDone = focus.filter(t => t.done);
  const focusLeft = focus.filter(t => !t.done);
  const habitsDone = state.habits.filter(h => isChecked(h.id, tk));
  const rested = state.habits.filter(h => isRest(h.id, tk));
  const goalTask = doneToday.find(t => t.goalId && goalById(t.goalId));
  const yst = state.reflections[dkey(addDays(now, -1))];
  const evening = hour >= 19 || hour < 5;             /* 這些話留到晚上再說 */

  const pool = [];
  const add = (rank, q, lead) => pool.push({rank, q, lead:lead || ''});

  /* ── 只有今天才問得出來的事（優先級最高）── */

  /* 完成了拖很久的事 */
  const longAwaited = doneToday.find(t => t.createdAt && (Date.now() - t.createdAt) > 14 * 864e5);
  if (longAwaited)
    add(1, `「${longAwaited.title}」終於從清單上離開了。拖著它的這段時間，是什麼感覺？`, `「${longAwaited.title}」終於做完了，`);

  /* 很久沒碰的習慣今天又出現 */
  const returned = habitsDone.find(h => {
    for (let i = 1; i <= 10; i++) if (isChecked(h.id, dkey(addDays(now, -i)))) return false;
    /* 「又出現」的前提是以前真的做過 —— 今天不算，否則第一次打卡也會被說成「又」 */
    return Object.keys(state.habitLog).some(k => k !== tk && isChecked(h.id, k));
  });
  if (returned)
    add(1, `「${returned.name}」今天又出現了。是什麼讓你想起它？`, `今天又做了「${returned.name}」，`);

  if (focusDone.length)
    add(2, `今天完成了「${focusDone[0].title}」。現在回頭看，心裡是什麼感覺？`, `今天完成了「${focusDone[0].title}」，`);

  if (goalTask)
    add(2, `你往「${goalById(goalTask.goalId).title}」走了一步。這個方向現在感覺如何？`, `離「${goalById(goalTask.goalId).title}」又近了一點，`);

  /* 計畫和實際差很多 —— 承認計畫不是現實的唯一版本 */
  if (focus.length >= 2 && focusDone.length <= 1 && doneToday.length >= 2 && evening)
    add(2, '今天和原本想的不太一樣。真正佔滿今天的是什麼？', '今天和原本想的不一樣，真正佔滿今天的是');

  if (rested.length)
    add(3, `今天讓「${rested[0].name}」休息了。這樣的一天，過起來還好嗎？`, `今天讓「${rested[0].name}」休息，`);

  if (habitsDone.length)
    add(3, `今天有「${habitsDone[0].name}」。做的時候，感覺跟最近一樣嗎？`, `今天做了「${habitsDone[0].name}」，`);

  if (doneToday.length >= 5)
    add(3, `今天做完了 ${doneToday.length} 件事。哪一件現在還留在心裡？`, '今天做了很多事，其中');

  /* ── 跨日的脈絡 ── */

  /* 停滯很久的目標 */
  const staleGoal = state.goals.find(g => !g.done && !g.paused &&
    Date.now() - (g.lastProgressAt || g.createdAt || Date.now()) > 21 * 864e5);
  if (staleGoal && evening)
    add(4, `「${staleGoal.title}」停在這裡一陣子了。它現在還是你想去的地方嗎？`, `關於「${staleGoal.title}」，`);

  /* 一直在休息的習慣 —— 不是催他回來，是問關係變了沒 */
  const quiet = state.habits.find(h => {
    if (isChecked(h.id, tk)) return false;
    let restDays = 0;
    for (let i = 0; i < 14; i++){ const k = dkey(addDays(now, -i)); if (isChecked(h.id, k)) return false; if (isRest(h.id, k)) restDays++; }
    return restDays >= 3;
  });
  if (quiet && evening)
    add(4, `「${quiet.name}」最近安靜了一陣子。你還想把它留在生活裡嗎？`, `關於「${quiet.name}」，`);

  /* 昨天寫過的話。心情很差那天的內容不引用 —— 機械式重提會很冷 */
  if (yst && (yst.text || '').trim() && !written){
    const safe = !yst.mood || yst.mood >= 3;
    add(5, safe
      ? `昨天你寫了「${yst.text.trim().split('\n')[0].slice(0, 12)}…」。今天呢？`
      : '昨天你有留下幾句。今天呢？', '');
  }

  /* 心情已經標了但還沒寫字。不問「為什麼」——問內容 */
  if (ref.mood && !written){
    const m = MOODS.find(x => x.v === ref.mood);
    if (m) add(2, `今天是「${m.lb}」。現在最留在心裡的是什麼？`, `今天的心情是${m.lb}，`);
  }

  /* ── 統計型訊號（優先級最低）── */

  /* 不說「連續幾天」——這本手帳花很多力氣反對連續天數焦慮，不該在這裡把它遊戲化 */
  if (reflectStreak() >= 3)
    add(6, '這幾天都留下了一點。最想記得哪一件？', '這幾天裡我最想記得的是');

  if (now.getDay() === 0)
    add(6, (Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 864e5) % 2)
      ? '這週要結束了。有哪一刻你還想留著？'
      : '這週要結束了。回頭看，哪一天你想再過一次？', '這週我想留著的那一刻是');

  /* 重點還沒完成 —— 留到晚上才問，而且心情很差的日子不問。
     「還在今天裡」不宣告失敗，也不催促。 */
  if (focusLeft.length && evening && !lowMood)
    add(5, `「${focusLeft[0].title}」還在今天裡。是卡住了，還是今天已經很滿？`, `「${focusLeft[0].title}」還沒完成，`);

  /* 什麼都沒發生的日子。系統裡是空白，不代表你今天沒有活過。
     只在接近一天結束時出現；心情很差的日子讓別的問題先上。 */
  if (!doneToday.length && !habitsDone.length && !rested.length && evening && !lowMood)
    add(5, '今天沒有勾掉什麼，那今天是怎麼過的？', '今天是這樣過的：');

  return pool.sort((a, b) => a.rank - b.rank);
}

/* =================== 反思頁 =================== */
function vReflect(){
  const tk = todayKey();
  const ref = state.reflections[tk] || {};
  const rs = reflectStreak();
  /* 近 30 天心情（左=30天前，右=今天） */
  const strip = [...Array(30)].map((_, i) => {
    const k = dkey(addDays(new Date(), i - 29));
    const r = state.reflections[k];
    const mood = r && r.mood;
    const c = mood ? MOODS.find(m => m.v === mood).c : 'var(--h0)';
    const h = mood ? 6 + mood * 2.2 : 5;
    const lb = mood ? `${fmtMD(k)} 心情 ${MOODS.find(m=>m.v===mood).lb}` : `${fmtMD(k)} 有紀錄`;
    return r?`<button style="background:${c};height:${h}px" data-act="ref-open" data-k="${k}" aria-label="${lb}" title="${lb}"></button>`:`<span style="background:${c};height:${h}px;flex:1;border-radius:4px" aria-hidden="true"></span>`;
  }).join('');
  const anniv = onThisDay();
  const rnd = anniv.length ? null : randomPastReflection(ui.memorySeed||0);
  const memories = anniv.length ? anniv : (rnd ? [rnd] : []);
  const rq=ui.refQuery.trim().toLocaleLowerCase('zh-Hant');
  /* 今天那篇在上面的編輯區，所以這裡的清單與計數都不含今天 —— 兩邊口徑要一致，
     否則會出現「說有 1 篇、列表卻空的」。 */
  const hasToday = !!(ref.mood || (ref.text || '').trim());
  const pastCount = Object.keys(state.reflections).filter(k => k !== tk).length;
  const hist = Object.keys(state.reflections)
    .filter(k => k !== tk && (ui.refMood==='all'||Number(ui.refMood)===state.reflections[k].mood) && (!rq||`${k} ${state.reflections[k].text||''}`.toLocaleLowerCase('zh-Hant').includes(rq)))
    .sort().reverse().slice(0, ui.histLimit);

  return `
  <div class="page-head">
    <div><h1>每日反思</h1><div class="sub">${rs > 0 ? `🔥 已連續記錄 ${rs} 天` : '為自己留下一點紀錄'}</div></div>
  </div>

  <div class="card">
    <div class="sec-title">${fmtFull(tk)}<button class="right" data-act="ref-open" data-k="${tk}">改日期 ›</button></div>
    <div class="lbl" style="margin-top:2px;font-size:12.5px;color:var(--ink2);font-weight:600">今天的心情</div>
    <div class="moods" style="margin-top:7px">
      ${MOODS.map(m => `<button class="mood-btn ${ref.mood === m.v ? 'on' : ''}" data-act="mood" data-v="${m.v}" aria-label="${m.lb}">${m.e}<span>${m.lb}</span></button>`).join('')}
    </div>
    ${(() => {
      const ps = todayPrompts();
      if (!ps.length) return '';
      const p = ps[(ui.promptIdx || 0) % ps.length];
      return `<div class="lead-block">
        <div class="lead-head">也許可以從這裡寫起</div>
        <button class="lead-row" data-act="prompt-lead" data-p="${esc(p.lead)}"><span class="grow">${esc(p.q)}</span><span class="lead-arrow">›</span></button>
        ${ps.length > 1 ? '<button class="lead-swap" data-act="prompt-swap">換一題</button>' : ''}
      </div>`;
    })()}
    <div class="prompt-chips">
      ${PROMPTS.map(p => `<button class="chip" data-act="prompt" data-p="${esc(p)}">${p}</button>`).join('')}
    </div>
    <textarea class="field" id="refText" placeholder="今天過得如何？寫幾句就好…" data-input="ref-text">${esc(ref.text || '')}</textarea>
    <div class="save-state" id="saveState">寫下的字會自動儲存</div>
  </div>

  ${memories.length ? `<div class="card pad-s">
    <div class="sec-title">${memories[0].lb.includes('年前')?'往年的今天':'回頭看看'}
      ${memories[0].lb==='從前的某一天'?`<button class="right" data-act="memory-shuffle">換一篇 ↺</button>`:''}
    </div>
    ${memories.map(m=>{
      const mm = MOODS.find(x=>x.v===m.r.mood);
      return `<button class="r-hist" style="width:100%;text-align:left" data-act="ref-open" data-k="${m.k}">
        <span class="mo">${mm?mm.e:'📝'}</span>
        <span class="grow"><span class="dt">${m.lb} · ${fmtFull(m.k)}</span>
        <span class="tx">${esc(m.r.text || (mm?'心情：'+mm.lb:''))}</span></span>
      </button>`;
    }).join('')}
  </div>`:''}

  <div class="card pad-s">
    <div class="sec-title">近 30 天心情</div>
    <div class="mood-strip">${strip}</div>
    <div class="mood-strip-lb"><span>30 天前</span><span>今天</span></div>
  </div>

  <div class="card">
    <div class="sec-title">過去的紀錄<span class="right">${pastCount} 篇</span></div>
    <div class="search-wrap" style="margin-bottom:10px"><input class="field" id="refSearch" value="${esc(ui.refQuery)}" placeholder="搜尋過去寫下的話…" data-input="ref-search" aria-label="搜尋反思"></div>
    <div class="row" style="margin-bottom:9px">
      <span class="hint" style="flex:none">跳到</span>
      <input class="field grow" type="date" id="refJump" max="${tk}" data-change="ref-jump" aria-label="跳到某一天">
    </div>
    <div class="toolbar" style="margin-bottom:8px"><button class="chip ${ui.refMood==='all'?'on':''}" data-act="ref-mood-filter" data-v="all">全部</button>${MOODS.map(m=>`<button class="chip ${String(ui.refMood)===String(m.v)?'on':''}" data-act="ref-mood-filter" data-v="${m.v}">${m.e} ${m.lb}</button>`).join('')}</div>
    ${hist.length ? (() => {
      let lastMonth = '';
      return hist.map(k => {
        const r = state.reflections[k];
        const m = MOODS.find(x => x.v === r.mood);
        const dayFocus = state.tasks.filter(t => t.focus && t.scheduledDate === k);
        const d = fromKey(k);
        const mon = `${d.getFullYear()} 年 ${d.getMonth() + 1} 月`;
        const head = mon !== lastMonth ? `<div class="tl-head" style="background:var(--card)">${mon}</div>` : '';
        lastMonth = mon;
        return head + `<button class="r-hist" style="width:100%;text-align:left" data-act="ref-open" data-k="${k}">
          <span class="mo">${m ? m.e : '📝'}</span>
          <span class="grow">
            <span class="dt">${fmtFull(k)}${dayFocus.length ? ` · 重點 ${dayFocus.filter(t => t.done).length}/${dayFocus.length}` : ''}</span>
            <span class="tx">${hi(r.text || (m ? '心情：' + m.lb : ''), ui.refQuery)}</span>
          </span>
        </button>`;
      }).join('');
    })() : `<div class="empty" style="padding:14px">${ART.moon}${
      hasToday ? '今天那篇就在上面。之後的每一篇，都會收在這裡' : '之後的每一篇，都會收在這裡'
    }</div>`}
    ${Object.keys(state.reflections).filter(k => k !== tk).length > ui.histLimit && !rq
      ? '<button class="btn plain full sm" style="margin-top:10px" data-act="hist-more">看更早的紀錄</button>' : ''}
  </div>`;
}

/* 過去反思檢視/編輯 */
function refSheet(k){
  const r = state.reflections[k] || {};
  openSheet(`
    <h2>${fmtFull(k)}</h2>
    <div class="moods">
      ${MOODS.map(m => `<button class="mood-btn ${r.mood === m.v ? 'on' : ''}" data-act="sheet-mood" data-k="${k}" data-v="${m.v}">${m.e}<span>${m.lb}</span></button>`).join('')}
    </div>
    <textarea class="field" id="refSheetText" style="margin-top:12px" data-input="ref-sheet" data-k="${k}" placeholder="那天發生了什麼…">${esc(r.text || '')}</textarea>
    <div class="save-state" id="saveState">寫下的字會自動儲存</div>
    <div class="lbl">這篇屬於哪一天</div>
    <div class="hint" style="margin-bottom:6px">有時候是隔天才想起來要寫。改成那天，它就會收在那一天。</div>
    <div class="row">
      <input class="field grow" type="date" id="refDate" value="${k}" max="${todayKey()}" aria-label="改成哪一天">
      <button class="btn ghost" data-act="ref-move" data-k="${k}">移動</button>
    </div>
    <div class="sheet-actions"><button class="btn full" data-act="sheet-close">完成</button></div>
    ${(r.mood || (r.text || '').trim()) ? `<button class="danger-link" data-act="ref-del" data-k="${k}">刪除這一篇</button>` : ''}`);
}

/* =================== 目標頁 =================== */
function vGoal(){
  const ord = (a, b) => (a.order ?? 0) - (b.order ?? 0);
  const act = state.goals.filter(g => !g.done && !g.paused).sort(ord);
  const near = act.filter(g => g.horizon !== 'far');
  const far = act.filter(g => g.horizon === 'far');
  const paused = state.goals.filter(g => !g.done && g.paused).sort(ord);
  const records = [...state.goalRecords].sort((a,b)=>(b.completedAt||0)-(a.completedAt||0));
  return `
  <div class="page-head">
    <div><h1>人生目標</h1><div class="sub">把方向，拆成走得到的小步</div></div>
    <button class="icon-btn" data-act="goal-add" aria-label="新增目標">${ICONS.plus}</button>
  </div>

  ${act.length || paused.length || records.length ? '' : `<div class="card"><div class="empty">${ART.mountain}
    寫下一個你在意的方向<br>再把它拆成幾個小步驟</div>
    <button class="btn full" data-act="goal-add">＋ 建立第一個目標</button></div>`}

  ${near.length ? (far.length ? '<div class="sec-title" style="margin:4px 2px 10px">近程 · 一年內</div>' : '') + near.map(g => goalCardHTML(g)).join('') : ''}
  ${far.length ? `<div class="sec-title" style="margin:${near.length ? '20px' : '4px'} 2px 10px">遠程<span class="right">${far.length} 個</span></div>` + far.map(g => goalCardHTML(g)).join('') : ''}

  ${paused.length ? `<div class="sec-title" style="margin:20px 2px 10px">暫時放下<span class="right">${paused.length} 個</span></div>` + paused.map(g=>goalCardHTML(g)).join('') : ''}

  ${records.length ? `<div class="sec-title" style="margin:20px 2px 10px">🏆 完成人生紀錄 <button class="right" data-act="timeline">時光軸 ›</button></div>` + records.map(goalRecordHTML).join('') : ''}`;
}
function goalRecordHTML(r){
  const a=areaOf(r.area),d=new Date(r.completedAt||Date.now());
  return `<div class="card record-card">
    <div class="row" style="align-items:flex-start"><div class="grow"><div class="g-title">🏆 ${esc(r.title)}</div>${r.why?`<div class="g-why">${esc(r.why)}</div>`:''}<div class="record-date">完成於 ${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日${a?` · ${a.lb}`:''}</div></div></div>
    ${(() => {
      /* 完成的目標預設收合 —— 它已經走完了，不需要每次都攤開整段過程佔版面 */
      const steps = r.steps || [];
      if (!steps.length) return '';
      const open = (ui.goalOpen || []).includes(r.id);
      return (open
        ? `<div style="margin-top:10px">${steps.map(x => `<div class="s-item done"><span class="ck on" aria-hidden="true">${ICONS.check}</span><span class="grow st">${esc(x.title)}</span></div>`).join('')}</div>`
        : '')
        + `<button class="step-more" data-act="goal-toggle-steps" data-id="${r.id}">${open ? '收起' : `走過的 ${steps.length} 步`} ${open ? '▲' : '▼'}</button>`;
    })()}
    <div class="row" style="margin-top:11px">
      <button class="btn ghost grow" data-act="goal-restart" data-id="${r.id}">再走一次</button>
      <button class="btn plain" data-act="record-del" data-id="${r.id}" aria-label="刪除這筆完成紀錄">刪除</button>
    </div>
  </div>`;
}
function goalCardHTML(g){
  const p = goalProgress(g);
  const stale=!g.done&&!g.paused&&Date.now()-(g.lastProgressAt||g.createdAt||Date.now())>14*864e5;
  return `<div class="card" data-goal-card="${g.id}">
    <div class="row" style="align-items:flex-start">
      <div class="grow">
        <div class="g-title">${g.done ? '🎉 ' : ''}${esc(g.title)}${g.paused?'<span class="pause-tag">暫停中</span>':''}</div>
        ${g.why ? `<div class="g-why">${esc(g.why)}</div>` : ''}
      </div>
      <button class="goal-drag" data-goal-drag="${g.id}" aria-label="拖曳排序「${esc(g.title)}」">⠿</button>
      <button class="open-edit" data-act="goal-edit" data-id="${g.id}" aria-label="編輯目標">${ICONS.dots}</button>
    </div>
    <div class="g-prog">
      <div class="meter"><i style="width:${p.pct}%"></i></div>
      <span>${p.d}/${p.t} 步</span>
    </div>
    ${(() => {
      /* 未完成的排前面、已完成的收到最下方；預設只露兩步，其餘要展開 ——
         一次看到十步會讓人不想開始，而這本手帳的立場是「下一步走得到就好」。 */
      const undone = g.steps.filter(x => !x.done);
      const done = g.steps.filter(x => x.done);
      const open = (ui.goalOpen || []).includes(g.id);
      const shown = open ? undone : undone.slice(0, 2);
      const hidden = undone.length - shown.length;
      const row = st => {
        const queued = state.tasks.some(t => t.stepId === st.id && !t.done);
        return `<div class="s-item ${st.done ? 'done' : ''}">
          <button class="ck ${st.done ? 'on' : ''}" data-act="step-toggle" data-gid="${g.id}" data-sid="${st.id}" aria-label="完成步驟">${ICONS.check}</button>
          <div class="grow st">${esc(st.title)}</div>
          ${st.done ? '' : queued
            ? `<button class="s-today q" data-act="step-unqueue" data-sid="${st.id}" aria-label="取消排入今天">已排入 ↺</button>`
            : `<button class="s-today" data-act="step-queue" data-gid="${g.id}" data-sid="${st.id}">→ 今天</button>`}
        </div>`;
      };
      return shown.map(row).join('')
        + (open ? done.map(row).join('') : '')
        + (hidden || (!open && done.length)
            ? `<button class="step-more" data-act="goal-toggle-steps" data-id="${g.id}">${
                open ? '收起' : [hidden ? `還有 ${hidden} 步` : '', done.length ? `已完成 ${done.length} 步` : ''].filter(Boolean).join(' · ')
              } ${open ? '▲' : '▼'}</button>`
            : (open && done.length ? `<button class="step-more" data-act="goal-toggle-steps" data-id="${g.id}">收起 ▲</button>` : ''));
    })()}
    ${stale?`<div class="nudge">這個方向安靜了一陣子。你可以選一個更小的下一步，或先暫時放下。<button data-act="goal-pause-now" data-id="${g.id}">暫時放下</button></div>`:''}
    ${g.done ? `<div style="margin-top:10px"><span class="g-done-badge">✓ 完成於 ${new Date(g.doneAt).getMonth() + 1}月${new Date(g.doneAt).getDate()}日</span></div>`
      : `<div class="quickadd">
          <input class="field" id="step-${g.id}" placeholder="新增一個小步驟…" enterkeyhint="done" data-enter="step-add" data-gid="${g.id}">
          <button class="btn ghost" style="padding:0 14px" data-act="step-add" data-gid="${g.id}" aria-label="新增步驟">${ICONS.plus}</button>
        </div>`}
  </div>`;
}
function goalSheet(g){
  const isEdit = !!g;
  openSheet(`
    <h2>${isEdit ? '編輯目標' : '新目標'}</h2>
    <div class="lbl">目標名稱</div>
    <input class="field" id="gTitle" value="${isEdit ? esc(g.title) : ''}" placeholder="例如：今年跑完一場半馬" maxlength="40">

/* =================== 週期待辦 =================== */

  const days=edit?(r.weekdays||[]):[new Date().getDay()];
  openSheet(`<h2>${edit?'編輯週期待辦':'新增週期待辦'}</h2>
    <div class="lbl">待辦內容</div><input class="field" id="rpTitle" value="${edit?esc(r.title):''}" placeholder="例如：整理本週帳目" maxlength="60">
    <div class="lbl">重複方式</div><div class="seg" id="rfSeg">
      ${[['daily','每天'],['weekdays','平日'],['weekly','每週'],['monthly','每月日期'],['monthly-nth','每月第幾週'],['yearly','每年']].map(([v,lb])=>`<button class="chip ${freq===v?'on':''}" data-act="pick-rfreq" data-v="${v}">${lb}</button>`).join('')}
    </div>
    <div id="weeklyDays" style="${freq==='weekly'?'':'display:none'}"><div class="lbl">星期幾</div><div class="seg">
      ${[1,2,3,4,5,6,0].map(n=>`<button class="chip ${days.includes(n)?'on':''}" data-act="pick-rday" data-n="${n}">週${WD[n]}</button>`).join('')}
    </div></div>
    <div id="nthRule" style="${freq==='monthly-nth'?'':'display:none'}"><div class="lbl">每月的哪一天？</div><div class="row"><select class="select-field grow" id="rpNth">${[[1,'第一個'],[2,'第二個'],[3,'第三個'],[4,'第四個'],[5,'最後一個']].map(([v,lb])=>`<option value="${v}" ${Number((r&&r.nth)||1)===v?'selected':''}>${lb}</option>`).join('')}</select><select class="select-field grow" id="rpNthDay">${[1,2,3,4,5,6,0].map(n=>`<option value="${n}" ${Number((r&&r.nthWeekday) ?? fromKey(start).getDay())===n?'selected':''}>週${WD[n]}</option>`).join('')}</select></div></div>
    <div class="row"><div class="grow"><div class="lbl">每隔</div><input class="field" id="rpInterval" type="number" min="1" max="12" value="${edit?r.interval||1:1}" aria-label="重複間隔"></div>
      <div class="grow"><div class="lbl">開始日期</div><input class="field" id="rpStart" type="date" value="${start}"></div></div>
    <div class="hint" style="margin-top:7px">每月日期與每年規則會使用開始日期；若當月沒有該日，會安排在月底。</div>
    <div class="lbl">結束日期（可留白）</div><input class="field" id="rpEnd" type="date" value="${edit?esc(r.endDate||''):''}">
    <div class="lbl">出現在哪裡？</div><div class="seg" id="rpBucket">
      ${[['today','今天'],['week','本週'],['later','之後']].map(([v,lb])=>`<button class="chip ${(edit?r.bucket:'today')===v?'on':''}" data-act="pick-rbucket" data-v="${v}">${lb}</button>`).join('')}
    </div>
    <div class="lbl">生活領域</div>${areaPickerHTML(edit?r.area:null,'pick-rarea')}
    ${edit?`<div class="lbl">狀態</div><button class="chip ${r.active?'on':''}" data-act="repeat-toggle" data-active="${r.active?'1':'0'}">${r.active?'啟用中':'已暫停'}</button>`:''}
    ${edit&&nextOccurrence(r)?`<button class="btn plain full sm" style="margin-top:10px" data-act="repeat-skip-next" data-id="${r.id}">跳過下一次 (${fmtMD(nextOccurrence(r))})</button>`:''}

    ${edit?`<button class="danger-link" data-act="repeat-del" data-id="${r.id}">停止並刪除這個週期</button>`:''}`);

function moveTaskSheet(t){
  openSheet(`<h2>移動待辦</h2><div style="font-size:14.5px;margin-bottom:12px">${esc(t.title)}</div>

/* =================== 桌面自動備份到檔案 =================== */
/* 桌面版 Chrome / Edge 的 File System Access:授權一次，之後每次變動都靜靜寫回同一個檔案。
   把檔案放在 iCloud / Dropbox / OneDrive 資料夾裡，就等於免費得到跨裝置與版本保護。
   權限在重新開啟後可能退回「詢問」狀態，那需要一次點擊才能恢復 —— 設定頁會提示。 */
const FS_MIN_GAP = 5 * 60 * 1000;
const fsBackup = {
  _handle:null, lastAt:0, busy:false, needGrant:false,
  supported(){ return typeof window !== 'undefined' && typeof window.showSaveFilePicker === 'function'; },
  linked(){ return !!(state.settings.fsBackup && state.settings.fsBackup.name); },
  async load(){
    if (this._handle) return this._handle;
    this._handle = await idbMirror.getHandle();
    return this._handle;
  },
  async pick(){
    if (!this.supported()){ toast('這個瀏覽器不支援自動備份到檔案'); return false; }
    try{
      const h = await window.showSaveFilePicker({
        suggestedName:`人生手帳備份-${todayKey()}.json`,
        types:[{description:'人生手帳備份', accept:{'application/json':['.json']}}]
      });
      this._handle = h; this.needGrant = false;
      await idbMirror.setHandle(h);
      state.settings.fsBackup = {name:h.name, at:null};
      await this.write(true, true);
      return true;
    }catch(e){ return false; }   /* 使用者按取消，不是錯誤 */
  },
  async ensurePermission(interactive){
    const h = await this.load();
    if (!h || !h.queryPermission) return false;
    let p = await h.queryPermission({mode:'readwrite'});
    if (p !== 'granted' && interactive) p = await h.requestPermission({mode:'readwrite'});
    this.needGrant = p !== 'granted';
    return p === 'granted';
  },
  async write(force, interactive){
    if (this.busy || !this.linked()) return false;
    if (!force && Date.now() - this.lastAt < FS_MIN_GAP) return false;
    const h = await this.load();
    if (!h) return false;
    if (!(await this.ensurePermission(!!interactive))) return false;
    this.busy = true;
    try{
      const w = await h.createWritable();
      await w.write(exportJSON());
      await w.close();
      this.lastAt = Date.now();
      const at = new Date().toISOString();
      state.settings.fsBackup = {name:h.name, at};
      state.settings.lastBackupAt = at;
      store.save(state);
      return true;
    }catch(e){ this.needGrant = true; return false; }
    finally{ this.busy = false; }
  },
  async unlink(){
    this._handle = null; this.needGrant = false;
    await idbMirror.clearHandle();
    state.settings.fsBackup = null; save();
  }
};

function exportMarkdown(){

    });
    L.push(``);
  }

  const open = state.tasks.filter(t=>!t.done);
  if (open.length){
    L.push(`## 待辦`, ``);
    [['today','今天'],['week','本週'],['later','之後']].forEach(([b,lb])=>{
      const list = open.filter(t=>t.bucket===b);
      if (!list.length) return;
      L.push(`### ${lb}`, ``);
      list.forEach(t=>{
        const a=areaOf(t.area);
        L.push(`- [ ] ${t.focus?'◆ ':''}${t.title}${a?`　·　${a.lb}`:''}`);
        if ((t.note||'').trim()) t.note.trim().split('\n').forEach(ln => L.push(`  - ${ln}`));
      });
      L.push(``);
    });

  const doneTasks = state.tasks.filter(t=>t.done&&t.doneAt).sort((a,b)=>b.doneAt-a.doneAt);
  if (doneTasks.length){
    L.push(`## 已完成（共 ${doneTasks.length} 件）`, ``);
    doneTasks.slice(0,300).forEach(t=>L.push(`- [x] ${t.title}　${fmtMD(dkey(new Date(t.doneAt)))}`));
    if (doneTasks.length>300) L.push(`- …另有 ${doneTasks.length-300} 件`);
    L.push(``);
  }

  const rk = Object.keys(state.reflections).sort().reverse();
  if (rk.length){
    L.push(`## 每日反思（共 ${rk.length} 篇）`, ``);
    rk.forEach(k=>{
      const r = state.reflections[k], m = MOODS.find(x=>x.v===r.mood);
      L.push(`### ${fmtFull(k)}${m?`　${m.e} ${m.lb}`:''}`, ``);
      if (r.text) L.push(r.text, ``);
    });
  }

  const wk = Object.keys(state.weeklyReviews).sort().reverse().filter(k=>{const r=state.weeklyReviews[k];return r&&(r.proud||r.adjust||r.next);});
  if (wk.length){
    L.push(`## 每週回顧`, ``);
    wk.forEach(k=>{
      const r = state.weeklyReviews[k];
      L.push(`### ${fmtMD(k)} 那一週`, ``);
      if (r.proud) L.push(`- **最想肯定自己的**：${r.proud}`);
      if (r.adjust) L.push(`- **想調整的**：${r.adjust}`);
      if (r.next) L.push(`- **想守住的一件事**：${r.next}`);
      L.push(``);
    });
  }
  return L.join('\n');
}
function downloadText(name, text, mime){

}
/* =================== 合併匯入 ===================
   兩台裝置各寫各的，合併時的原則是：寧可多留，不要弄丟。
   每一種資料都有自己的「誰比較新」判準，而設定（鎖、版面、提醒）一律留在本機 —— 那是裝置的事，不是紀錄的事。 */
function mergeById(mine, theirs, newer){
  const map = new Map(mine.map(x => [x.id, x]));
  const stat = {added:0, updated:0};
  (theirs || []).forEach(t => {
    if (!t || !t.id) return;
    const m = map.get(t.id);
    if (!m){ map.set(t.id, t); stat.added++; return; }
    if (newer(t, m)){ map.set(t.id, Object.assign({}, m, t)); stat.updated++; }
  });
  return {list:[...map.values()], stat};
}
function mergeState(mine, theirs){
  const s = JSON.parse(JSON.stringify(mine));
  const report = {};
  const recency = t => Math.max(Number(t.doneAt) || 0, Number(t.lastProgressAt) || 0, Number(t.createdAt) || 0);

  const tk = mergeById(s.tasks, theirs.tasks, (a, b) => recency(a) > recency(b));
  s.tasks = tk.list; report.tasks = tk.stat;

  const hb = mergeById(s.habits, theirs.habits || [], () => false);   /* 習慣以本機為準，只補沒有的 */
  s.habits = hb.list; report.habits = hb.stat;

  /* 打卡紀錄逐日逐習慣合併；同一天一邊說完成、一邊說休息，以「完成」為準 */
  report.habitLog = {added:0};
  Object.keys(theirs.habitLog || {}).forEach(k => {
    const day = s.habitLog[k] || (s.habitLog[k] = {});
    Object.keys(theirs.habitLog[k] || {}).forEach(id => {
      const incoming = theirs.habitLog[k][id] === true ? 'done' : theirs.habitLog[k][id];
      if (!day[id]){ day[id] = incoming; report.habitLog.added++; }
      else if (day[id] === 'rest' && incoming === 'done') day[id] = 'done';
    });
  });

  /* 反思：先看 updatedAt，沒有的話留比較長的那一篇，避免把寫過的字弄不見 */
  report.reflections = {added:0, updated:0};
  Object.keys(theirs.reflections || {}).forEach(k => {
    const t = theirs.reflections[k], m = s.reflections[k];
    if (!t) return;
    if (!m){ s.reflections[k] = t; report.reflections.added++; return; }
    const tu = Number(t.updatedAt) || 0, mu = Number(m.updatedAt) || 0;
    const takeTheirs = tu > mu || (tu === mu && (t.text || '').length > (m.text || '').length);
    if (takeTheirs){ s.reflections[k] = Object.assign({}, m, t); report.reflections.updated++; }
  });

  /* 目標：步驟以 id 為單位聯集，任一邊完成就算完成 */
  report.goals = {added:0, updated:0};
  (theirs.goals || []).forEach(t => {
    if (!t || !t.id) return;
    const m = s.goals.find(g => g.id === t.id);
    if (!m){ s.goals.push(t); report.goals.added++; return; }
    const steps = new Map((m.steps || []).map(x => [x.id, Object.assign({}, x)]));
    (t.steps || []).forEach(x => {
      const cur = steps.get(x.id);
      if (!cur) steps.set(x.id, x);
      else if (x.done) cur.done = true;
    });
    const newer = (Number(t.lastProgressAt) || 0) > (Number(m.lastProgressAt) || 0);
    Object.assign(m, newer ? {title:t.title, why:t.why, area:t.area, paused:t.paused} : {},
      {steps:[...steps.values()], lastProgressAt:Math.max(Number(m.lastProgressAt) || 0, Number(t.lastProgressAt) || 0)});
    if (t.done && !m.done){ m.done = true; m.doneAt = t.doneAt || Date.now(); }
    report.goals.updated++;
  });

  const gr = mergeById(s.goalRecords, theirs.goalRecords || [], () => false);  /* 完成紀錄不可回退 */
  s.goalRecords = gr.list; report.goalRecords = gr.stat;

  const rc = mergeById(s.recurrences || [], theirs.recurrences || [], () => false);
  s.recurrences = rc.list.map(r => {
    const t = (theirs.recurrences || []).find(x => x.id === r.id);
    return t ? Object.assign({}, r, {skips:[...new Set([...(r.skips || []), ...(t.skips || [])])]}) : r;
  });
  report.recurrences = rc.stat;

  report.weeklyReviews = {added:0, updated:0};
  Object.keys(theirs.weeklyReviews || {}).forEach(k => {
    const t = theirs.weeklyReviews[k], m = s.weeklyReviews[k];
    if (!t) return;
    if (!m){ s.weeklyReviews[k] = t; report.weeklyReviews.added++; }
    else if ((Number(t.updatedAt) || 0) > (Number(m.updatedAt) || 0)){ s.weeklyReviews[k] = t; report.weeklyReviews.updated++; }
  });

  /* 領域只補進本機沒有的，名稱與顏色以本機為準 */
  report.areas = {added:0};
  (theirs.areas || []).forEach(a => {
    if (!a || !a.id || s.areas.some(x => x.id === a.id) || s.areas.length >= AREA_MAX) return;
    s.areas.push(a); report.areas.added++;
  });

  return {state:s, report};
}
let importMode = 'replace';
function doImport(text){
  try{
    const obj = JSON.parse(text);
    const data = obj && obj.data && Array.isArray(obj.data.tasks) ? obj.data : (Array.isArray(obj.tasks) ? obj : null);
    if (!data) throw 0;
    /* 結構檢查：寧可擋下來，也不要把壞掉的檔案蓋掉現有紀錄 */
    if (!Array.isArray(data.tasks) || (data.habits && !Array.isArray(data.habits))
      || (data.goals && !Array.isArray(data.goals))
      || (data.reflections && typeof data.reflections !== 'object')) throw 0;
    const when = obj.exportedAt ? new Date(obj.exportedAt) : null;
    const whenTxt = when && !isNaN(when) ? `備份時間：${when.toLocaleString('zh-TW',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}<br>` : '';
    const newer = data.v && data.v > defaultState().v;
    if (importMode === 'merge'){
      const incoming = migrate(JSON.parse(JSON.stringify(data))) || data;
      const merged = mergeState(state, incoming);
      const R = merged.report, add = o => (o && o.added) || 0, upd = o => (o && o.updated) || 0;
      const totalAdd = add(R.tasks)+add(R.habits)+add(R.habitLog)+add(R.reflections)+add(R.goals)+add(R.goalRecords)+add(R.areas)+add(R.weeklyReviews)+add(R.recurrences);
      confirmSheet('合併這份備份？', `${whenTxt}兩邊的紀錄會<b>併在一起</b>，現在的東西不會被刪掉。<br><br>
        新增：${add(R.tasks)} 筆待辦 · ${add(R.habitLog)} 天打卡 · ${add(R.reflections)} 篇反思 · ${add(R.goals) + add(R.goalRecords)} 筆目標紀錄<br>
        更新：${upd(R.reflections)} 篇反思 · ${upd(R.tasks)} 筆待辦<br><br>
        重複的不會變成兩筆；衝突時留下較新的那一份。<b>手帳鎖、版面與提醒維持這台裝置的設定。</b>${newer ? '<br><br>⚠️ 這份備份來自比目前更新的版本，部分內容可能無法顯示。' : ''}`, '合併', () => {
        try{ localStorage.setItem(PRE_IMPORT_KEY, JSON.stringify(state)); }catch(e){}
        store.autoBackup(state);
        state = merged.state;
        save(); render(); toast(totalAdd ? `已合併 ✓ 新增 ${totalAdd} 筆` : '已合併 ✓ 沒有新的內容');
      });
      return;
    }
    confirmSheet('確定要還原嗎？', `${whenTxt}將以備份內容<b>覆蓋</b>目前資料。目前的資料會先自動留一份復原點。<br>備份含：${(data.tasks||[]).length} 筆待辦、${(data.habits||[]).length} 個習慣、${Object.keys(data.reflections||{}).length} 篇反思、${(data.goals||[]).length} 個目標。${newer?'<br><br>⚠️ 這份備份來自比目前更新的版本，部分內容可能無法顯示。':''}`, '還原', () => {
      try{localStorage.setItem(PRE_IMPORT_KEY,JSON.stringify(state));}catch(e){}
      store.autoBackup(state);
      state = Object.assign(defaultState(), migrate(data) || data);
      Object.assign(ui, state.settings.viewPrefs||{});
      save(); render(); toast('已還原備份 ✓');
    });
  }catch(e){ toast('這不是有效的備份內容'); }
}

/* =================== 手帳鎖 =================== */
/* 誠實說在前面：這道鎖擋得住臨時拿走手機的人，擋不住懂技術的人。
   它不加密內容 —— 加密一旦忘記密碼就真的救不回來，對一本要陪很久的手帳來說代價太大。 */
const lockRT = {open:true, pin:'', mode:null, first:'', hiddenAt:0, wipeArmed:false};
async function hashPin(salt, pin){
  const raw = `${salt}|${pin}`;
  try{
    if (typeof crypto !== 'undefined' && crypto.subtle){
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
      return 's:' + [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, '0')).join('');
    }
  }catch(e){}
  return 'f:' + hashText(raw);   /* file:// 之類的非安全環境沒有 WebCrypto，退回較弱的雜湊 */
}
const lockCfg = () => state.settings.lock || null;
const lockOn = () => { const c = lockCfg(); return !!(c && c.hash); };
function openLockUI(mode){
  lockRT.open = false; lockRT.pin = ''; lockRT.mode = mode; lockRT.first = ''; lockRT.wipeArmed = false;
  closeSheet();
  let el = document.getElementById('lockScreen');
  if (!el){
    el = document.createElement('div');
    el.id = 'lockScreen';
    el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', '手帳已上鎖');
    el.tabIndex = -1;
    document.body.appendChild(el);
  }
  document.body.classList.add('locked');
  /* 鎖上時把底下整片標成 inert:Tab 不會跑進模糊的內容裡，螢幕閱讀器也讀不到 */
  ['app', 'tabbar', 'storageBanner', 'sheetRoot'].forEach(id => {
    const n = document.getElementById(id); if (n) n.inert = true;
  });
  drawLock();
}
function closeLockUI(){
  const el = document.getElementById('lockScreen'); if (el) el.remove();
  document.body.classList.remove('locked');
  ['app', 'tabbar', 'storageBanner', 'sheetRoot'].forEach(id => {
    const n = document.getElementById(id); if (n) n.inert = false;
  });
  lockRT.open = true; lockRT.pin = ''; lockRT.mode = null; lockRT.first = ''; lockRT.wipeArmed = false;
}
function lockNow(){ if (lockOn() && lockRT.open) openLockUI('verify'); }
function shakeLock(){
  const el = document.getElementById('lockScreen'); if (!el) return;
  el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); buzz([12, 50, 12]);
}
function drawLock(msg){
  const el = document.getElementById('lockScreen'); if (!el) return;
  const m = lockRT.mode;
  if (m === 'forgot'){
    el.innerHTML = `<div style="font-size:34px">🗝️</div>
      <div class="lk-title">忘記密碼</div>
      <div class="lk-hint">因為手帳沒有把內容加密，也沒有任何伺服器保管密碼，所以沒有其他人能替你解開。<br><br>如果你之前下載過備份檔，可以清除後再匯入，紀錄會完整回來。</div>
      <button class="btn ghost" data-act="pin-back">回去再想一下</button>
      <button class="danger-link" data-act="pin-wipe" style="max-width:280px">${lockRT.wipeArmed ? '再按一次，確定清除全部資料' : '清除全部資料，重新開始'}</button>`;
    return;
  }
  const setting = m === 'set' || m === 'confirm';
  const title = m === 'set' ? '設定四位數密碼' : m === 'confirm' ? '再輸入一次' : m === 'off' ? '輸入密碼以關閉' : '這本手帳上了鎖';
  const hint = msg || (m === 'set' ? '記住它 —— 忘記的話只能靠備份檔重新開始。'
    : m === 'confirm' ? '確認一次，避免手滑。'
    : '輸入四位數密碼，回到你的手帳。');
  el.innerHTML = `<div style="font-size:34px">📖</div>
    <div class="lk-title">${title}</div>
    <div class="lk-hint">${esc(hint)}</div>
    <div class="pin-dots" role="status" aria-label="已輸入 ${lockRT.pin.length} 位">${[0,1,2,3].map(i => `<i class="${i < lockRT.pin.length ? 'on' : ''}"></i>`).join('')}</div>
    <div class="pin-pad">
      ${[1,2,3,4,5,6,7,8,9].map(n => `<button data-act="pin-key" data-k="${n}">${n}</button>`).join('')}
      <button class="fn" data-act="pin-key" data-k="clear">清除</button>
      <button data-act="pin-key" data-k="0">0</button>
      <button class="fn" data-act="pin-key" data-k="back" aria-label="刪除一位">⌫</button>
    </div>
    ${setting || m === 'off' ? '<button class="btn plain sm" data-act="pin-cancel">取消</button>'
      : '<button class="btn plain sm" data-act="pin-forgot">忘記密碼？</button>'}`;
  el.focus({preventScroll:true});   /* 每次重畫都把焦點留在鎖裡 */
}
async function pinEntered(){
  const pin = lockRT.pin, m = lockRT.mode;
  if (m === 'set'){ lockRT.first = pin; lockRT.pin = ''; lockRT.mode = 'confirm'; drawLock(); return; }
  if (m === 'confirm'){
    if (pin !== lockRT.first){ lockRT.pin = ''; lockRT.first = ''; lockRT.mode = 'set'; shakeLock(); drawLock('兩次不一樣，再設定一次'); return; }
    const salt = uid();
    const delay = (lockCfg() && lockCfg().delay);
    state.settings.lock = {salt, hash: await hashPin(salt, pin), delay: delay === undefined || delay === null ? 60 : delay};
    save(); closeLockUI(); toast('已開啟手帳鎖 🔒'); settingsSheet(); return;
  }
  const c = lockCfg();
  const ok = c && (await hashPin(c.salt, pin)) === c.hash;
  if (!ok){ lockRT.pin = ''; shakeLock(); drawLock('密碼不對，再試一次'); return; }
  if (m === 'off'){ state.settings.lock = null; save(); closeLockUI(); toast('已關閉手帳鎖'); settingsSheet(); return; }
  closeLockUI();
}

/* =================== 每晚提醒 =================== */
/* 沒有伺服器，就用瀏覽器手上有的辦法：手帳開著時自己提醒；Android / 桌面 Chrome 再交給
   背景定期同步。iPhone 目前沒有背景排程，設定頁會誠實說明，並建議用「捷徑」App 補上。 */
const REMIND_TAG = 'life-journal-nightly';
const reminderCfg = () => state.settings.reminder || {enabled:false, time:'21:30', lastFired:null};
let remindT = null;
function wroteToday(){ const r = state.reflections[todayKey()]; return !!(r && (r.mood || (r.text || '').trim())); }
function scheduleReminder(){
  clearTimeout(remindT);
  const c = reminderCfg();
  if (!c.enabled) return;
  const [hh, mm] = String(c.time || '21:30').split(':').map(Number);
  const at = new Date(); at.setHours(hh || 0, mm || 0, 0, 0);
  if (at.getTime() <= Date.now()) at.setTime(at.getTime() + 864e5);
  remindT = setTimeout(() => { fireReminder(); scheduleReminder(); }, Math.max(1000, at.getTime() - Date.now()));
}
function fireReminder(){
  const c = reminderCfg();
  if (!c.enabled || wroteToday() || c.lastFired === todayKey()) return;   /* 已經寫過就不打擾 */
  c.lastFired = todayKey(); state.settings.reminder = c; save();
  const body = '替今天寫下一句話，只要一分鐘。';
  try{
    if (typeof Notification !== 'undefined' && Notification.permission === 'granted' && navigator.serviceWorker){
      navigator.serviceWorker.ready
        .then(reg => reg.showNotification('人生手帳', {body, tag:REMIND_TAG, icon:APP_ICON, data:{url:'./?tab=reflect'}}))
        .catch(()=>{});
    }
  }catch(e){}
  if (document.visibilityState === 'visible') toast('🌙 ' + body);
}
async function enableReminder(time){
  if (typeof Notification === 'undefined'){ toast('這個瀏覽器不支援通知'); return false; }
  let perm = Notification.permission;
  if (perm === 'default'){ try{ perm = await Notification.requestPermission(); }catch(e){ perm = 'denied'; } }
  if (perm !== 'granted'){ toast('沒有取得通知權限，可到瀏覽器設定裡開啟'); return false; }
  state.settings.reminder = {enabled:true, time:time || '21:30', lastFired:null};
  save(); scheduleReminder();
  /* 有 Service Worker 的完整部署才試背景排程；沒有的話就只靠開著的分頁 */
  if (navigator.serviceWorker && navigator.serviceWorker.controller){
    navigator.serviceWorker.ready.then(async reg => {
      if (!reg.periodicSync || !navigator.permissions) return;
      const st = await navigator.permissions.query({name:'periodic-background-sync'});
      if (st.state === 'granted') await reg.periodicSync.register('nightly-nudge', {minInterval:12 * 60 * 60 * 1000});
    }).catch(()=>{});
  }
  return true;
}

document.addEventListener('keydown', e => {
  /* 上鎖時鍵盤只剩數字與退格，其他一律不作用 */
  if(!lockRT.open){
    if(/^[0-9]$/.test(e.key)){e.preventDefault();actions['pin-key']({k:e.key});}
    else if(e.key==='Backspace'){e.preventDefault();actions['pin-key']({k:'back'});}
    return;
  }
  if(e.key==='Escape'&&$('#sheetRoot').children.length){e.preventDefault();closeSheet();return;}
  if(e.key==='Tab'&&$('#sheetRoot').children.length){
    const f=[...$('#sheetRoot').querySelectorAll('button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(x=>x.offsetParent!==null);
    if(f.length){const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
  }
  if (e.key === 'Enter'){
    if (e.isComposing || e.keyCode === 229) return;   /* 注音選字的 Enter 不算送出 */
    const el = e.target.closest('[data-enter]');
    if (!el) return;
    e.preventDefault();
    const act = actions[el.dataset.enter];
    if (act) act(el.dataset, el, e);
    return;
  }
  /* 桌面快捷鍵：只在沒有打字、也沒有開彈窗的時候作用 */
  if (e.metaKey || e.ctrlKey || e.altKey || e.isComposing) return;
  if ($('#sheetRoot').children.length) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
  const tabIdx = ['1','2','3','4','5'].indexOf(e.key);
  if (tabIdx >= 0){ e.preventDefault(); go(TABS[tabIdx].id); return; }
  if (e.key === '/'){ e.preventDefault(); globalSearchSheet(''); return; }
  if (e.key === '?'){ e.preventDefault(); shortcutsSheet(); return; }
  if (e.key === 'n' || e.key === 'N'){
    const box = $('#qaFocus') || $('#qaTodo') || $('#qaToday');
    if (box){ e.preventDefault(); box.scrollIntoView({behavior:reduceMotion()?'auto':'smooth', block:'center'}); setTimeout(()=>box.focus(), reduceMotion()?0:220); }
  }
});

  document.querySelectorAll('.goal-card-dragging,.goal-card-over').forEach(x => x.classList.remove('goal-card-dragging','goal-card-over'));
  const from = goalDrag.id; goalDrag = null;

  const list = state.goals.filter(g => !g.done && !g.paused && g.horizon === a.horizon)

  const i = list.indexOf(a), j = list.indexOf(b);

  list.splice(j, 0, list.splice(i, 1)[0]);

if(!store.loadError){
  if(state.settings.lastAutoBackupDay!==todayKey()){store.autoBackup(state);state.settings.lastAutoBackupDay=todayKey();}
  store.save(state);   /* 把升級後的結構寫回，避免舊格式殘留 */
}
render();
if(launchFocusAdd){
  const box=$('#qaTodo')||$('#qaFocus')||$('#qaToday');
  if(box){ box.scrollIntoView({block:'center'}); setTimeout(()=>box.focus({preventScroll:true}),60); }
}
/* 一開啟就先擋在鎖前面，畫面內容不會閃出來 */
lockNow();
scheduleReminder();
/* 切到背景先糊掉畫面（App 切換器的縮圖也看不到），回來時看離開多久決定要不要上鎖 */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden'){
    lockRT.hiddenAt = Date.now();
    if (lockOn()) document.body.classList.add('privacy-blur');
    return;
  }
  document.body.classList.remove('privacy-blur');
  if (!lockOn() || !lockRT.open) return;
  const delay = Number(lockCfg().delay);
  if (Date.now() - lockRT.hiddenAt >= (Number.isFinite(delay) ? delay : 60) * 1000) lockNow();
});
setTimeout(()=>{
  if(store.loadError){offerDataRescue();return;}
  if(!state.settings.lastOpenDay){state.settings.lastOpenDay=todayKey();save();}
  else if(state.settings.lastOpenDay<todayKey())rolloverSheet();
},120);
/* 跨日自動更新（手機常駐主畫面時） */
let lastDay = todayKey();
function onNewDay(k){
  lastDay = k; ui.hmSel = k; ui.hmOffset = 0; _nextOccCache.clear();
  ensureRecurringTasks(k); promoteScheduled(k); celebrated = null;
  render(); setTimeout(rolloverSheet, 120);
}
setInterval(() => { const k = todayKey(); if (k !== lastDay) onNewDay(k); }, 30000);
/* 從背景切回來（手機常見）時也立刻對一次日期，不用等下一次輪詢 */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const k = todayKey(); if (k !== lastDay) onNewDay(k);
});
</script>
</body>
</html>
