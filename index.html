<style>
/* ============ 基礎與配色(溫暖手帳風,已通過色彩驗證) ============ */
:root{
  --paper:#F6F1E7; --card:#FCF9F2; --card2:#F9F4E9; --field:#FFFDF8;
  --ink:#453B2F; --ink2:#6F6455; --ink3:#817563;
  --line:rgba(93,72,48,.16); --line-soft:rgba(93,72,48,.09);
  --acc:#B85C43; --acc-deep:#9E4C36; --acc-soft:#F2E2DA; --acc-tint:rgba(184,92,67,.12);
  --sage:#5B7A3D; --sage-deep:#47632F; --sage-soft:#E9EDDA; --sage-track:#E7EBD8;
  --gold:#C9A24B; --gold-soft:#F3EAD3;
  --h0:#EFE7D5; --h1:#A6B478; --h2:#7F9854; --h3:#5B7A3D; --h4:#3F5B2A;
  --m1:#B4432B; --m2:#D28A6F; --m3:#B3A896; --m4:#93A877; --m5:#567A40;
  /* 生活領域(已通過 CVD / 對比驗證,四色皆恆常搭配文字標籤) */
  --a-work:#2B5FA5; --a-family:#E07A3C; --a-health:#3C7A38; --a-self:#A96FC4;
  --r:16px;
  --serif:"New York", ui-serif, "Songti TC", "Noto Serif TC", "PingFang TC", Georgia, serif;
  --sans:-apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Helvetica Neue", Arial, sans-serif;
  --shadow:0 1px 2px rgba(90,70,45,.05), 0 5px 16px rgba(90,70,45,.07);
  --tabbar-h:60px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  font-family:var(--sans); color:var(--ink); background:var(--paper);
  background-image:radial-gradient(rgba(90,70,45,.05) 1px, transparent 1.2px);
  background-size:22px 22px;
  min-height:100%; line-height:1.5;
  -webkit-font-smoothing:antialiased; text-size-adjust:100%; -webkit-text-size-adjust:100%;
  overscroll-behavior-y:none;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--ink3)}
[hidden]{display:none !important}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[role="button"]:focus-visible{
  outline:3px solid rgba(184,92,67,.38);outline-offset:2px;
}

/* ============ 版面骨架 ============ */
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 28px)}
#storageBanner{
  max-width:560px;margin:0 auto 12px;padding:10px 14px;border-radius:12px;
  background:var(--gold-soft);border:1px solid rgba(160,120,40,.25);color:#6B5620;font-size:13px;line-height:1.7;
}
#storageBanner.danger{background:var(--acc-soft);border-color:var(--acc);color:var(--acc-deep)}
#storageBanner button{color:inherit}
/* 底部分頁列 */
#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:flex;justify-content:center;
  background:rgba(252,249,242,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-top:1px solid var(--line-soft);
  padding-bottom:env(safe-area-inset-bottom);
}
#tabbar .inner{display:flex;width:100%;max-width:560px}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 0 6px;color:var(--ink3);font-size:10.5px;letter-spacing:.02em;
  transition:color .15s;
}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--acc)}
.tab:active{opacity:.7}

/* ============ 通用元件 ============ */
.card{
  position:relative;background:var(--card);border:1px solid var(--line-soft);
  border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;
}
.card.pad-s{padding:13px 14px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin:2px 2px 14px}
.page-head h1{font-family:var(--serif);font-size:25px;font-weight:700;letter-spacing:.02em}
.page-head .sub{font-size:12.5px;color:var(--ink2);margin-top:2px}
.icon-btn{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);
  background:var(--card);border:1px solid var(--line-soft);box-shadow:var(--shadow);flex:none;
}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:19px;height:19px}
.sec-title{
  display:flex;align-items:center;gap:8px;
  font-family:var(--serif);font-size:14.5px;font-weight:700;color:var(--ink2);
  letter-spacing:.08em;margin:0 0 10px;
}
.sec-title::before{content:"";width:8px;height:8px;border-radius:2.5px;background:var(--acc);opacity:.75;transform:rotate(45deg);flex:none}
.sec-title .right{margin-left:auto;font-family:var(--sans);font-weight:500;letter-spacing:0;font-size:12.5px;color:var(--ink3)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--acc);color:#fff;font-size:15px;font-weight:600;
  border-radius:13px;padding:12px 18px;transition:transform .1s;
}
.btn svg{width:18px;height:18px;flex:none}
.btn:active{transform:scale(.97);background:var(--acc-deep)}
.btn.full{width:100%}
.btn.ghost{background:transparent;color:var(--acc);border:1.5px solid var(--acc-tint);background:var(--acc-soft)}
.btn.ghost:active{background:var(--acc-tint)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.plain{background:transparent;color:var(--ink2);border:1px solid var(--line)}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:999px;
  background:var(--card2);border:1px solid var(--line-soft);font-size:13.5px;color:var(--ink2);
}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.hint{font-size:12.5px;color:var(--ink3)}
.divider{border:none;border-top:1px dashed var(--line);margin:12px 0}
.empty{
  text-align:center;padding:26px 12px;color:var(--ink3);font-size:14px;
}
.empty .big{font-size:34px;margin-bottom:8px;opacity:.9}
.field{
  width:100%;background:var(--field);border:1px solid var(--line);border-radius:12px;
  padding:11px 13px;font-size:16px;outline:none;
}
.field:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-tint)}
textarea.field{resize:none;min-height:120px;line-height:1.7}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.toolbar{display:flex;gap:7px;overflow-x:auto;padding:1px 1px 5px;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.toolbar .chip{flex:none}
.select-field{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:7px 30px 7px 10px;font-size:13px;outline:none}
.filter-count{font-size:10px;opacity:.75;margin-left:2px}
.drop-zone.drag-over{outline:2px dashed var(--acc);outline-offset:3px;background:var(--acc-soft)}
.t-item[draggable="true"]{cursor:grab}
.t-item.dragging{opacity:.45}
.drag-handle{width:28px;min-height:34px;display:grid;place-items:center;color:var(--ink3);font-size:18px;cursor:grab;touch-action:none;flex:none}
.touch-dragging{opacity:.55;transform:scale(.985);box-shadow:0 6px 18px rgba(70,50,30,.16);z-index:3}
.drag-target{outline:2px dashed var(--acc);outline-offset:2px;border-radius:10px}
.today-drop-zone{transition:background .15s,outline .15s}
.today-drop-zone.drag-over{background:var(--acc-soft);outline:2px dashed var(--acc);outline-offset:3px}
.move-btn{padding:6px 7px;color:var(--ink3);flex:none;border-radius:8px}
.move-btn:active{background:var(--card2)}
.repeat-badge{color:var(--acc-deep);background:var(--acc-soft);border-color:transparent}
.rep-ic{font-size:19px;width:22px;text-align:center;flex:none;color:var(--acc)}
.rep-ic.off{color:var(--ink3);font-weight:700;letter-spacing:-1px}
.pause-tag{display:inline-block;margin-left:8px;vertical-align:middle;font-family:var(--sans);font-size:11.5px;font-weight:600;
  color:var(--ink2);background:var(--card2);border:1px solid var(--line-soft);border-radius:7px;padding:2px 8px}
.due-badge{color:#6B5620;background:var(--gold-soft);border-color:transparent}
@media (prefers-color-scheme:dark){.due-badge{color:#E4CE94}}
.morning-note{font-size:13px;color:var(--ink2);margin:-3px 0 12px;line-height:1.7}
.nudge{padding:10px 11px;margin-top:10px;border-radius:11px;background:var(--card2);font-size:13px;color:var(--ink2);line-height:1.65}
.nudge button{color:var(--acc);font-weight:650;margin-left:4px}
.rest-badge{font-size:11px;color:#6B5620;background:var(--gold-soft);border-radius:7px;padding:2px 7px}
.repeat-row{padding:10px 1px;border-bottom:1px dashed var(--line-soft)}
.repeat-row:last-child{border-bottom:none}
.search-wrap{position:relative}
.search-wrap .field{padding-left:38px}
.search-wrap::before{content:"⌕";position:absolute;left:13px;top:7px;font-size:21px;color:var(--ink3);z-index:1}
.review-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:9px 0}
.review-stat{background:var(--card2);border:1px solid var(--line-soft);border-radius:11px;padding:9px}
.review-stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums;line-height:1.25;white-space:nowrap}
.review-stat span{display:block;font-size:11px;color:var(--ink2);line-height:1.4;margin-top:1px}
.due-chip{flex:none;font-size:11.5px;color:#6B5620;background:var(--gold-soft);border-radius:7px;padding:3px 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (prefers-color-scheme:dark){.due-chip{color:#E4CE94}}
.record-card{border-left:3px solid var(--gold)}
.record-date{font-size:12px;color:var(--ink3);margin-top:3px}
.global-results{max-height:55dvh;overflow-y:auto;margin-top:9px}
.result-group{font-family:var(--serif);font-size:13px;font-weight:700;color:var(--ink2);margin:12px 2px 5px}
.result-item{width:100%;display:flex;gap:9px;align-items:flex-start;text-align:left;padding:9px 3px;border-bottom:1px dashed var(--line-soft)}
.result-item:last-child{border-bottom:none}
.onboard-steps{display:grid;gap:9px;margin-top:10px}
.onboard-step{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:11px;background:var(--card2)}
.onboard-step b{width:23px;height:23px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;flex:none;font-size:12px}
.onboard-step.done{opacity:.6}.onboard-step.done b{background:var(--sage);color:white}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
@media (prefers-contrast:more){
  :root{--line:rgba(60,42,24,.34);--line-soft:rgba(60,42,24,.22);--ink3:#655A4C}
  .card{border-color:var(--line)}
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#1F1C18;--card:#29251F;--card2:#312C25;--field:#25211C;
    --ink:#F1E8DB;--ink2:#CFC1AF;--ink3:#AA9C89;--line:rgba(242,226,204,.19);--line-soft:rgba(242,226,204,.11);
    --acc:#D77B60;--acc-deep:#E48A70;--acc-soft:#472D25;--acc-tint:rgba(215,123,96,.18);
    --sage:#87A966;--sage-deep:#A8C88A;--sage-soft:#2F3827;--sage-track:#3B4134;--gold:#D9B45F;--gold-soft:#443922;--h0:#3A342A;
    --h1:#4E6136;--h2:#657F44;--h3:#7C9C53;--h4:#95B968;
    --m1:#E0745A;--m2:#D9A188;--m3:#A79A88;--m4:#9DBA7C;--m5:#7FA85F;
    /* 深色底下把領域色提亮,維持同樣的辨識度與對比 */
    --a-work:#7BAEEC;--a-family:#F0A268;--a-health:#78C271;--a-self:#C89FE3;
    --shadow:0 1px 2px rgba(0,0,0,.18),0 7px 20px rgba(0,0,0,.16);
  }
  body{background-image:radial-gradient(rgba(245,230,205,.045) 1px,transparent 1.2px)}
  #tabbar{background:rgba(41,37,31,.92)}#toast{background:#EDE3D5;color:#29231D}
}
@media (min-width:760px){#app{max-width:680px}.card{padding:18px}.page-head h1{font-size:28px}}
body.text-large .tt,body.text-large .h-name,body.text-large .g-title,body.text-large .f-item .tt{font-size:18px}
body.text-large .hint,body.text-large .sub,body.text-large .h-sub{font-size:14px}
body.text-large .field,body.text-large input,body.text-large textarea,body.text-large select{font-size:18px}
body.text-large .btn,body.text-large .chip{font-size:15px}

/* 勾選圓圈 */
.ck{
  width:25px;height:25px;border-radius:50%;border:1.8px solid var(--ink3);
  display:grid;place-items:center;flex:none;transition:all .18s;background:transparent;
}
.ck svg{width:13px;height:13px;color:#fff;opacity:0;transform:scale(.4);transition:all .18s}
.ck.on{background:var(--h3);border-color:var(--h3)}
.ck.on svg{opacity:1;transform:scale(1)}

/* 統計小卡 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line-soft);border-radius:14px;box-shadow:var(--shadow);padding:11px 12px}
.stat .lb{font-size:11px;color:var(--ink2);letter-spacing:.03em}
.stat .v{font-size:19px;font-weight:650;margin-top:2px}
.stat .v small{font-size:12px;font-weight:500;color:var(--ink3);margin-left:1px}

/* 進度條(量表:填色=鼠尾草綠,軌道=同色系淺階) */
.meter{height:8px;border-radius:99px;background:var(--sage-track);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--sage);transition:width .3s}

/* ============ 今日頁 ============ */
.greet-card{padding:20px 18px 17px;margin-top:10px;overflow:visible}
.tape{
  position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(-2.5deg);
  width:92px;height:22px;border-radius:3px;
  background:linear-gradient(90deg, rgba(184,92,67,.30), rgba(201,162,75,.30));
  box-shadow:0 1px 2px rgba(90,70,45,.10);
}
.greet-date{font-family:var(--serif);font-size:23px;font-weight:700;letter-spacing:.03em}
.greet-hello{font-size:13.5px;color:var(--ink2);margin-top:3px}
.greet-quote{
  margin-top:12px;padding-top:11px;border-top:1px dashed var(--line);
  font-family:var(--serif);font-size:14.5px;color:var(--ink2);line-height:1.75;
}
.greet-quote::before{content:"「";color:var(--acc);font-weight:700}
.greet-quote::after{content:"」";color:var(--acc);font-weight:700}

/* 待辦項目 */
.t-item{display:flex;align-items:center;gap:11px;padding:10px 2px;border-bottom:1px dashed var(--line-soft)}
.t-item:last-child{border-bottom:none}
.t-item .tt{font-size:15.5px;word-break:break-word}
.t-item.done .tt{color:var(--ink3);text-decoration:line-through;text-decoration-color:rgba(154,140,119,.7)}
.t-item .meta{display:flex;gap:5px;margin-top:2px;flex-wrap:wrap}
.t-tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--ink2);background:var(--card2);border:1px solid var(--line-soft);border-radius:6px;padding:1.5px 7px}
.t-tag.goal{color:var(--sage-deep);background:var(--sage-soft);border-color:transparent}
.open-edit{padding:6px;color:var(--ink3);flex:none}
.open-edit svg{width:17px;height:17px}
.hm-nav svg{width:19px;height:19px}
.quickadd{display:flex;gap:8px;margin-top:10px}
.quickadd .field{flex:1}
.quickadd .btn{padding:0 16px;border-radius:12px;flex:none}

/* 習慣列 */
.h-item{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px dashed var(--line-soft)}
.h-item:last-child{border-bottom:none}
.h-emoji{width:40px;height:40px;border-radius:12px;background:var(--card2);border:1px solid var(--line-soft);display:grid;place-items:center;font-size:20px;flex:none}
.h-name{font-size:15.5px;font-weight:550}
.h-sub{font-size:12px;color:var(--ink3);margin-top:1px}
.h-sub .streak{color:var(--acc);font-weight:600}
.h-check{
  width:42px;height:42px;border-radius:50%;border:2px solid var(--line);
  display:grid;place-items:center;flex:none;transition:all .2s;font-size:0;
}
.h-check svg{width:19px;height:19px;color:#fff;opacity:0;transform:scale(.4);transition:all .2s}
.h-check.on{background:var(--h3);border-color:var(--h3)}
.h-check.on svg{opacity:1;transform:scale(1)}
.h-check:active{transform:scale(.92)}

/* 7天小圓點 */
.dots7{display:flex;gap:7px;margin-top:8px}
.dot7{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}
.dot7 b,.dot7 button{
  width:100%;max-width:30px;aspect-ratio:1;border-radius:50%;background:var(--h0);
  display:grid;place-items:center;transition:all .15s;
}
.dot7 b.on,.dot7 button.on{background:var(--h3)}
.dot7 b.rest,.dot7 button.rest{background:var(--gold-soft);border:1px solid rgba(160,120,40,.24)}
.dot7 b.today,.dot7 button.today{outline:2px solid var(--acc);outline-offset:1.5px}
.dot7 span{font-size:10px;color:var(--ink3)}
.dot7 b:active,.dot7 button:active{transform:scale(.9)}

/* ============ 月曆熱度圖 ============ */
.hm-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.hm-head .m{font-family:var(--serif);font-size:16.5px;font-weight:700}
.hm-nav{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink2);background:var(--card2);border:1px solid var(--line-soft)}
.hm-nav:disabled{opacity:.35}
.hm-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.hm-wd{font-size:10.5px;color:var(--ink3);text-align:center;padding-bottom:3px}
.hm-cell{
  aspect-ratio:1;border-radius:7px;background:var(--h0);position:relative;
  display:grid;place-items:center;font-size:11px;color:var(--ink2);
  transition:transform .1s;
}
.hm-cell:active{transform:scale(.92)}
.hm-cell.lv1{background:var(--h1)}
.hm-cell.lv2{background:var(--h2);color:#fff}
.hm-cell.lv3{background:var(--h3);color:#fff}
.hm-cell.lv4{background:var(--h4);color:#fff}
.hm-cell.future{background:transparent;border:1px dashed var(--line-soft);color:var(--ink3)}
.hm-cell.blank{background:transparent}
.hm-cell.today::after{content:"";position:absolute;inset:-2.5px;border:2px solid var(--acc);border-radius:9px}
.hm-cell.sel::after{content:"";position:absolute;inset:-2.5px;border:2px solid var(--ink2);border-radius:9px}
.hm-legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:9px;font-size:10.5px;color:var(--ink3)}
.hm-legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

/* ============ 心情 ============ */
.moods{display:flex;gap:6px}
.mood-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 2px;border-radius:13px;border:1.5px solid transparent;font-size:24px;
  filter:grayscale(.55);opacity:.75;transition:all .15s;
}
.mood-btn span{font-size:10.5px;color:var(--ink2)}
.mood-btn.on{filter:none;opacity:1;border-color:var(--line);background:var(--card2);transform:scale(1.04)}
.mood-btn:active{transform:scale(.95)}
.mood-strip{display:flex;gap:3px;align-items:flex-end}
.mood-strip b,.mood-strip button{flex:1;height:16px;border-radius:4px;background:var(--h0)}
.mood-strip-lb{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink3);margin-top:5px}
.r-hist{display:flex;gap:11px;padding:11px 2px;border-bottom:1px dashed var(--line-soft);align-items:flex-start}
.r-hist:last-child{border-bottom:none}
.r-hist .mo{font-size:21px;flex:none;line-height:1.3}
.r-hist .dt{font-size:12px;color:var(--ink3)}
.r-hist .tx{font-size:14px;color:var(--ink2);margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.save-ind{font-size:12px;color:var(--sage);opacity:0;transition:opacity .3s}
.save-ind.show{opacity:1}
.prompt-chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin:9px 0 2px;scrollbar-width:none}
.prompt-chips::-webkit-scrollbar{display:none}
.prompt-chips .chip{flex:none;font-size:12.5px;padding:6px 11px}

/* ============ 目標 ============ */
.g-title{font-family:var(--serif);font-size:17.5px;font-weight:700}
.g-why{font-size:13px;color:var(--ink2);margin-top:2px}
.g-prog{display:flex;align-items:center;gap:10px;margin:11px 0 4px}
.g-prog .meter{flex:1}
.g-prog span{font-size:12px;color:var(--ink2);flex:none}
.s-item{display:flex;align-items:center;gap:10px;padding:8.5px 0;border-bottom:1px dashed var(--line-soft)}
.s-item:last-child{border-bottom:none}
.s-item .ck{width:22px;height:22px}
.s-item .st{font-size:14.5px;word-break:break-word}
.s-item.done .st{color:var(--ink3);text-decoration:line-through}
.s-today{
  flex:none;font-size:11.5px;color:var(--acc);font-weight:600;background:var(--acc-soft);
  border-radius:8px;padding:4.5px 9px;
}
.s-today.q{color:var(--ink3);background:var(--card2);font-weight:500}
.g-done-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--sage-deep);background:var(--sage-soft);border-radius:8px;padding:3px 9px;font-weight:600}
/* 今日頁的目標區塊 */
.tg-item{padding:10px 0;border-bottom:1px dashed var(--line-soft)}
.tg-item:first-of-type{padding-top:2px}
.tg-item:last-child{border-bottom:none;padding-bottom:2px}
.tg-title{font-family:var(--serif);font-size:15.5px;font-weight:700}

/* ============ 今日三件重點 ============ */
.ring{position:relative;width:46px;height:46px;flex:none}
.ring svg{width:46px;height:46px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4;stroke-linecap:round}
.ring .rb{stroke:var(--sage-track)}
.ring .rf{stroke:var(--sage);transition:stroke-dashoffset .45s cubic-bezier(.3,.8,.4,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:700;letter-spacing:-.02em}
.ring b i{font-style:normal;font-size:10.5px;font-weight:500;color:var(--ink3)}
.f-item{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px dashed var(--line-soft)}
.f-item:last-of-type{border-bottom:none}
.f-num{
  width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;
  border:1.8px solid var(--ink3);color:var(--ink2);font-size:13.5px;font-weight:650;
  font-variant-numeric:tabular-nums;transition:all .18s;
}
.f-num svg{width:14px;height:14px;color:#fff}
.f-num.on{background:var(--h3);border-color:var(--h3);color:#fff}
.f-num:active{transform:scale(.92)}
.f-item .tt{font-size:16px;font-weight:550;word-break:break-word;line-height:1.4}
.f-item.done .tt{color:var(--ink3);text-decoration:line-through;text-decoration-color:rgba(154,140,119,.7)}
.f-star{flex:none;color:var(--acc);font-size:13px;padding:7px 6px;opacity:.85}
.f-star.off{color:var(--ink3);opacity:.5}
.f-slot{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px dashed var(--line-soft)}
.f-slot:last-of-type{border-bottom:none}
.f-slot span.n{
  width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;
  border:1.8px dashed var(--line);color:var(--ink3);font-size:13.5px;font-variant-numeric:tabular-nums;
}
.f-slot em{font-style:normal;font-size:14.5px;color:var(--ink3)}

/* 領域標籤 */
.adot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.t-tag .adot{margin-right:1px}

/* 快速新增的領域選擇(聚焦後才出現,平時不干擾) */
.qa-areas{display:none;gap:6px;margin-top:9px;flex-wrap:wrap}
.qa-open .qa-areas,.qa-always .qa-areas{display:flex}
.qa-areas .chip{font-size:12.5px;padding:5.5px 10px}
.qa-areas .chip .adot{margin-right:4px}

/* ============ 本週平衡 ============ */
.bal-row{display:flex;align-items:center;gap:10px;padding:5.5px 0}
.bal-lb{font-size:13.5px;color:var(--ink2);width:34px;flex:none}
.bal-bar{flex:1;height:8px;display:flex;align-items:center}
.bal-bar i{display:block;height:8px;border-radius:0 4px 4px 0;transition:width .35s}
.bal-bar i.z{display:none}   /* 0 就是沒有,不畫一小截假的長度 */
.bal-v{font-size:12.5px;color:var(--ink2);width:20px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.bal-note{font-size:12px;color:var(--ink3);margin-top:9px}

/* 習慣的長期趨勢 */
.trend{display:flex;gap:3px;align-items:flex-end;height:34px;margin-top:11px;padding-top:2px}
.trend i{flex:1;background:var(--sage);border-radius:3px 3px 0 0;min-height:3px;opacity:.85}
.trend i.now{background:transparent;border:1.5px dashed var(--acc);border-bottom:none;border-radius:4px 4px 0 0;opacity:1}
.trend-lb{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;color:var(--ink3);margin-top:5px}
.trend-lb span:nth-child(2){color:var(--ink2)}

/* 習慣週目標 */
.h-week{display:flex;align-items:center;gap:8px;margin-top:5px}
.h-week .meter{flex:1;height:6px}
.h-week span{font-size:11.5px;color:var(--ink2);flex:none;font-variant-numeric:tabular-nums}

/* ============ 底部彈窗 ============ */
#sheetRoot .overlay{
  position:fixed;inset:0;background:rgba(58,45,28,.38);z-index:90;
  animation:fadeIn .2s;
}
#sheetRoot .sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:91;margin:0 auto;max-width:560px;
  background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(60,45,25,.18);
  padding:10px 18px calc(20px + env(safe-area-inset-bottom));
  max-height:86dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  animation:slideUp .3s cubic-bezier(.32,.72,.28,1);
}
.sheet .grab{width:38px;height:4.5px;border-radius:99px;background:var(--line);margin:2px auto 13px}
.sheet-x{
  position:absolute;top:16px;right:14px;width:30px;height:30px;border-radius:50%;
  background:var(--card2);border:1px solid var(--line-soft);color:var(--ink2);
  font-size:13px;display:grid;place-items:center;
}
.sheet h2{font-family:var(--serif);font-size:19px;font-weight:700;margin-bottom:13px}
.sheet .lbl{font-size:12.5px;color:var(--ink2);margin:13px 0 6px;font-weight:600}
@keyframes slideUp{from{transform:translateY(60%);opacity:.6}to{transform:translateY(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.emoji-grid button{
  aspect-ratio:1;font-size:22px;border-radius:12px;background:var(--card2);
  border:1.5px solid transparent;display:grid;place-items:center;
}
.emoji-grid button.on{border-color:var(--acc);background:var(--acc-soft)}
.emoji-panel{max-height:190px;overflow-y:auto;padding:2px}
.seg{display:flex;gap:7px;flex-wrap:wrap}
.sheet-actions{display:flex;gap:9px;margin-top:18px}
.sheet-actions .btn{flex:1}
.danger-link{width:100%;text-align:center;color:var(--m1);font-size:14px;padding:13px 0 2px}
.kbd{flex:none;min-width:64px;text-align:center;font-family:var(--sans);font-size:12.5px;font-weight:650;color:var(--ink2);
  background:var(--card2);border:1px solid var(--line);border-bottom-width:2px;border-radius:7px;padding:4px 8px}

/* Toast */
#toast{
  position:fixed;left:50%;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 18px);
  transform:translateX(-50%) translateY(8px);z-index:120;
  background:#4A4036;color:#F6F1E7;font-size:13.5px;border-radius:99px;
  padding:9px 17px;opacity:0;pointer-events:none;transition:all .25s;max-width:82vw;text-align:center;
  box-shadow:0 4px 14px rgba(60,45,25,.25);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 慶祝動畫 */
@keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out}
.fade-item{animation:fadeIn .25s}
.confetti{position:fixed;inset:0;z-index:130;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:8px;height:12px;border-radius:2px;opacity:.9;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}
</style>
</head>

(function installManifest(){
  try{
    /* manifest 走 blob: URL,裡面的網址必須是絕對路徑,否則瀏覽器會整條忽略 */
    const START_URL = location.origin + location.pathname;
    const SCOPE = START_URL.replace(/[^/]*$/, '');
    const mf = {
      name:'人生手帳', short_name:'手帳',
      description:'待辦、習慣、反思與目標,全部存在你的手機裡。',
      start_url:START_URL, scope:SCOPE, id:START_URL,
      display:'standalone', orientation:'portrait-primary',

        {src:APP_ICON_MASKABLE, sizes:'512x512', type:'image/png', purpose:'maskable'}
      ]
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(mf)], {type:'application/manifest+json'}));
    const l = document.createElement('link'); l.rel='manifest'; l.href=url;
    document.head.appendChild(l);
  }catch(e){}
})();

function searchResultsHTML(q){
  const term=(q||'').trim().toLocaleLowerCase('zh-Hant');
  if(!term) return '<div class="empty" style="padding:20px">輸入文字,找回曾經寫下的事</div>';
  const hit=s=>String(s||'').toLocaleLowerCase('zh-Hant').includes(term);
  const tasks=state.tasks.filter(t=>hit(t.title)).slice(0,12);
  const goals=state.goals.filter(g=>hit(`${g.title} ${g.why||''}`)).slice(0,8);
  const records=state.goalRecords.filter(g=>hit(`${g.title} ${g.why||''}`)).slice(0,8);
  const refs=Object.keys(state.reflections).filter(k=>hit(`${state.reflections[k].text||''} ${k} ${fmtMD(k)}`)).sort().reverse().slice(0,10);
  const habits=state.habits.filter(h=>hit(`${h.name} ${h.minVersion||''}`)).slice(0,8);
  const total=tasks.length+goals.length+records.length+refs.length+habits.length;
  if(!total) return '<div class="empty" style="padding:20px">沒有找到相符內容</div>';
  const row=(ic,title,sub,tab,extra)=>`<button class="result-item" data-act="search-go" data-tab="${tab}" ${extra||''}><span>${ic}</span><span class="grow"><strong style="font-size:14px">${esc(title)}</strong>${sub?`<span class="hint" style="display:block">${esc(sub)}</span>`:''}</span><span>›</span></button>`;
  return `<div class="hint" style="margin:4px 2px 0">找到 ${total} 筆</div>`
    +(tasks.length?'<div class="result-group">待辦</div>'+tasks.map(t=>row(t.done?'✓':'○',t.title,(t.done?'已完成 · ':'')+({today:'今天',week:'本週',later:'之後'}[t.bucket]||''),'todo')).join(''):'')
    +(habits.length?'<div class="result-group">習慣</div>'+habits.map(h=>row(h.emoji,h.name,h.minVersion||'','habit')).join(''):'')
    +(goals.length?'<div class="result-group">目標</div>'+goals.map(g=>row('⚑',g.title,g.why||'','goal')).join(''):'')
    +(records.length?'<div class="result-group">完成紀錄</div>'+records.map(g=>row('🏆',g.title,fmtMD(dkey(new Date(g.completedAt))),'goal')).join(''):'')
    +(refs.length?'<div class="result-group">反思</div>'+refs.map(k=>row('🌙',(state.reflections[k].text||'心情紀錄').split('\n')[0],fmtFull(k),'reflect',`data-k="${k}"`)).join(''):'');
}

const KEY = 'life_journal_v1';
const AUTO_BACKUP_KEY=KEY+'_auto_backups';
const hashText=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(16);};
const store = (() => {
  let ok = true;
  try { localStorage.setItem('__lj_t', '1'); localStorage.removeItem('__lj_t'); }
  catch (e) { ok = false; }
  return {
    ok, loadError:false, saveError:false, bytes:0,
    load(){
      if (!ok) return null;
      try{
        const raw=localStorage.getItem(KEY);if(!raw)return null;
        const sig=localStorage.getItem(KEY+'_checksum');
        if(sig&&sig!==hashText(raw)){this.loadError=true;return null;}
        this.bytes=raw.length;
        return JSON.parse(raw);
      }catch(e){this.loadError=true;return null;}
    },
    /* 空間寫滿時不再靜默失敗:先丟掉舊的自動復原點再試一次,仍失敗就明確告訴使用者 */
    save(data){
      if (!ok) return;
      let raw;
      try{ raw = JSON.stringify(data); }catch(e){ return; }
      const write = () => { localStorage.setItem(KEY,raw); localStorage.setItem(KEY+'_checksum',hashText(raw)); };
      try{
        write(); this.bytes=raw.length;
        if(this.saveError){ this.saveError=false; updateStorageBanner(); }
      }catch(e){
        try{
          const arr=JSON.parse(localStorage.getItem(AUTO_BACKUP_KEY)||'[]');
          localStorage.setItem(AUTO_BACKUP_KEY,JSON.stringify(arr.slice(0,1)));
          localStorage.removeItem(PRE_IMPORT_KEY);
          write(); this.bytes=raw.length;
          if(this.saveError){ this.saveError=false; updateStorageBanner(); }
        }catch(e2){
          if(!this.saveError){ this.saveError=true; updateStorageBanner(); }
        }
      }
      idbMirror.save(raw);
    },
    autoBackup(data){
      if(!ok)return;
      try{const arr=JSON.parse(localStorage.getItem(AUTO_BACKUP_KEY)||'[]');arr.unshift({at:new Date().toISOString(),data});localStorage.setItem(AUTO_BACKUP_KEY,JSON.stringify(arr.slice(0,5)));}catch(e){}
    },
    backups(){try{return JSON.parse(localStorage.getItem(AUTO_BACKUP_KEY)||'[]');}catch(e){return[];}}
  };
})();

const idbMirror={
  db:null,
  open(){if(this.db)return Promise.resolve(this.db);if(typeof indexedDB==='undefined')return Promise.reject();return new Promise((resolve,reject)=>{const q=indexedDB.open('life_journal_rescue',1);q.onupgradeneeded=()=>q.result.createObjectStore('snapshots',{keyPath:'at'});q.onsuccess=()=>{this.db=q.result;resolve(this.db);};q.onerror=()=>reject(q.error);});},
  async save(raw){try{const db=await this.open();const tx=db.transaction('snapshots','readwrite');tx.objectStore('snapshots').put({at:Date.now(),raw});const all=await new Promise((res,rej)=>{const q=tx.objectStore('snapshots').getAllKeys();q.onsuccess=()=>res(q.result);q.onerror=()=>rej();});all.sort((a,b)=>b-a).slice(10).forEach(k=>tx.objectStore('snapshots').delete(k));}catch(e){}},
  async latest(){try{const db=await this.open();return await new Promise((res,rej)=>{const q=db.transaction('snapshots').objectStore('snapshots').openCursor(null,'prev');q.onsuccess=()=>res(q.result?q.result.value.raw:null);q.onerror=()=>rej();});}catch(e){return null;}},
  async clear(){try{const db=await this.open();db.transaction('snapshots','readwrite').objectStore('snapshots').clear();}catch(e){}}
};

/* 舊版資料升級:保留既有紀錄,補上排序、日期、週期與溫和習慣欄位 */
function migrate(s){
  if (!s || !Array.isArray(s.tasks)) return null;
  const tk = todayKey();
  s.tasks = s.tasks.map((t, i) => Object.assign({area:null, focus:false, order:i, scheduledDate:t.bucket === 'today' ? tk : null, recurrenceId:null, occurrenceDate:null}, t));
  s.habits = (s.habits || []).map(h => Object.assign({area:null, weeklyTarget:5, minVersion:''}, h));
  Object.keys(s.habitLog || {}).forEach(k => Object.keys(s.habitLog[k] || {}).forEach(id => {
    if (s.habitLog[k][id] === true) s.habitLog[k][id] = 'done';
  }));
  s.goals = (s.goals||[]).map(g=>Object.assign({area:null,paused:false,lastProgressAt:g.createdAt||Date.now(),recordId:null},g));
  s.goalRecords=s.goalRecords||[];
  s.goals.filter(g=>g.done).forEach(g=>{
    let rec=s.goalRecords.find(r=>r.sourceGoalId===g.id);
    if(!rec){rec={id:uid(),sourceGoalId:g.id,title:g.title,why:g.why||'',area:g.area||null,completedAt:g.doneAt||Date.now(),steps:(g.steps||[]).map(x=>({title:x.title}))};s.goalRecords.push(rec);}
    g.recordId=rec.id;
  });
  s.weeklyReviews=s.weeklyReviews||{};
  s.habitLog = s.habitLog || {}; s.reflections = s.reflections || {};
  s.recurrences = s.recurrences || [];
  s.settings = Object.assign({lastOpenDay:tk,lastBackupAt:null,lastAutoBackupDay:null,viewPrefs:{},onboardingDismissed:false,recentEmojis:[],textSize:'normal',haptics:true}, s.settings || {});
  /* v7:習慣補上建立日(影響熱度圖分母),待辦補上未來排程日 */
  s.habits.forEach(h => { if (!h.createdAt) h.createdAt = 0; });
  s.tasks.forEach(t => { if (t.dueDate === undefined) t.dueDate = null; });
  s.v = 7;
  return s;
}

/* =================== 計算 =================== */
const activeHabits = () => state.habits;
const habitStatus = (hid, k) => state.habitLog[k] && state.habitLog[k][hid] || null;
const isChecked = (hid, k) => habitStatus(hid, k) === true || habitStatus(hid, k) === 'done';
const isRest = (hid, k) => habitStatus(hid, k) === 'rest';
function toggleHabit(hid, k){
  const day = state.habitLog[k] || (state.habitLog[k] = {});
  if (isChecked(hid, k)) delete day[hid]; else day[hid] = 'done';
  if (!Object.keys(day).length) delete state.habitLog[k];
  save();
}
function toggleHabitRest(hid, k){
  const day = state.habitLog[k] || (state.habitLog[k] = {});
  if (isRest(hid, k)) delete day[hid]; else day[hid] = 'rest';
  if (!Object.keys(day).length) delete state.habitLog[k];
  save();
}
/* 連續天數:休息日跳過不中斷,但一旦走到有紀錄以前的日子就停,不會空轉 */
function earliestLogKey(){
  const ks = Object.keys(state.habitLog);
  return ks.length ? ks.sort()[0] : todayKey();
}
function habitStreak(hid){
  let d = new Date(); let c = 0, guard = 0;
  const floor = earliestLogKey();
  if (!isChecked(hid, dkey(d))) d = addDays(d, -1);
  while (guard++ < 3660) {
    const k = dkey(d);
    if (k < floor) break;
    if (isRest(hid, k)) { d = addDays(d, -1); continue; }
    if (!isChecked(hid, k)) break;
    c++; d = addDays(d, -1);
  }
  return c;
}
/* 本週(週一起算)的打卡次數 —— 比嚴格連續更溫和,也更容易長期維持 */

    if(g&&g.done&&g.recordId)return; /* 完成紀錄已封存,後續待辦變動不回寫歷史 */
    const s = g && g.steps.find(x => x.id === t.stepId);

  }
}

    state.goalRecords.unshift(rec);g.recordId=rec.id;

}

  const goalIds = new Set(completed.filter(t=>t.goalId).map(t=>t.goalId));
  let habitDone = 0, reflectDays = 0; const moods = [];
  for (let d = fromKey(fromKeyStr); dkey(d) < toKeyStr; d = addDays(d,1)){
    const k = dkey(d);
    state.habits.forEach(h => { if (isChecked(h.id,k)) habitDone++; });
    const r = state.reflections[k];
    if (r && (r.mood || (r.text||'').trim())) reflectDays++;
    if (r && r.mood) moods.push(r.mood);
  }
  const goalsDone = state.goalRecords.filter(r=>r.completedAt>=from&&r.completedAt<to).length;
  return {completed:completed.length, focusDone:focus.filter(t=>t.done).length, focusTotal:focus.length,
    goalProgress:goalIds.size, goalsDone, habitDone, reflectDays,
    moodAvg: moods.length ? (moods.reduce((x,y)=>x+y,0)/moods.length).toFixed(1) : null};
}
function scopeRange(scope){
  const now = new Date();
  if (scope === 'month'){ const s = new Date(now.getFullYear(), now.getMonth(), 1); return [dkey(s), dkey(new Date(now.getFullYear(), now.getMonth()+1, 1)), `${now.getMonth()+1} 月`]; }
  if (scope === 'year'){ return [dkey(new Date(now.getFullYear(),0,1)), dkey(new Date(now.getFullYear()+1,0,1)), `${now.getFullYear()} 年`]; }
  const s = weekStart(); return [dkey(s), dkey(addDays(s,7)), `${fmtMD(dkey(s))} 起`];
}

/* 熱度只以「那天真的存在的習慣」為分母,之後新增習慣不會回頭改寫歷史的顏色;
   標為休息的不列入分母,休息日因此不會被算成失敗。 */
function habitsLiveOn(k){ return activeHabits().filter(h => dkey(new Date(h.createdAt || 0)) <= k); }
function heatLevel(k){
  const due = habitsLiveOn(k).filter(h => !isRest(h.id, k));
  if (!due.length) return 0;
  const c = due.filter(h => isChecked(h.id, k)).length;
  if (!c) return 0;
  const f = c / due.length;
  return f <= .25 ? 1 : f <= .5 ? 2 : f <= .75 ? 3 : 4;
}
function heatmapHTML(){
  const base = new Date();
  const view = new Date(base.getFullYear(), base.getMonth() + ui.hmOffset, 1);
  const y = view.getFullYear(), m = view.getMonth();
  const days = new Date(y, m + 1, 0).getDate();
  const tk = todayKey();
  /* 週一開始 */
  const lead = (view.getDay() + 6) % 7;
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push('<span class="hm-cell blank" aria-hidden="true"></span>');
  for (let d = 1; d <= days; d++){
    const k = `${y}-${pad(m+1)}-${pad(d)}`;
    const future = k > tk;
    const lv = future ? 0 : heatLevel(k);
    const live = future ? [] : habitsLiveOn(k);
    const doneN = live.filter(h => isChecked(h.id, k)).length;
    const restN = live.filter(h => isRest(h.id, k)).length;
    const lab = future ? `${fmtMD(k)} 尚未到來`
      : `${fmtMD(k)} 週${WD[fromKey(k).getDay()]}${live.length ? ` · 完成 ${doneN}/${live.length}${restN?` · 休息 ${restN}`:''}` : ''}`;
    cells.push(`<button class="hm-cell ${future ? 'future' : 'lv' + lv} ${k === tk ? 'today' : ''} ${k === ui.hmSel && !future ? 'sel' : ''}"
      ${future ? 'disabled' : `data-act="hm-pick" data-k="${k}"`} aria-label="${lab}" title="${lab}"${k === ui.hmSel && !future ? ' aria-current="date"' : ''}>${d}</button>`);
  }
  const wd = ['一','二','三','四','五','六','日'].map(w => `<div class="hm-wd">${w}</div>`).join('');
  return `<div class="hm-head">
      <button class="hm-nav" data-act="hm-nav" data-d="-1" aria-label="上個月">${ICONS.left}</button>
      <div class="m">${y} 年 ${m + 1} 月</div>
      <button class="hm-nav" data-act="hm-nav" data-d="1" ${ui.hmOffset >= 0 ? 'disabled' : ''} aria-label="下個月">${ICONS.right}</button>
    </div>
    <div class="hm-grid">${wd}${cells.join('')}</div>
    <div class="hm-legend">少 <i style="background:var(--h0)"></i><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i> 多</div>`;
}

            <span>${k === tk ? '今' : WD[d.getDay()]}</span>

      </div>
      ${habitTrendHTML(h)}
    </div>`;
  }).join('') : `
  <div class="card">
    <div class="empty"><div class="big">🌱</div>還沒有習慣,從一個小小的開始吧</div>
    <div class="seg" style="justify-content:center">${SUGGEST_HABITS.map(s => `<button class="chip" data-act="habit-suggest" data-e="${s.e}" data-n="${s.n}" data-a="${s.a}">${s.e} ${s.n}</button>`).join('')}</div>

/* 往年的今天:同月同日的舊紀錄。沒有的話,就從過去隨機翻一頁出來。 */
function onThisDay(){
  const now = new Date(), out = [];
  for (let y = 1; y <= 20; y++){
    const d = new Date(now.getFullYear()-y, now.getMonth(), now.getDate());
    if (d.getMonth() !== now.getMonth()) continue;      /* 2/29 之類的日子不硬湊 */
    const k = dkey(d), r = state.reflections[k];
    if (r && (r.mood || (r.text||'').trim())) out.push({k, lb:`${y} 年前的今天`, r});
  }
  return out;
}
function randomPastReflection(seed){
  const tk = todayKey();
  const ks = Object.keys(state.reflections).filter(k => k < tk && state.reflections[k] && (state.reflections[k].text||'').trim());
  if (ks.length < 5) return null;                        /* 紀錄太少時不做「回顧」,免得每天都翻到同一篇 */
  const k = ks[Math.abs(hashInt(tk + '|' + (seed||0))) % ks.length];
  return {k, lb:'從前的某一天', r:state.reflections[k]};
}
const hashInt = s => { let h = 2166136261; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h,16777619); } return h|0; };

/* =================== 反思頁 =================== */

/* 可讀版匯出:備份檔是給程式看的,這份是給你自己看的 —— 換手機、換 App、印出來都帶得走 */
function exportMarkdown(){
  const L = [];
  const now = new Date();
  L.push(`# 人生手帳`, ``, `匯出於 ${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`, ``);

  const act = state.goals.filter(g=>!g.done&&!g.paused), paused = state.goals.filter(g=>!g.done&&g.paused);
  if (act.length || paused.length || state.goalRecords.length){
    L.push(`## 人生目標`, ``);
    const gline = g => {
      const p = goalProgress(g), a = areaOf(g.area);
      L.push(`### ${g.title}${a?`　·　${a.lb}`:''}`);
      if (g.why) L.push(`> ${g.why}`);
      L.push(``, `進度 ${p.d}/${p.t} 步`, ``);
      g.steps.forEach(s => L.push(`- [${s.done?'x':' '}] ${s.title}`));
      L.push(``);
    };
    act.forEach(gline);
    if (paused.length){ L.push(`### 暫時放下`, ``); paused.forEach(gline); }
    if (state.goalRecords.length){
      L.push(`### 🏆 完成紀錄`, ``);
      [...state.goalRecords].sort((a,b)=>(b.completedAt||0)-(a.completedAt||0)).forEach(r=>{
        const d = new Date(r.completedAt||Date.now());
        L.push(`- **${r.title}** — 完成於 ${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日${r.why?`（${r.why}）`:''}`);
      });
      L.push(``);
    }
  }

  if (state.habits.length){
    L.push(`## 習慣`, ``);
    state.habits.forEach(h=>{
      const wc = habitWeekCount(h.id), stk = habitStreak(h.id);
      const total = Object.keys(state.habitLog).filter(k=>isChecked(h.id,k)).length;
      const a = areaOf(h.area);
      L.push(`- ${h.emoji} **${h.name}**　本週 ${wc}/${h.weeklyTarget||5}　累計 ${total} 次${stk>=2?`　目前連續 ${stk} 天`:''}${a?`　·　${a.lb}`:''}${h.minVersion?`\n  - 最低版本：${h.minVersion}`:''}`);
    });
    L.push(``);
  }

  const open = state.tasks.filter(t=>!t.done);
  if (open.length){
    L.push(`## 待辦`, ``);
    [['today','今天'],['week','本週'],['later','之後']].forEach(([b,lb])=>{
      const list = open.filter(t=>t.bucket===b);
      if (!list.length) return;
      L.push(`### ${lb}`, ``);
      list.forEach(t=>{ const a=areaOf(t.area); L.push(`- [ ] ${t.focus?'◆ ':''}${t.title}${a?`　·　${a.lb}`:''}`); });
      L.push(``);
    });
  }
  const doneTasks = state.tasks.filter(t=>t.done&&t.doneAt).sort((a,b)=>b.doneAt-a.doneAt);
  if (doneTasks.length){
    L.push(`## 已完成（共 ${doneTasks.length} 件）`, ``);
    doneTasks.slice(0,300).forEach(t=>L.push(`- [x] ${t.title}　${fmtMD(dkey(new Date(t.doneAt)))}`));
    if (doneTasks.length>300) L.push(`- …另有 ${doneTasks.length-300} 件`);
    L.push(``);
  }

  const rk = Object.keys(state.reflections).sort().reverse();
  if (rk.length){
    L.push(`## 每日反思（共 ${rk.length} 篇）`, ``);
    rk.forEach(k=>{
      const r = state.reflections[k], m = MOODS.find(x=>x.v===r.mood);
      L.push(`### ${fmtFull(k)}${m?`　${m.e} ${m.lb}`:''}`, ``);
      if (r.text) L.push(r.text, ``);
    });
  }

  const wk = Object.keys(state.weeklyReviews).sort().reverse().filter(k=>{const r=state.weeklyReviews[k];return r&&(r.proud||r.adjust||r.next);});
  if (wk.length){
    L.push(`## 每週回顧`, ``);
    wk.forEach(k=>{
      const r = state.weeklyReviews[k];
      L.push(`### ${fmtMD(k)} 那一週`, ``);
      if (r.proud) L.push(`- **最想肯定自己的**：${r.proud}`);
      if (r.adjust) L.push(`- **想調整的**：${r.adjust}`);
      if (r.next) L.push(`- **想守住的一件事**：${r.next}`);
      L.push(``);
    });
  }
  return L.join('\n');
}
function downloadText(name, text, mime){
  const blob = new Blob([text], {type:(mime||'text/plain')+';charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
function doImport(text){
  try{
    const obj = JSON.parse(text);
    const data = obj && obj.data && Array.isArray(obj.data.tasks) ? obj.data : (Array.isArray(obj.tasks) ? obj : null);
    if (!data) throw 0;
    /* 結構檢查:寧可擋下來,也不要把壞掉的檔案蓋掉現有紀錄 */
    if (!Array.isArray(data.tasks) || (data.habits && !Array.isArray(data.habits))
      || (data.goals && !Array.isArray(data.goals))
      || (data.reflections && typeof data.reflections !== 'object')) throw 0;
    const when = obj.exportedAt ? new Date(obj.exportedAt) : null;
    const whenTxt = when && !isNaN(when) ? `備份時間:${when.toLocaleString('zh-TW',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}<br>` : '';
    const newer = data.v && data.v > defaultState().v;
    confirmSheet('確定要還原嗎?', `${whenTxt}將以備份內容<b>覆蓋</b>目前資料。目前的資料會先自動留一份復原點。<br>備份含:${(data.tasks||[]).length} 筆待辦、${(data.habits||[]).length} 個習慣、${Object.keys(data.reflections||{}).length} 篇反思、${(data.goals||[]).length} 個目標。${newer?'<br><br>⚠️ 這份備份來自比目前更新的版本,部分內容可能無法顯示。':''}`, '還原', () => {
      try{localStorage.setItem(PRE_IMPORT_KEY,JSON.stringify(state));}catch(e){}
      store.autoBackup(state);
      state = Object.assign(defaultState(), migrate(data) || data);
      Object.assign(ui, state.settings.viewPrefs||{});
      save(); render(); toast('已還原備份 ✓');
    });
  }catch(e){ toast('這不是有效的備份內容'); }
}

    <div class="sheet-actions">
      <button class="btn plain" data-act="sheet-close">取消</button>
      <button class="btn" data-act="import-paste-go">還原</button>
    </div>`),
  'import-paste-go': () => { const v = ($('#pasteArea') && $('#pasteArea').value || '').trim(); if (v) doImport(v); },
  'restore-pre-import':()=>confirmSheet('復原上次匯入前的資料?','目前內容會被取代;復原完成後仍可再匯入你的備份檔。','復原',()=>{try{const raw=localStorage.getItem(PRE_IMPORT_KEY);const data=raw&&JSON.parse(raw);if(!data)throw 0;state=Object.assign(defaultState(),migrate(data)||data);save();render();toast('已復原匯入前的資料');}catch(e){toast('找不到可復原的資料');}}),
  'restore-auto':d=>confirmSheet('復原這個自動版本?','目前資料會先再建立一個復原點,然後換成所選版本。','復原',()=>{try{const b=store.backups()[Number(d.i)];if(!b)throw 0;store.autoBackup(state);state=Object.assign(defaultState(),migrate(b.data)||b.data);save();render();toast('已復原自動版本');}catch(e){toast('無法復原這個版本');}}),
  'rescue-data':()=>{try{const data=JSON.parse(pendingRescueRaw);state=Object.assign(defaultState(),migrate(data)||data);store.loadError=false;save();closeSheet();render();toast('已復原最近的安全快照');}catch(e){toast('快照無法讀取,請使用備份檔');}},
  'wipe': () => confirmSheet('清除全部資料?', '所有待辦、習慣、反思與目標將<b>永久刪除</b>。建議先下載備份。', '全部清除', () => {
    try{localStorage.removeItem(AUTO_BACKUP_KEY);localStorage.removeItem(PRE_IMPORT_KEY);}catch(e){}idbMirror.clear();state=defaultState();save();render();toast('已清空,重新開始');
  }, true)
};

/* 事件委派 */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = actions[el.dataset.act];
  if (act){ e.preventDefault(); act(el.dataset, el, e); }
});
document.addEventListener('keydown', e => {
  if(e.key==='Escape'&&$('#sheetRoot').children.length){e.preventDefault();closeSheet();return;}
  if(e.key==='Tab'&&$('#sheetRoot').children.length){
    const f=[...$('#sheetRoot').querySelectorAll('button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(x=>x.offsetParent!==null);
    if(f.length){const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
  }
  if (e.key === 'Enter'){
    if (e.isComposing || e.keyCode === 229) return;   /* 注音選字的 Enter 不算送出 */
    const el = e.target.closest('[data-enter]');
    if (!el) return;
    e.preventDefault();
    const act = actions[el.dataset.enter];
    if (act) act(el.dataset, el, e);
    return;
  }
  /* 桌面快捷鍵:只在沒有打字、也沒有開彈窗的時候作用 */
  if (e.metaKey || e.ctrlKey || e.altKey || e.isComposing) return;
  if ($('#sheetRoot').children.length) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
  const tabIdx = ['1','2','3','4','5'].indexOf(e.key);
  if (tabIdx >= 0){ e.preventDefault(); go(TABS[tabIdx].id); return; }
  if (e.key === '/'){ e.preventDefault(); globalSearchSheet(''); return; }
  if (e.key === '?'){ e.preventDefault(); shortcutsSheet(); return; }
  if (e.key === 'n' || e.key === 'N'){
    const box = $('#qaFocus') || $('#qaTodo') || $('#qaToday');
    if (box){ e.preventDefault(); box.scrollIntoView({behavior:reduceMotion()?'auto':'smooth', block:'center'}); setTimeout(()=>box.focus(), reduceMotion()?0:220); }
  }
});
function shortcutsSheet(){
  const rows = [['1 – 5','切換分頁(今日、待辦、習慣、反思、目標)'],['N','游標移到快速新增'],['/','搜尋整本手帳'],['Esc','關閉彈窗'],['?','打開這張表']];
  openSheet(`<h2>鍵盤快捷鍵</h2>
    <div class="hint" style="margin-bottom:6px">在電腦上打開時可以用,手機不受影響。</div>
    ${rows.map(([k,v])=>`<div class="row" style="padding:9px 2px;border-bottom:1px dashed var(--line-soft)"><kbd class="kbd">${k}</kbd><span class="grow" style="font-size:14px;color:var(--ink2)">${v}</span></div>`).join('')}
    <div class="sheet-actions"><button class="btn full" data-act="sheet-close">知道了</button></div>`);
}
/* 開始打字時才展開領域選項,平時保持畫面安靜 */
document.addEventListener('focusin', e => {
  const w = e.target.closest && e.target.closest('.quickadd-wrap');
  if (w) w.classList.add('qa-open');
});
/* 注音、拼音等組字中不重繪畫面,否則打到一半的字會被吃掉 */
let composing = false;
document.addEventListener('compositionstart', () => { composing = true; });
document.addEventListener('compositionend', e => {
  composing = false;
  if (e.target && e.target.dataset && e.target.dataset.input) e.target.dispatchEvent(new Event('input', {bubbles:true}));
});
/* 反思自動儲存 */
let refT = null;
document.addEventListener('input', e => {
  const el = e.target;
  if (el.matches('textarea.field')) autoGrow(el);
  if(el.dataset.input==='todo-search'){
    clearTimeout(el._searchT);el._searchT=setTimeout(()=>{if(composing)return;ui.todoQuery=el.value;render();const n=$('#todoSearch');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}},220);
  }
  if(el.dataset.input==='ref-search'){
    clearTimeout(el._searchT);el._searchT=setTimeout(()=>{if(composing)return;ui.refQuery=el.value;render();const n=$('#refSearch');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}},220);
  }
  if(el.dataset.input==='week-review'){
    clearTimeout(el._reviewT);el._reviewT=setTimeout(()=>{const k=currentWeekKey(),r=state.weeklyReviews[k]||(state.weeklyReviews[k]={});r[el.dataset.key]=el.value;r.updatedAt=Date.now();save();flashSaved();},300);
  }
  if(el.dataset.input==='global-search'){
    clearTimeout(el._globalT);const v=el.value;
    el._globalT=setTimeout(()=>{const box=$('#globalResults');if(box)box.innerHTML=searchResultsHTML(v);},160);
  }
  if (el.dataset.input === 'ref-text'){
    clearTimeout(refT);
    refT = setTimeout(() => {
      const k = todayKey();
      const v = el.value;
      const r = state.reflections[k] || (state.reflections[k] = {});
      r.text = v; r.updatedAt = Date.now();
      if (!(v || '').trim() && !r.mood) delete state.reflections[k];
      save(); flashSaved();
    }, 400);
  }
  if (el.dataset.input === 'ref-sheet'){
    clearTimeout(refT);
    refT = setTimeout(() => {
      const k = el.dataset.k;
      const r = state.reflections[k] || (state.reflections[k] = {});
      r.text = el.value; r.updatedAt = Date.now();
      if (!(el.value || '').trim() && !r.mood) delete state.reflections[k];
      save(); renderSoon();
    }, 400);
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.change==='todo-sort'){ui.todoSort=el.value;persistViewPrefs();render();}
});
let draggedTaskId=null;
document.addEventListener('dragstart',e=>{const item=e.target.closest('.t-item[draggable="true"]');if(!item)return;draggedTaskId=item.dataset.taskId;item.classList.add('dragging');if(e.dataTransfer)e.dataTransfer.effectAllowed='move';});
document.addEventListener('dragend',e=>{document.querySelectorAll('.dragging,.drag-over').forEach(x=>x.classList.remove('dragging','drag-over'));draggedTaskId=null;});
document.addEventListener('dragover',e=>{const zone=e.target.closest('.drop-zone,.today-drop-zone');if(!zone||!draggedTaskId)return;e.preventDefault();document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));zone.classList.add('drag-over');});
document.addEventListener('drop',e=>{
  const todayZone=e.target.closest('.today-drop-zone');
  if(todayZone&&draggedTaskId){e.preventDefault();const target=e.target.closest('[data-task-id]');if(reorderTodayTask(draggedTaskId,target&&target.dataset.taskId,todayZone.dataset.todayGroup)){render();toast('已調整今天的順序');}return;}
  const zone=e.target.closest('.drop-zone');if(!zone||!draggedTaskId)return;e.preventDefault();
  const t=taskById(draggedTaskId),bucket=zone.dataset.bucket,target=e.target.closest('.t-item[data-task-id]');if(!t)return;
  const list=state.tasks.filter(x=>!x.done&&x.bucket===bucket&&x.id!==t.id).sort((a,b)=>(a.order??0)-(b.order??0));
  const at=target?Math.max(0,list.findIndex(x=>x.id===target.dataset.taskId)):list.length;list.splice(at<0?list.length:at,0,t);
  list.forEach((x,i)=>x.order=i);t.bucket=bucket;t.focus=t.focus&&bucket==='today';t.scheduledDate=bucket==='today'?todayKey():null;
  ui.todoSort='custom';ui.todoDir='asc';save();render();toast(`已移到${{today:'今天',week:'本週',later:'之後'}[bucket]}`);
});
let touchDrag=null;
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest('[data-touch-drag]');if(!h||e.pointerType==='mouse')return;
  const item=h.closest('[data-task-id]');touchDrag={id:h.dataset.touchDrag,pointer:e.pointerId,item,startY:e.clientY,moved:false};h.setPointerCapture&&h.setPointerCapture(e.pointerId);item&&item.classList.add('touch-dragging');e.preventDefault();
});
document.addEventListener('pointermove',e=>{
  if(!touchDrag||e.pointerId!==touchDrag.pointer)return;touchDrag.moved=touchDrag.moved||Math.abs(e.clientY-touchDrag.startY)>8;
  document.querySelectorAll('.drag-target').forEach(x=>x.classList.remove('drag-target'));
  const under=document.elementFromPoint(e.clientX,e.clientY);const target=under&&under.closest('[data-task-id],.today-drop-zone,.drop-zone');if(target)target.classList.add('drag-target');e.preventDefault();
});
document.addEventListener('pointerup',e=>{
  if(!touchDrag||e.pointerId!==touchDrag.pointer)return;const under=document.elementFromPoint(e.clientX,e.clientY);const target=under&&under.closest('[data-task-id]');const todayZone=under&&under.closest('.today-drop-zone');const todoZone=under&&under.closest('.drop-zone');
  if(touchDrag.moved&&todayZone){reorderTodayTask(touchDrag.id,target&&target.dataset.taskId,todayZone.dataset.todayGroup);render();toast('已調整今天的順序');}
  else if(touchDrag.moved&&todoZone){const t=taskById(touchDrag.id);if(t){t.bucket=todoZone.dataset.bucket;t.focus=t.focus&&t.bucket==='today';t.scheduledDate=t.bucket==='today'?todayKey():null;t.order=nextTaskOrder(t.bucket);save();render();toast('已移動待辦');}}
  document.querySelectorAll('.touch-dragging,.drag-target').forEach(x=>x.classList.remove('touch-dragging','drag-target'));touchDrag=null;
});
$('#importFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => doImport(rd.result);
  rd.readAsText(f);
  e.target.value = '';
});
function autoGrow(ta){ ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight + 2, 320) + 'px'; }
function flashSaved(){ const s = $('#saveInd'); if (!s) return; s.classList.add('show'); clearTimeout(flashSaved._h); flashSaved._h = setTimeout(() => s.classList.remove('show'), 1400); }
let rsT = null;
function renderSoon(){ clearTimeout(rsT); rsT = setTimeout(render, 250); }

/* =================== 啟動 =================== */
updateStorageBanner();
document.body.classList.toggle('text-large',state.settings.textSize==='large');
/* 有附 sw.js 的完整部署才註冊;單檔使用時不會在主控台留下 404 */
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  fetch('./sw.js',{method:'HEAD'}).then(r=>{ if(r.ok) return navigator.serviceWorker.register('./sw.js'); }).catch(()=>{});
}
ensureRecurringTasks(todayKey());promoteScheduled(todayKey());
if(!store.loadError){
  if(state.settings.lastAutoBackupDay!==todayKey()){store.autoBackup(state);state.settings.lastAutoBackupDay=todayKey();}
  store.save(state);   /* 把升級後的結構寫回,避免舊格式殘留 */
}
render();
setTimeout(()=>{
  if(store.loadError){offerDataRescue();return;}
  if(!state.settings.lastOpenDay){state.settings.lastOpenDay=todayKey();save();}
  else if(state.settings.lastOpenDay<todayKey())rolloverSheet();
},120);
/* 跨日自動更新(手機常駐主畫面時) */
let lastDay = todayKey();
function onNewDay(k){
  lastDay = k; ui.hmSel = k; ui.hmOffset = 0; _nextOccCache.clear();
  ensureRecurringTasks(k); promoteScheduled(k); celebrated = null;
  render(); setTimeout(rolloverSheet, 120);
}
setInterval(() => { const k = todayKey(); if (k !== lastDay) onNewDay(k); }, 30000);
/* 從背景切回來(手機常見)時也立刻對一次日期,不用等下一次輪詢 */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const k = todayKey(); if (k !== lastDay) onNewDay(k);
});
</script>
